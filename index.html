<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Crew Flying Tracker</title>
    
    <!-- iOS / PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StratoSched">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">

    <script>
        // Apply the saved layout choice (auto / mobile / desktop) before first paint.
        (function () {
            try {
                var l = localStorage.getItem('flyfair_layout');
                if (l === 'desktop') document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=1200');
                if (l === 'mobile') document.documentElement.classList.add('force-mobile');
            } catch (e) {}
        })();
    </script>
    <script>
        // Apply saved (or system) theme before first paint.
        (function () {
            var dark = false;
            try {
                var saved = localStorage.getItem('flyfair_theme');
                dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            } catch (e) {}
            if (dark) { document.documentElement.classList.add('dark'); var tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', '#0a0a0a'); }
        })();
    </script>

    <!-- Fonts, Icons, and Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Firebase (shared cloud data + login) -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #f1f5f9;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        

        /* --- Dark theme: charcoal + gold, taken from the 91 ARS squadron patch.
               Overrides the utility classes the app uses; yellow is the accent. --- */

        html.dark body { background-color: #0a0a0a; color: #e5e5e5; }
        html.dark ::-webkit-scrollbar-thumb { background: #333; }
        html.dark ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }

        /* surfaces */

        html.dark .bg-slate-100 { background-color: #222; }

        /* text and borders (neutral greys, no blue cast) */
        html.dark .text-slate-900, html.dark .text-slate-800 { color: #f5f5f5; }

        html.dark .text-blue-200 { color: rgba(10,10,10,.55); }
        html.dark .text-blue-500, html.dark .text-blue-600, html.dark .text-blue-700, html.dark .hover\:text-blue-600:hover, html.dark .hover\:text-blue-700:hover { color: var(--gold); }
        html.dark .bg-blue-50 { background-color: rgba(245,196,0,.10); }

        html.dark .hover\:bg-blue-50:hover, html.dark .hover\:bg-blue-50\/60:hover { background-color: rgba(245,196,0,.12); }
        html.dark .hover\:bg-blue-200:hover { background-color: rgba(245,196,0,.28); }
        html.dark .border-blue-600, html.dark .border-blue-500, html.dark .hover\:border-blue-500:hover, html.dark .focus\:border-blue-500:focus { border-color: var(--gold); }
        html.dark .border-blue-200 { border-color: rgba(245,196,0,.4); }
        html.dark .focus\:ring-blue-500:focus, html.dark .ring-blue-500 { --tw-ring-color: var(--gold); }

        /* status colours stay readable on charcoal */
        html.dark .bg-red-100 { background-color: rgba(239,68,68,.2); }
        html.dark .bg-amber-50 { background-color: rgba(245,158,11,.14); }
        html.dark .text-red-700 { color: #fca5a5; }
        html.dark .text-red-600, html.dark .hover\:text-red-600:hover { color: #f87171; }
        html.dark .text-amber-700 { color: #fcd34d; }
        html.dark .text-amber-600 { color: #fbbf24; }
        html.dark .text-emerald-600 { color: #34d399; }
        html.dark .border-amber-200 { border-color: rgba(245,158,11,.45); }

        html.dark input, html.dark select, html.dark textarea { background-color: #101010; color: #e5e5e5; }
        html.dark input::placeholder, html.dark textarea::placeholder { color: #737373; }
        html.dark option { background-color: #101010; color: #e5e5e5; }


        /* --- Shareable report: always light "paper", independent of the app theme --- */
        .rp-sheet { background: #fff; color: #111827; border: 1px solid #cbd5e1; border-radius: 12px; padding: 28px 32px; max-width: 900px; font-size: 13px; line-height: 1.45; }
        .rp-sheet h1 { font-size: 22px; font-weight: 800; margin: 0; }
        .rp-sheet h2 { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 6px; padding-bottom: 4px; border-bottom: 2px solid #111827; }
        .rp-sheet h2, .rp-sheet h3 { break-after: avoid; page-break-after: avoid; }
        .rp-sheet h3 { font-size: 13px; font-weight: 700; margin: 14px 0 4px; }
        .rp-sheet .rp-sub { color: #475569; margin-top: 2px; }
        .rp-sheet .rp-msg { margin-top: 12px; padding: 8px 12px; background: #f1f5f9; border-left: 3px solid #2563eb; white-space: pre-wrap; }
        .rp-sheet table { width: 100%; border-collapse: collapse; margin-top: 4px; }
        .rp-sheet th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #475569; border-bottom: 1px solid #94a3b8; padding: 4px 8px 4px 0; }
        .rp-sheet td { padding: 4px 8px 4px 0; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
        .rp-sheet .rp-num { text-align: right; font-variant-numeric: tabular-nums; }
        .rp-sheet .rp-muted { color: #64748b; }
