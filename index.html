<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // --- CONSTANTS & SEED DATA ---
        const CREW_ROLES = ['Aircraft Commander (AC)', 'Pilot (P)', 'Boom Operator (BO)', 'Instructor (IP)', 'Instructor Boom (IB)'];
        const BUCKET_COLORS = ['#2563eb', '#059669', '#d97706', '#7c3aed', '#dc2626', '#0891b2', '#db2777', '#475569'];
        const PERIODS = [7, 30, 90];
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        const INITIAL_BUCKETS = [
            { id: 'b-1', name: 'Morning', start: '0600', end: '0900', color: BUCKET_COLORS[0], crewIds: ['c-001', 'c-002'] },
            { id: 'b-2', name: 'Midday', start: '1000', end: '1300', color: BUCKET_COLORS[1], crewIds: ['c-002', 'c-003'] },
            { id: 'b-3', name: 'Afternoon', start: '1400', end: '1700', color: BUCKET_COLORS[2], crewIds: ['c-001', 'c-003'] },
            { id: 'b-4', name: 'Night', start: '1800', end: '2100', color: BUCKET_COLORS[3], crewIds: ['c-001', 'c-002', 'c-003'] }
        ];

        const INITIAL_CREWS = [
            {
                id: 'c-001', crewName: 'Crew Alpha (E-11)',
                members: [
                    { id: 'm1', name: 'Capt Smith, J.', role: 'Aircraft Commander (AC)' },
                    { id: 'm2', name: '1st Lt Johnson, M.', role: 'Pilot (P)' },
                    { id: 'm3', name: 'TSgt Davis, R.', role: 'Boom Operator (BO)' }
                ]
            },
            {
                id: 'c-002', crewName: 'Crew Bravo (E-12)',
                members: [
                    { id: 'm4', name: 'Maj Wilson, K.', role: 'Aircraft Commander (AC)' },
                    { id: 'm5', name: 'Capt Lee, A.', role: 'Pilot (P)' },
                    { id: 'm6', name: 'SSgt Miller, T.', role: 'Boom Operator (BO)' }
                ]
            },
            {
                id: 'c-003', crewName: 'Crew Charlie (E-14)',
                members: [
                    { id: 'm7', name: 'Capt Taylor, R.', role: 'Aircraft Commander (AC)' },
                    { id: 'm8', name: '2nd Lt Brown, S.', role: 'Pilot (P)' },
                    { id: 'm9', name: 'A1C Clark, E.', role: 'Boom Operator (BO)' }
                ]
            }
        ];

        // --- FIREBASE (shared data + sign-in) ---
        // These web-app values identify the project and are safe to publish; access is enforced by Firestore rules.
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBsvEDV-sWUrPgorIPuW_J0sRiwp-dYzyU",
            authDomain: "stratosched.firebaseapp.com",
            projectId: "stratosched",
            storageBucket: "stratosched.firebasestorage.app",
            messagingSenderId: "739513309494",
            appId: "1:739513309494:web:f99a87c5d987cdd28cbb97"
        };

        // Master switch for shared cloud data + login. Leave false until the Firebase project is ready
        // (Email/Password enabled, users created, Firestore created, rules published); then set to true.
        const CLOUD_ENABLED = false;

        // Crews type just a username; Firebase needs an email-shaped login, so one is filled in behind the scenes.
        const USERNAME_EMAIL_DOMAIN = 'crews.example.com';
        const usernameToEmail = (u) => {
            const v = u.trim().toLowerCase();
            return v.includes('@') ? v : `${v}@${USERNAME_EMAIL_DOMAIN}`;
        };
        const emailToUsername = (e) => (e || '').replace(`@${USERNAME_EMAIL_DOMAIN}`, '');

        const authMessage = (err) => {
            switch (err && err.code) {
                case 'auth/invalid-credential':
                case 'auth/wrong-password':
                case 'auth/user-not-found':
                case 'auth/invalid-email':
                    return 'Wrong username or password.';
                case 'auth/too-many-requests': return 'Too many attempts. Wait a few minutes and try again.';
                case 'auth/network-request-failed': return 'Cannot reach the server. Check your connection.';
                case 'auth/operation-not-allowed': return 'Email/Password sign-in is not enabled in Firebase (Authentication → Sign-in method).';
                case 'auth/user-disabled': return 'This account has been disabled.';
                default: return `Sign-in failed${err && err.code ? ` (${err.code})` : ''}.`;
            }
        };

        // Canonical JSON (sorted keys, no undefined) so state and cloud documents compare reliably.
        const sortKeys = (v) => Array.isArray(v) ? v.map(sortKeys)
            : (v && typeof v === 'object') ? Object.fromEntries(Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => [k, sortKeys(v[k])])) : v;
        const canon = (v) => JSON.stringify(sortKeys(v));
        const clean = (v) => JSON.parse(JSON.stringify(v));

        // App state -> Firestore documents (all in the `tracker` collection):
        //   crew-<id>, bucket-<id>, day-<date> (that day's log + notes), gar-<date>.
        const buildDocs = (crews, buckets, log, notes, gar) => {
            const docs = {};
            let maxOrder = Math.max(-1, ...crews.map(c => Number.isFinite(c.order) ? c.order : -1));
            crews.forEach(c => { docs[`crew-${c.id}`] = clean({ ...c, type: 'crew', order: Number.isFinite(c.order) ? c.order : ++maxOrder }); });
            buckets.forEach(b => { docs[`bucket-${b.id}`] = clean({ ...b, type: 'bucket' }); });
            const dayNotes = {};
            Object.entries(notes).forEach(([key, text]) => {
                const [d, bucketId, crewId] = key.split('|');
                (dayNotes[d] = dayNotes[d] || {})[`${bucketId}|${crewId}`] = text;
            });
            new Set([...Object.keys(log), ...Object.keys(dayNotes)]).forEach(d => {
                docs[`day-${d}`] = clean({ type: 'day', date: d, byBucket: log[d] || {}, notes: dayNotes[d] || {} });
            });
            Object.entries(gar).forEach(([d, e]) => { docs[`gar-${d}`] = clean({ type: 'gar', date: d, crewId: e.crewId, note: e.note || '' }); });
            return docs;
        };

        // Data saved in this browser by the pre-cloud version, offered for a one-time import.
        const readLocalData = () => {
            try {
                if (localStorage.getItem('flyfair_crews') === null) return null;
            } catch (e) { return null; }
            return {
                crews: loadStored('flyfair_crews', []), buckets: loadStored('flyfair_buckets', []),
                log: loadStored('flyfair_log', {}), notes: loadStored('flyfair_notes', {}), gar: loadStored('flyfair_gar', {})
            };
        };

        // --- DATE & UTILITY HELPERS ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const pad2 = (n) => String(n).padStart(2, '0');
        const toDateStr = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        const todayStr = () => toDateStr(new Date());
        const addDays = (dateStr, n) => {
            const [y, m, d] = dateStr.split('-').map(Number);
            return toDateStr(new Date(y, m - 1, d + n));
        };
        const daysBetween = (fromStr, toStr) => {
            const [y1, m1, d1] = fromStr.split('-').map(Number);
            const [y2, m2, d2] = toStr.split('-').map(Number);
            return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
        };
        const prettyDate = (dateStr) => {
            const [y, m, d] = dateStr.split('-').map(Number);
            return `${WEEKDAYS[new Date(y, m - 1, d).getDay()]} ${d} ${MONTHS[m - 1].slice(0, 3)} ${y}`;
        };

        const formatMilTime = (timeStr) => {
            if (!timeStr) return '0000';
            return timeStr.toString().replace(':', '').padStart(4, '0');
        };
        const timeToMins = (timeStr) => {
            const str = formatMilTime(timeStr);
            return (parseInt(str.substring(0, 2), 10) || 0) * 60 + (parseInt(str.substring(2, 4), 10) || 0);
        };
        const bucketsOverlap = (a, b) => {
            const toRange = (x) => {
                const s = timeToMins(x.start);
                let e = timeToMins(x.end);
                if (e <= s) e += 24 * 60;
                return [s, e];
            };
            const [s1, e1] = toRange(a);
            const [s2, e2] = toRange(b);
            return Math.max(s1, s2) < Math.min(e1, e2);
        };
        // Crews designated to a bucket; a bucket with none designated is open to every crew.
        const designatedIds = (bucket, crews) => {
            const ids = (bucket.crewIds || []).filter(id => crews.some(c => c.id === id));
            return ids;
        };

        const sortBuckets = (buckets) => [...buckets].sort((a, b) => timeToMins(a.start) - timeToMins(b.start));

        const noteKey = (date, bucketId, crewId) => `${date}|${bucketId}|${crewId}`;

        const loadStored = (key, fallback) => {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : fallback;
            } catch (e) {
                return fallback;
            }
        };

        // Seed history relative to today so the demo always looks current.
        // A Flying Log note that mentions "GAR" counts as that crew pulling the ground alert that day.
        const isGarNote = (text) => /\bGAR\b/i.test(text || '');

        // Every GAR up to `today`: manually logged ones plus Flying Log entries whose note mentions "GAR".
        const collectGarEntries = (crews, gar, notes, buckets, today) => {
            const crewIds = new Set(crews.map(c => c.id));
            const bucketNames = Object.fromEntries((buckets || []).map(b => [b.id, b.name]));
            const list = [];
            Object.entries(gar).forEach(([d, e]) => {
                if (d <= today && crewIds.has(e.crewId)) list.push({ id: `m|${d}`, date: d, crewId: e.crewId, note: e.note || '', source: 'manual' });
            });
            Object.entries(notes || {}).forEach(([key, text]) => {
                const [d, bucketId, crewId] = key.split('|');
                if (!isGarNote(text) || d > today || !crewIds.has(crewId)) return;
                if (list.some(x => x.date === d && x.crewId === crewId)) return; // already logged manually
                list.push({ id: `n|${key}`, date: d, crewId, note: text, source: 'log', bucketName: bucketNames[bucketId] || '' });
            });
            return list.sort((a, b) => b.date.localeCompare(a.date));
        };

        // GAR (24-hour ground alert) history: gar[date] = { crewId, note }. One crew per day.
        const buildSeedGar = () => {
            const t = todayStr();
            return {
                [addDays(t, -17)]: { crewId: 'c-003', note: '' },
                [addDays(t, -10)]: { crewId: 'c-002', note: '' },
                [addDays(t, -5)]: { crewId: 'c-001', note: '' }
            };
        };

        const buildSeedLog = () => {
            const t = todayStr();
            const entry = (offset, bucketId, crewIds) => [addDays(t, offset), { [bucketId]: crewIds }];
            const log = {};
            [
                entry(-20, 'b-3', ['c-003']),
                entry(-9, 'b-1', ['c-001']),
                entry(-6, 'b-2', ['c-002']),
                entry(-4, 'b-1', ['c-001']),
                entry(-2, 'b-3', ['c-002'])
            ].forEach(([date, val]) => { log[date] = { ...(log[date] || {}), ...val }; });
            return log;
        };

        // --- FAIRNESS ENGINE ---
        // Flying "as of" a date: only days before asOf count (plus asOf itself when includeAsOf).
        const computeCrewStats = (crews, buckets, log, asOf, includeAsOf, periodDays) => {
            const bucketMap = Object.fromEntries(buckets.map(b => [b.id, b]));
            const windowStart = addDays(asOf, -periodDays);
            const stats = {};
            crews.forEach(c => { stats[c.id] = { crew: c, last: null, sorties: 0, perBucket: {}, lastByBucket: {} }; });

            Object.entries(log).forEach(([date, byBucket]) => {
                const counted = date < asOf || (includeAsOf && date === asOf);
                Object.entries(byBucket).forEach(([bucketId, crewIds]) => {
                    const bucket = bucketMap[bucketId];
                    if (!bucket) return;
                    crewIds.forEach(crewId => {
                        const s = stats[crewId];
                        if (!s) return;
                        if (counted) {
                            if (!s.last || date > s.last) s.last = date;
                            if (!s.lastByBucket[bucketId] || date > s.lastByBucket[bucketId]) s.lastByBucket[bucketId] = date;
                            if (date > windowStart) {
                                s.sorties += 1;
                                s.perBucket[bucketId] = (s.perBucket[bucketId] || 0) + 1;
                            }
                        }
                    });
                });
            });

            return Object.values(stats).map(s => ({
                ...s,
                daysSince: s.last ? daysBetween(s.last, asOf) : null,
                daysSinceByBucket: Object.fromEntries(Object.entries(s.lastByBucket).map(([id, d]) => [id, daysBetween(d, asOf)]))
            }));
        };

        // Longest gap first (never flown = top), then fewest sorties in the period, then name.
        const rankByFairness = (stats) => [...stats].sort((a, b) => {
            const da = a.daysSince === null ? Infinity : a.daysSince;
            const db = b.daysSince === null ? Infinity : b.daysSince;
            if (da !== db) return db - da;
            if (a.sorties !== b.sorties) return a.sorties - b.sorties;
            return a.crew.crewName.localeCompare(b.crew.crewName);
        });

        // Up-next order for the 24-hour GAR: never-done first, then longest since last GAR, then fewest total.
        // Whoever is on GAR today (asOf) goes to the bottom of this order only.
        const computeGarRotation = (crews, entries, asOf) => {
            const byCrew = Object.fromEntries(crews.map(c => [c.id, { crew: c, last: null, total: 0 }]));
            entries.forEach(({ date: d, crewId: id }) => {
                const r = byCrew[id];
                if (!r) return;
                r.total += 1;
                if (!r.last || d > r.last) r.last = d;
            });
            const onToday = new Set(entries.filter(x => x.date === asOf).map(x => x.crewId));
            return Object.values(byCrew).map(r => ({ ...r, daysSince: r.last ? daysBetween(r.last, asOf) : null })).sort((a, b) => {
                const ga = onToday.has(a.crew.id) ? 1 : 0;
                const gb = onToday.has(b.crew.id) ? 1 : 0;
                if (ga !== gb) return ga - gb;
                const da = a.daysSince === null ? Infinity : a.daysSince;
                const db = b.daysSince === null ? Infinity : b.daysSince;
                if (da !== db) return db - da;
                if (a.total !== b.total) return a.total - b.total;
                return a.crew.crewName.localeCompare(b.crew.crewName);
            });
        };

        // Per-bucket comparison: the bucket's assigned crews (or everyone if none assigned), longest gap in that bucket first.
        const bucketBreakdown = (bucket, stats, crews) => {
            const designated = designatedIds(bucket, crews);
            const inBucket = designated.length ? stats.filter(r => designated.includes(r.crew.id)) : stats;
            const outsiders = designated.length ? stats.filter(r => !designated.includes(r.crew.id) && (r.perBucket[bucket.id] || 0) > 0) : [];
            const rows = [...inBucket].sort((x, y) => {
                const dx = x.daysSinceByBucket[bucket.id] ?? Infinity;
                const dy = y.daysSinceByBucket[bucket.id] ?? Infinity;
                if (dx !== dy) return dy - dx;
                const cx = x.perBucket[bucket.id] || 0;
                const cy = y.perBucket[bucket.id] || 0;
                if (cx !== cy) return cx - cy;
                return x.crew.crewName.localeCompare(y.crew.crewName);
            });
            const counts = rows.map(r => r.perBucket[bucket.id] || 0);
            return { designated, rows, outsiders, avg: rows.length ? counts.reduce((a, c) => a + c, 0) / rows.length : 0, max: Math.max(1, ...counts) };
        };

        const sinceLabel = (days) => {
            if (days === null) return 'Never flown';
            if (days === 0) return 'Today';
            if (days === 1) return '1 day ago';
            return `${days} days ago`;
        };

        // --- SHARED UI COMPONENTS ---
        const Modal = ({ isOpen, title, onClose, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-fade-in-up">
                        <div className="flex justify-between items-center p-4 border-b border-slate-200 bg-slate-50">
                            <h3 className="font-bold text-lg text-slate-800">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-red-500 transition-colors">
                                <i className="fa-solid fa-xmark text-xl"></i>
                            </button>
                        </div>
                        <div className="overflow-y-auto p-4 flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onClose, isDanger = false }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 text-center animate-fade-in-up">
                        <div className={`w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 ${isDanger ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}>
                            <i className={`fa-solid ${isDanger ? 'fa-triangle-exclamation' : 'fa-circle-question'} text-3xl`}></i>
                        </div>
                        <h3 className="font-bold text-xl text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-600 mb-6 text-sm">{message}</p>
                        <div className="flex gap-3 justify-center">
                            <button onClick={onClose} className="px-4 py-2 rounded-lg font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">Cancel</button>
                            <button onClick={() => { onConfirm(); onClose(); }} className={`px-4 py-2 rounded-lg font-semibold text-white transition-colors ${isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                Confirm
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const PeriodToggle = ({ value, onChange }) => (
            <div className="inline-flex bg-white border border-slate-200 rounded-lg shadow-sm p-1 gap-1">
                {PERIODS.map(p => (
                    <button key={p} onClick={() => onChange(p)} className={`px-3 py-1 rounded-md text-sm font-bold transition-colors ${value === p ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
                        {p}d
                    </button>
                ))}
            </div>
        );

        const BucketDot = ({ color, className = '' }) => (
            <span className={`inline-block w-2.5 h-2.5 rounded-full flex-shrink-0 ${className}`} style={{ backgroundColor: color }}></span>
        );

        // --- DATA FORMS ---
        const CrewForm = ({ initialData, onSave, onCancel }) => {
            const [crewName, setCrewName] = useState(initialData?.crewName || '');
            const [members, setMembers] = useState(initialData?.members || [{ id: generateId(), name: '', role: 'Aircraft Commander (AC)' }]);

            const updateMember = (index, field, value) => {
                setMembers(members.map((m, i) => i === index ? { ...m, [field]: value } : m));
            };
            const addMember = () => setMembers([...members, { id: generateId(), name: '', role: 'Pilot (P)' }]);
            const removeMember = (index) => setMembers(members.filter((_, i) => i !== index));

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({ id: initialData?.id || generateId(), crewName, members });
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-6">
                    <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">Crew Name / Identifier</label>
                        <input required type="text" value={crewName} onChange={e => setCrewName(e.target.value)} placeholder="e.g. Crew Alpha (E-11)" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>

                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div className="flex justify-between items-center mb-3">
                            <h4 className="font-bold text-slate-800">Crew Members</h4>
                            <button type="button" onClick={addMember} className="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded-md font-semibold hover:bg-blue-200"><i className="fa-solid fa-plus mr-1"></i> Add Member</button>
                        </div>
                        <div className="space-y-3">
                            {members.map((m, idx) => (
                                <div key={m.id} className="flex gap-2 items-start bg-white p-2 rounded-lg border border-slate-200 shadow-sm relative group">
                                    <div className="flex-1">
                                        <input required type="text" placeholder="Name (e.g. Capt Smith, J.)" value={m.name} onChange={e => updateMember(idx, 'name', e.target.value)} className="w-full text-sm border-b border-slate-200 p-1 mb-1 outline-none focus:border-blue-500" />
                                        <select value={m.role} onChange={e => updateMember(idx, 'role', e.target.value)} className="text-sm bg-slate-50 border border-slate-200 rounded p-1 w-full">
                                            {CREW_ROLES.map(r => <option key={r} value={r}>{r}</option>)}
                                        </select>
                                    </div>
                                    <button type="button" onClick={() => removeMember(idx)} className="text-red-400 hover:text-red-600 p-1 absolute top-1 right-1 opacity-0 group-hover:opacity-100 transition-opacity"><i className="fa-solid fa-trash"></i></button>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="flex justify-end gap-3 pt-4 border-t border-slate-200">
                        <button type="button" onClick={onCancel} className="px-4 py-2 font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
                        <button type="submit" className="px-4 py-2 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm">Save Crew</button>
                    </div>
                </form>
            );
        };

        const BucketForm = ({ initialData, crews, onSave, onCancel }) => {
            const [name, setName] = useState(initialData?.name || '');
            const [start, setStart] = useState(initialData?.start ? formatMilTime(initialData.start) : '0800');
            const [end, setEnd] = useState(initialData?.end ? formatMilTime(initialData.end) : '1100');
            const [color, setColor] = useState(initialData?.color || BUCKET_COLORS[0]);
            const [crewIds, setCrewIds] = useState(() => designatedIds(initialData || {}, crews));
            const toggleCrew = (id) => setCrewIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);

            const validTime = (t) => /^\d{4}$/.test(t) && parseInt(t.slice(0, 2), 10) < 24 && parseInt(t.slice(2), 10) < 60;
            const canSave = name.trim() && validTime(start) && validTime(end) && start !== end;

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!canSave) return;
                onSave({ id: initialData?.id || generateId(), name: name.trim(), start, end, color, crewIds });
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-6">
                    <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">Bucket Name</label>
                        <input required type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Morning" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">Start (HHMM)</label>
                            <input type="text" value={start} onChange={e => setStart(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="0800" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none font-mono" />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">End (HHMM)</label>
                            <input type="text" value={end} onChange={e => setEnd(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="1100" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none font-mono" />
                        </div>
                        <p className="col-span-2 text-xs text-slate-500">An end time earlier than the start wraps past midnight.</p>
                    </div>
                    <div>
                        <label className="block text-sm font-bold text-slate-700 mb-2">Color</label>
                        <div className="flex flex-wrap gap-2">
                            {BUCKET_COLORS.map(c => (
                                <button type="button" key={c} onClick={() => setColor(c)} aria-label={`Color ${c}`}
                                    className={`w-8 h-8 rounded-full border-2 ${color === c ? 'border-slate-900 scale-110' : 'border-white shadow'}`} style={{ backgroundColor: c }}></button>
                            ))}
                        </div>
                    </div>
                    <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">Crews in this bucket</label>
                        <p className="text-xs text-slate-500 mb-2">These crews are tracked and compared against each other for this bucket. Leave all unselected to include every crew.</p>
                        <div className="flex flex-wrap gap-2">
                            {crews.map(c => (
                                <button type="button" key={c.id} onClick={() => toggleCrew(c.id)} aria-pressed={crewIds.includes(c.id)}
                                    className={`px-3 py-1 text-sm rounded-full border ${crewIds.includes(c.id) ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>
                                    {c.crewName}
                                </button>
                            ))}
                            {crews.length === 0 && <span className="text-xs text-slate-400 italic">Add crews on the Crews tab first.</span>}
                        </div>
                    </div>
                    <div className="flex justify-end gap-3 pt-4 border-t border-slate-200">
                        <button type="button" onClick={onCancel} className="px-4 py-2 font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
                        <button type="submit" disabled={!canSave} className="px-4 py-2 font-bold text-white bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 rounded-lg shadow-sm">Save Bucket</button>
                    </div>
                </form>
            );
        };


        // Manually entered 30-day flying time for a crew, stamped with the date it is current as of.
        const Time30Input = ({ crew, onUpdate }) => {
            const t = crew.time30 || { hours: '', asOf: '' };
            const today = todayStr();
            const age = t.asOf ? daysBetween(t.asOf, today) : null;
            const setField = (field, value) => {
                const next = { ...t, [field]: value };
                if (field === 'hours' && value !== '' && !next.asOf) next.asOf = today;
                onUpdate(crew.id, { time30: next });
            };
            return (
                <div className="flex flex-wrap items-center gap-2">
                    <input type="number" min="0" step="0.1" inputMode="decimal" value={t.hours} placeholder="hrs"
                        onChange={e => setField('hours', e.target.value)} aria-label={`${crew.crewName} 30-day hours`}
                        className="w-20 text-sm font-mono border border-slate-300 rounded-lg p-1.5 focus:ring-2 focus:ring-blue-500 outline-none" />
                    <span className="text-xs text-slate-500 font-semibold">as of</span>
                    <input type="date" max={today} value={t.asOf} onChange={e => setField('asOf', e.target.value)} aria-label={`${crew.crewName} 30-day time as-of date`}
                        className="text-sm border border-slate-300 rounded-lg p-1.5 focus:ring-2 focus:ring-blue-500 outline-none" />
                    {age !== null && age > 0 && <span className={`text-xs font-bold ${age > 7 ? 'text-amber-700' : 'text-slate-500'}`}>{age}d old</span>}
                </div>
            );
        };

        // --- VIEWS ---
        const DashboardView = ({ crews, buckets, log, period, setPeriod, onUpdateCrew }) => {
            const today = todayStr();
            const stats = useMemo(() => rankByFairness(computeCrewStats(crews, buckets, log, today, true, period)), [crews, buckets, log, period, today]);
            const sorted = sortBuckets(buckets);

            const totalSorties = stats.reduce((sum, s) => sum + s.sorties, 0);
            const avg = stats.length ? totalSorties / stats.length : 0;
            const maxSorties = Math.max(1, ...stats.map(s => s.sorties));
            const spread = stats.length ? Math.max(...stats.map(s => s.sorties)) - Math.min(...stats.map(s => s.sorties)) : 0;
            const longestGap = stats[0];

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Flying Fairness</h2>
                            <p className="text-sm text-slate-500 mt-1">How long since each crew last flew and how evenly flying has been spread. Counts logged days up to and including today.</p>
                        </div>
                        <PeriodToggle value={period} onChange={setPeriod} />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                            <p className="text-sm font-medium text-slate-500">Longest Gap</p>
                            <h3 className="text-xl font-bold text-blue-700 mt-1">{longestGap ? longestGap.crew.crewName : '—'}</h3>
                            <p className="text-xs text-slate-500 mt-1">{longestGap ? sinceLabel(longestGap.daysSince) : 'Add a crew to begin'}</p>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                            <p className="text-sm font-medium text-slate-500">Sorties ({period}d)</p>
                            <h3 className="text-3xl font-bold text-slate-800 mt-1">{totalSorties}</h3>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                            <p className="text-sm font-medium text-slate-500">Avg per Crew</p>
                            <h3 className="text-3xl font-bold text-slate-800 mt-1">{avg.toFixed(1)}</h3>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                            <p className="text-sm font-medium text-slate-500">Spread (max − min)</p>
                            <h3 className={`text-3xl font-bold mt-1 ${spread >= 3 ? 'text-red-600' : spread >= 2 ? 'text-amber-600' : 'text-emerald-600'}`}>{spread}</h3>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                            <h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm">Crews by time since last flown</h3>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse whitespace-nowrap">
                                <thead>
                                    <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider font-bold">
                                        <th className="p-4">#</th>
                                        <th className="p-4">Crew</th>
                                        <th className="p-4">Last Flown</th>
                                        <th className="p-4 min-w-[180px]">Sorties ({period}d)</th>
                                        <th className="p-4 min-w-[230px]">30-Day Time (manual)</th>
                                        {sorted.map(b => <th key={b.id} className="p-4"><BucketDot color={b.color} className="mr-1" />{b.name}</th>)}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {stats.map((s, idx) => {
                                        const diff = s.sorties - avg;
                                        const gapColor = s.daysSince === null ? 'text-red-700' : s.daysSince >= 14 ? 'text-red-700' : s.daysSince >= 7 ? 'text-amber-700' : 'text-slate-700';
                                        return (
                                            <tr key={s.crew.id} className="hover:bg-slate-50/80 transition-colors">
                                                <td className="p-4 text-sm font-bold text-slate-400">{idx + 1}</td>
                                                <td className="p-4 font-black text-slate-800">{s.crew.crewName}</td>
                                                <td className="p-4">
                                                    <div className={`text-sm font-bold ${gapColor}`}>{sinceLabel(s.daysSince)}</div>
                                                    {s.last && <div className="text-xs text-slate-500 font-mono">{s.last}</div>}
                                                </td>
                                                <td className="p-4">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-28 bg-slate-100 rounded-full h-3 overflow-hidden relative">
                                                            <div className="bg-indigo-500 h-full transition-all duration-500" style={{ width: `${(s.sorties / maxSorties) * 100}%` }}></div>
                                                            <div className="absolute top-0 h-full w-0.5 bg-slate-700" style={{ left: `${(avg / maxSorties) * 100}%` }} title="Average"></div>
                                                        </div>
                                                        <span className="text-sm font-bold text-slate-800">{s.sorties}</span>
                                                        {diff >= 1 && <span className="text-xs text-amber-700 bg-amber-50 border border-amber-200 px-1.5 rounded font-bold">+{diff.toFixed(1)}</span>}
                                                        {diff <= -1 && <span className="text-xs text-blue-700 bg-blue-50 border border-blue-200 px-1.5 rounded font-bold">{diff.toFixed(1)}</span>}
                                                    </div>
                                                </td>
                                                <td className="p-4">
                                                    <Time30Input crew={s.crew} onUpdate={onUpdateCrew} />
                                                </td>
                                                {sorted.map(b => <td key={b.id} className="p-4 text-sm text-slate-600">{s.perBucket[b.id] || 0}</td>)}
                                            </tr>
                                        );
                                    })}
                                    {stats.length === 0 && <tr><td colSpan={5 + sorted.length} className="p-8 text-center text-slate-400">No crews yet.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <p className="text-xs text-slate-500">The dark tick on each bar is the crew average. Amber/blue badges show crews at least one sortie above/below it.</p>

                    <div className="space-y-4">
                        <div>
                            <h3 className="text-lg font-bold text-slate-800">Breakdown by Bucket</h3>
                            <p className="text-sm text-slate-500">How each crew assigned to a bucket compares to the others in it, based only on flying logged in that bucket. Longest gap first. Assign crews on the Flying Buckets tab.</p>
                        </div>
                        <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                            {sorted.map(b => {
                                const { designated, rows, outsiders, avg: bAvg, max: bMax } = bucketBreakdown(b, stats, crews);
                                return (
                                    <div key={b.id} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="px-4 py-3 border-b border-slate-200 flex items-center gap-2 font-bold text-slate-800" style={{ backgroundColor: b.color + '1a' }}>
                                            <BucketDot color={b.color} />
                                            {b.name}
                                            <span className="font-mono text-xs text-slate-500 font-semibold">{formatMilTime(b.start)}-{formatMilTime(b.end)}</span>
                                            <span className="ml-auto text-xs text-slate-500 font-semibold">{designated.length ? `${designated.length} crews` : 'all crews'} · avg {bAvg.toFixed(1)} ({period}d)</span>
                                        </div>
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider font-bold">
                                                    <th className="p-3">Crew</th>
                                                    <th className="p-3">Last in bucket</th>
                                                    <th className="p-3">Sorties ({period}d)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {rows.map(r => {
                                                    const n = r.perBucket[b.id] || 0;
                                                    const d = r.daysSinceByBucket[b.id];
                                                    const diff = n - bAvg;
                                                    return (
                                                        <tr key={r.crew.id} className="hover:bg-slate-50/80">
                                                            <td className="p-3 text-sm font-bold text-slate-800">{r.crew.crewName}</td>
                                                            <td className="p-3">
                                                                <div className={`text-sm font-bold ${d === undefined || d >= 14 ? 'text-red-700' : d >= 7 ? 'text-amber-700' : 'text-slate-700'}`}>{d === undefined ? 'Never in this bucket' : sinceLabel(d)}</div>
                                                                {r.lastByBucket[b.id] && <div className="text-xs text-slate-500 font-mono">{r.lastByBucket[b.id]}</div>}
                                                            </td>
                                                            <td className="p-3">
                                                                <div className="flex items-center gap-2">
                                                                    <div className="w-20 bg-slate-100 rounded-full h-2.5 overflow-hidden relative">
                                                                        <div className="h-full transition-all duration-500" style={{ width: `${(n / bMax) * 100}%`, backgroundColor: b.color }}></div>
                                                                        <div className="absolute top-0 h-full w-0.5 bg-slate-700" style={{ left: `${(bAvg / bMax) * 100}%` }} title="Bucket average"></div>
                                                                    </div>
                                                                    <span className="text-sm font-bold text-slate-800">{n}</span>
                                                                    {diff >= 1 && <span className="text-xs text-amber-700 bg-amber-50 border border-amber-200 px-1.5 rounded font-bold">+{diff.toFixed(1)}</span>}
                                                                    {diff <= -1 && <span className="text-xs text-blue-700 bg-blue-50 border border-blue-200 px-1.5 rounded font-bold">{diff.toFixed(1)}</span>}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                                {rows.length === 0 && <tr><td colSpan={3} className="p-6 text-center text-slate-400 text-sm">No crews yet.</td></tr>}
                                            </tbody>
                                        </table>
                                        {outsiders.length > 0 && (
                                            <div className="px-4 py-2 border-t border-slate-100 text-xs text-slate-500">
                                                Also flew here ({period}d, not assigned): {outsiders.map(r => `${r.crew.crewName} (${r.perBucket[b.id]})`).join(', ')}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                            {sorted.length === 0 && <p className="text-sm text-slate-400">Create a flying bucket to see this breakdown.</p>}
                        </div>
                    </div>
                </div>
            );
        };

        const DayPanel = ({ date, crews, buckets, log, notes, period, onAdd, onRemove, onSetNote, onClose }) => {
            const [drafts, setDrafts] = useState({});
            const [editingKey, setEditingKey] = useState(null);
            const stats = useMemo(() => {
                const ranked = rankByFairness(computeCrewStats(crews, buckets, log, date, false, period));
                return Object.fromEntries(ranked.map((s, i) => [s.crew.id, { ...s, rank: i }]));
            }, [crews, buckets, log, date, period]);
            const orderedCrews = useMemo(() => Object.values(stats).sort((a, b) => a.rank - b.rank), [stats]);
            const dayLog = log[date] || {};

            const bucketsForCrew = (crewId) => buckets.filter(b => (dayLog[b.id] || []).includes(crewId));

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                        <div>
                            <h3 className="font-black text-slate-800">{prettyDate(date)}</h3>
                            <p className="text-xs text-slate-500">{date === todayStr() ? 'Today' : date > todayStr() ? 'Planned' : 'Logged'} — gaps shown as of this day{date > todayStr() ? '; planned days count toward stats once the day arrives' : ''}</p>
                        </div>
                        <button onClick={onClose} className="text-slate-400 hover:text-slate-700"><i className="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <div className="p-4 space-y-4">
                        {buckets.length === 0 && <p className="text-sm text-slate-500">Create a flying bucket first (Flying Buckets tab).</p>}
                        {sortBuckets(buckets).map(bucket => {
                            const assigned = dayLog[bucket.id] || [];
                            const available = orderedCrews.filter(s => !assigned.includes(s.crew.id));
                            const designated = designatedIds(bucket, crews);
                            const mine = available.filter(s => designated.includes(s.crew.id));
                            const others = available.filter(s => !designated.includes(s.crew.id));
                            const optionFor = (s) => (
                                <option key={s.crew.id} value={s.crew.id}>
                                    {s.crew.crewName} — {sinceLabel(s.daysSince)}, {s.sorties} in {period}d
                                </option>
                            );
                            return (
                                <div key={bucket.id} className="border border-slate-200 rounded-xl overflow-hidden">
                                    <div className="px-3 py-2 flex items-center gap-2 text-sm font-bold text-slate-800" style={{ backgroundColor: bucket.color + '1a' }}>
                                        <BucketDot color={bucket.color} />
                                        {bucket.name}
                                        <span className="font-mono text-xs text-slate-500 font-semibold ml-auto">{formatMilTime(bucket.start)}-{formatMilTime(bucket.end)}</span>
                                    </div>
                                    <div className="p-3 space-y-2">
                                        {assigned.length === 0 && <p className="text-xs text-slate-400 italic">No crews logged</p>}
                                        {assigned.map(crewId => {
                                            const s = stats[crewId];
                                            if (!s) return null;
                                            const others = bucketsForCrew(crewId).filter(b => b.id !== bucket.id);
                                            const clash = others.filter(b => bucketsOverlap(b, bucket));
                                            const key = noteKey(date, bucket.id, crewId);
                                            const note = notes[key] || '';
                                            return (
                                                <div key={crewId} className="flex items-center justify-between gap-2 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
                                                    <div className="min-w-0">
                                                        <div className="text-sm font-bold text-slate-800 truncate">{s.crew.crewName}</div>
                                                        <div className="text-xs text-slate-500">Previously: {sinceLabel(s.daysSince)}</div>
                                                        {clash.length > 0 && <div className="text-xs text-red-600 font-semibold"><i className="fa-solid fa-triangle-exclamation mr-1"></i>Also in overlapping {clash.map(b => b.name).join(', ')}</div>}
                                                        {clash.length === 0 && others.length > 0 && <div className="text-xs text-amber-600 font-semibold"><i className="fa-solid fa-circle-info mr-1"></i>Also flying {others.map(b => b.name).join(', ')}</div>}
                                                        {editingKey === key ? (
                                                            <input autoFocus type="text" defaultValue={note} placeholder="Add a note…" maxLength={200}
                                                                onBlur={e => { onSetNote(date, bucket.id, crewId, e.target.value); setEditingKey(null); }}
                                                                onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { e.target.value = note; e.target.blur(); } }}
                                                                className="mt-1 w-full text-xs border border-slate-300 rounded p-1 outline-none focus:ring-2 focus:ring-blue-500" />
                                                        ) : note ? (
                                                            <button onClick={() => setEditingKey(key)} className="mt-1 text-left text-xs text-slate-700 italic hover:text-blue-700" title="Edit note"><i className="fa-regular fa-note-sticky mr-1 text-slate-400"></i>{note}{isGarNote(note) && <span className="ml-2 not-italic bg-blue-100 text-blue-700 border border-blue-200 text-[10px] font-bold px-1.5 py-0.5 rounded">GAR</span>}</button>
                                                        ) : (
                                                            <button onClick={() => setEditingKey(key)} className="mt-1 text-xs text-slate-400 hover:text-blue-600"><i className="fa-solid fa-plus mr-1"></i>Add note</button>
                                                        )}
                                                    </div>
                                                    <button onClick={() => onRemove(date, bucket.id, crewId)} className="text-slate-400 hover:text-red-600 p-1" title="Remove"><i className="fa-solid fa-trash"></i></button>
                                                </div>
                                            );
                                        })}
                                        {available.length > 0 && (
                                            <>
                                            <input type="text" maxLength={200} value={drafts[bucket.id] || ''} placeholder="Quick note — add “GAR” to log a ground alert"
                                                onChange={e => setDrafts({ ...drafts, [bucket.id]: e.target.value })}
                                                className="w-full text-sm bg-white border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                                            <select
                                                value=""
                                                onChange={e => {
                                                    if (!e.target.value) return;
                                                    onAdd(date, bucket.id, e.target.value, (drafts[bucket.id] || '').trim());
                                                    setDrafts({ ...drafts, [bucket.id]: '' });
                                                }}
                                                className="w-full text-sm bg-white border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none"
                                            >
                                                <option value="">+ Log crew (longest gap first)…</option>
                                                {designated.length === 0 ? available.map(optionFor) : (
                                                    <>
                                                        {mine.length > 0 && <optgroup label={`Assigned to ${bucket.name}`}>{mine.map(optionFor)}</optgroup>}
                                                        {others.length > 0 && <optgroup label="Other crews">{others.map(optionFor)}</optgroup>}
                                                    </>
                                                )}
                                            </select>
                                            </>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const CalendarView = ({ crews, buckets, log, period, setPeriod, selectedDate, setSelectedDate, onAdd, onRemove, notes, onSetNote }) => {
            const [cursor, setCursor] = useState(() => {
                const [y, m] = (selectedDate || todayStr()).split('-').map(Number);
                return { y, m: m - 1 };
            });
            const today = todayStr();
            const crewMap = useMemo(() => Object.fromEntries(crews.map(c => [c.id, c])), [crews]);
            const sorted = sortBuckets(buckets);

            const cells = useMemo(() => {
                const first = new Date(cursor.y, cursor.m, 1).getDay();
                const count = new Date(cursor.y, cursor.m + 1, 0).getDate();
                const arr = Array(first).fill(null);
                for (let d = 1; d <= count; d++) arr.push(`${cursor.y}-${pad2(cursor.m + 1)}-${pad2(d)}`);
                while (arr.length % 7 !== 0) arr.push(null);
                return arr;
            }, [cursor]);

            const shiftMonth = (delta) => {
                const d = new Date(cursor.y, cursor.m + delta, 1);
                setCursor({ y: d.getFullYear(), m: d.getMonth() });
            };
            const goToday = () => {
                const d = new Date();
                setCursor({ y: d.getFullYear(), m: d.getMonth() });
                setSelectedDate(today);
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Flying Log</h2>
                            <p className="text-sm text-slate-500 mt-1">Click a day to log which crews flew in each bucket. Days after today are planned and only count toward the stats once they arrive.</p>
                        </div>
                        <PeriodToggle value={period} onChange={setPeriod} />
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-6 items-start">
                        <div className="xl:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                                <h3 className="font-black text-slate-800 text-lg">{MONTHS[cursor.m]} {cursor.y}</h3>
                                <div className="flex gap-2">
                                    <button onClick={() => shiftMonth(-1)} className="w-9 h-9 rounded-lg bg-white border border-slate-200 hover:bg-slate-100" aria-label="Previous month"><i className="fa-solid fa-chevron-left"></i></button>
                                    <button onClick={goToday} className="px-3 h-9 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 text-sm font-bold">Today</button>
                                    <button onClick={() => shiftMonth(1)} className="w-9 h-9 rounded-lg bg-white border border-slate-200 hover:bg-slate-100" aria-label="Next month"><i className="fa-solid fa-chevron-right"></i></button>
                                </div>
                            </div>
                            <div className="grid grid-cols-7 text-center text-xs font-bold uppercase tracking-wider text-slate-500 bg-slate-50 border-b border-slate-200">
                                {WEEKDAYS.map(w => <div key={w} className="py-2">{w}</div>)}
                            </div>
                            <div className="grid grid-cols-7">
                                {cells.map((date, i) => {
                                    if (!date) return <div key={i} className="min-h-[90px] bg-slate-50/50 border-b border-r border-slate-100"></div>;
                                    const dayLog = log[date] || {};
                                    const isToday = date === today;
                                    const isSelected = date === selectedDate;
                                    const isFuture = date > today;
                                    return (
                                        <button key={date} onClick={() => setSelectedDate(date)}
                                            className={`min-h-[90px] p-1.5 text-left border-b border-r border-slate-100 align-top transition-colors ${isFuture ? 'bg-slate-50/60' : ''} hover:bg-blue-50/60 ${isSelected ? 'bg-blue-50 ring-2 ring-inset ring-blue-500' : ''}`}>
                                            <div className={`text-xs font-bold mb-1 inline-flex items-center justify-center ${isToday ? 'bg-blue-600 text-white rounded-full w-6 h-6' : isFuture ? 'text-slate-400' : 'text-slate-600'}`}>{parseInt(date.slice(8), 10)}</div>
                                            <div className="space-y-0.5">
                                                {sorted.map(b => {
                                                    const ids = (dayLog[b.id] || []).filter(id => crewMap[id]);
                                                    if (ids.length === 0) return null;
                                                    return (
                                                        <div key={b.id} className={`flex items-start gap-1 text-[10px] leading-tight text-slate-700 ${isFuture ? 'italic' : ''}`}>
                                                            <BucketDot color={b.color} className="mt-0.5 !w-2 !h-2" />
                                                            <span className="truncate">{ids.map(id => crewMap[id].crewName.split(' ')[1] || crewMap[id].crewName).join(', ')}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                            <div className="p-3 border-t border-slate-200 flex flex-wrap gap-4 text-xs text-slate-600">
                                {sorted.map(b => <span key={b.id} className="flex items-center gap-1.5"><BucketDot color={b.color} />{b.name} {formatMilTime(b.start)}-{formatMilTime(b.end)}</span>)}
                            </div>
                        </div>

                        <div className="xl:col-span-1">
                            {selectedDate ? (
                                <DayPanel date={selectedDate} crews={crews} buckets={buckets} log={log} notes={notes} period={period} onAdd={onAdd} onRemove={onRemove} onSetNote={onSetNote} onClose={() => setSelectedDate(null)} />
                            ) : (
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-8 text-center text-slate-400">
                                    <i className="fa-regular fa-calendar-check text-4xl mb-3"></i>
                                    <p className="text-sm">Select a day to log which crews flew.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };


        const GarView = ({ crews, gar, notes, buckets, onLog, onRemove }) => {
            const today = todayStr();
            const [date, setDate] = useState(today);
            const [crewId, setCrewId] = useState('');
            const [note, setNote] = useState('');

            const entries = useMemo(() => collectGarEntries(crews, gar, notes, buckets, today), [crews, gar, notes, buckets, today]);

            const rotation = useMemo(() => computeGarRotation(crews, entries, today), [crews, entries, today]);

            const history = entries;
            const crewMap = Object.fromEntries(crews.map(c => [c.id, c]));
            const onAlert = entries.filter(x => x.date === today).map(x => crewMap[x.crewId].crewName);
            const nextUp = rotation[0];
            const existing = gar[date];
            const maxTotal = Math.max(1, ...rotation.map(r => r.total));

            const submit = (e) => {
                e.preventDefault();
                if (!crewId || !date || date > today) return;
                onLog(date, crewId, note.trim());
                setNote('');
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-800">Ground Alert (GAR)</h2>
                        <p className="text-sm text-slate-500 mt-1">Every crew rotates through a 24-hour ground alert. The crew that has gone longest without one is next up. A Flying Log note containing "GAR" is counted automatically.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                            <p className="text-sm font-medium text-slate-500">On GAR Today</p>
                            <h3 className="text-xl font-bold text-slate-800 mt-1">{onAlert.length ? onAlert.join(', ') : 'None logged'}</h3>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                            <p className="text-sm font-medium text-slate-500">Next Up</p>
                            <h3 className="text-xl font-bold text-blue-700 mt-1">{nextUp ? nextUp.crew.crewName : '—'}</h3>
                            <p className="text-xs text-slate-500 mt-1">{nextUp ? (nextUp.last ? `Last GAR ${sinceLabel(nextUp.daysSince)}` : 'Has not done a GAR') : 'Add a crew to begin'}</p>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                            <p className="text-sm font-medium text-slate-500">GARs Logged</p>
                            <h3 className="text-3xl font-bold text-slate-800 mt-1">{history.length}</h3>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-6 items-start">
                        <div className="xl:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-4 border-b border-slate-200 bg-slate-50">
                                <h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm">Up-next order</h3>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse whitespace-nowrap">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider font-bold">
                                            <th className="p-4">#</th>
                                            <th className="p-4">Crew</th>
                                            <th className="p-4">Last GAR</th>
                                            <th className="p-4">Total GARs</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {rotation.map((r, idx) => (
                                            <tr key={r.crew.id} className={idx === 0 ? 'bg-blue-50/50' : ''}>
                                                <td className="p-4 text-sm font-bold text-slate-400">{idx + 1}</td>
                                                <td className="p-4 font-black text-slate-800">
                                                    {r.crew.crewName}
                                                    {idx === 0 && <span className="ml-2 bg-blue-600 text-white text-[10px] uppercase font-bold px-2 py-0.5 rounded">Next up</span>}
                                                </td>
                                                <td className="p-4">
                                                    <div className={`text-sm font-bold ${r.daysSince === null ? 'text-red-700' : r.daysSince >= 14 ? 'text-amber-700' : 'text-slate-700'}`}>{r.last ? sinceLabel(r.daysSince) : 'Never'}</div>
                                                    {r.last && <div className="text-xs text-slate-500 font-mono">{r.last}</div>}
                                                </td>
                                                <td className="p-4">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-24 bg-slate-100 rounded-full h-2.5 overflow-hidden"><div className="bg-indigo-500 h-full" style={{ width: `${(r.total / maxTotal) * 100}%` }}></div></div>
                                                        <span className="text-sm font-bold text-slate-800">{r.total}</span>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                        {rotation.length === 0 && <tr><td colSpan={4} className="p-8 text-center text-slate-400">No crews yet.</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <form onSubmit={submit} className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3">
                                <h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm">Log a GAR</h3>
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Date</label>
                                    <input type="date" required max={today} value={date} onChange={e => setDate(e.target.value)}
                                        className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Crew</label>
                                    <select required value={crewId} onChange={e => setCrewId(e.target.value)}
                                        className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                        <option value="">Select crew (next up first)…</option>
                                        {rotation.map(r => <option key={r.crew.id} value={r.crew.id}>{r.crew.crewName} — {r.last ? sinceLabel(r.daysSince) : 'never'}, {r.total} total</option>)}
                                    </select>
                                </div>
                                <input type="text" maxLength={200} value={note} onChange={e => setNote(e.target.value)} placeholder="Note (optional)"
                                    className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                                {existing && crewMap[existing.crewId] && <p className="text-xs text-amber-700 font-semibold"><i className="fa-solid fa-triangle-exclamation mr-1"></i>{crewMap[existing.crewId].crewName} is already logged for this date; logging again replaces it.</p>}
                                <button type="submit" disabled={!crewId || !date || date > today} className="w-full py-2 rounded-lg font-bold text-sm text-white bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300">{existing ? 'Replace GAR' : 'Log GAR'}</button>
                            </form>

                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-4 border-b border-slate-200 bg-slate-50"><h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm">History</h3></div>
                                <div className="divide-y divide-slate-100 max-h-[320px] overflow-y-auto">
                                    {history.length === 0 && <p className="p-6 text-center text-sm text-slate-400">No GARs logged yet. Log one here, or put "GAR" in a Flying Log note.</p>}
                                    {history.map(e => (
                                        <div key={e.id} className="px-4 py-3 flex items-center justify-between gap-2">
                                            <div className="min-w-0">
                                                <div className="text-sm font-bold text-slate-800 truncate">{crewMap[e.crewId].crewName}</div>
                                                <div className="text-xs text-slate-500 font-mono">{prettyDate(e.date)}</div>
                                                {e.note && <div className="text-xs text-slate-600 italic">{e.note}</div>}
                                                {e.source === 'log' && <div className="text-xs text-blue-700 font-semibold"><i className="fa-solid fa-calendar-days mr-1"></i>From Flying Log{e.bucketName ? ` (${e.bucketName})` : ''}</div>}
                                            </div>
                                            {e.source === 'manual' && <button onClick={() => onRemove(e.date)} className="text-slate-400 hover:text-red-600 p-1" title="Remove"><i className="fa-solid fa-trash"></i></button>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };


        // --- REPORT (shareable summary for the crews) ---
        const ReportView = ({ crews, buckets, log, notes, gar, period: appPeriod }) => {
            const today = todayStr();
            const [asOf, setAsOf] = useState(today);
            const [period, setPeriod] = useState(appPeriod);
            const [title, setTitle] = useState('Crew Flying Report');
            const [message, setMessage] = useState('');
            const [inc, setInc] = useState({ flying: true, time30: true, buckets: true, gar: true, garHistory: true, notes: false });
            const [copied, setCopied] = useState('');
            const toggle = (k) => setInc(prev => ({ ...prev, [k]: !prev[k] }));
            const canShare = typeof navigator !== 'undefined' && !!navigator.share;
            const sorted = sortBuckets(buckets);
            const crewName = Object.fromEntries(crews.map(c => [c.id, c.crewName]));

            const data = useMemo(() => {
                const stats = rankByFairness(computeCrewStats(crews, buckets, log, asOf, true, period));
                const entries = collectGarEntries(crews, gar, notes, buckets, asOf);
                const rotation = computeGarRotation(crews, entries, asOf);
                const from = addDays(asOf, -period + 1);
                const flightNotes = [];
                Object.entries(notes).forEach(([key, text]) => {
                    const [d, bucketId, crewId] = key.split('|');
                    const bucket = buckets.find(b => b.id === bucketId);
                    if (d < from || d > asOf || !crewName[crewId] || !bucket) return;
                    flightNotes.push({ date: d, bucket: bucket.name, crew: crewName[crewId], text });
                });
                flightNotes.sort((a, b) => b.date.localeCompare(a.date));
                return { stats, entries, rotation, from, flightNotes, perBucket: sorted.map(b => ({ bucket: b, ...bucketBreakdown(b, stats, crews) })) };
            }, [crews, buckets, log, notes, gar, asOf, period]);

            const time30Text = (c) => c.time30 && c.time30.hours !== '' && c.time30.hours != null ? `${c.time30.hours} h${c.time30.asOf ? ` (as of ${c.time30.asOf})` : ''}` : '—';
            const lastText = (s) => s.last ? `${s.last} (${sinceLabel(s.daysSince).toLowerCase()})` : 'never';

            const text = useMemo(() => {
                const L = [];
                L.push(`${title.toUpperCase()}`);
                L.push(`As of ${prettyDate(asOf)} · last ${period} days`);
                if (message.trim()) L.push('', message.trim());
                if (inc.flying) {
                    L.push('', 'FLYING — longest gap first');
                    data.stats.forEach((s, i) => L.push(`${i + 1}. ${s.crew.crewName}: last flown ${lastText(s)} · ${s.sorties} sortie${s.sorties === 1 ? '' : 's'}${inc.time30 ? ` · 30-day time ${time30Text(s.crew)}` : ''}`));
                }
                if (inc.buckets) {
                    L.push('', 'BY BUCKET — longest gap in that bucket first');
                    data.perBucket.forEach(({ bucket, rows, avg }) => {
                        L.push(`${bucket.name} (${formatMilTime(bucket.start)}-${formatMilTime(bucket.end)}Z), avg ${avg.toFixed(1)}:`);
                        rows.forEach((r, i) => L.push(`  ${i + 1}. ${r.crew.crewName}: ${r.lastByBucket[bucket.id] ? `last ${r.lastByBucket[bucket.id]} (${sinceLabel(r.daysSinceByBucket[bucket.id]).toLowerCase()})` : 'never in this bucket'} · ${r.perBucket[bucket.id] || 0}`));
                    });
                }
                if (inc.gar) {
                    L.push('', 'GAR — up-next order');
                    data.rotation.forEach((r, i) => L.push(`${i + 1}. ${r.crew.crewName}: ${r.last ? `last GAR ${r.last} (${sinceLabel(r.daysSince).toLowerCase()})` : 'no GAR yet'} · ${r.total} total`));
                }
                if (inc.garHistory && data.entries.length) {
                    L.push('', 'RECENT GARs');
                    data.entries.slice(0, 10).forEach(e => L.push(`${e.date}: ${crewName[e.crewId]}`));
                }
                if (inc.notes && data.flightNotes.length) {
                    L.push('', 'FLYING LOG NOTES');
                    data.flightNotes.forEach(n => L.push(`${n.date} ${n.bucket} — ${n.crew}: ${n.text}`));
                }
                return L.join('\n');
            }, [data, title, message, asOf, period, inc]);

            const copyText = async () => {
                try {
                    await navigator.clipboard.writeText(text);
                } catch (e) {
                    const ta = document.createElement('textarea');
                    ta.value = text; document.body.appendChild(ta); ta.select();
                    try { document.execCommand('copy'); } catch (err) {}
                    document.body.removeChild(ta);
                }
                setCopied('Copied!');
                setTimeout(() => setCopied(''), 2000);
            };
            const shareText = () => navigator.share({ title, text }).catch(() => {});

            const options = [
                ['flying', 'Flying summary'], ['time30', '30-day time'], ['buckets', 'Per-bucket breakdown'],
                ['gar', 'GAR up-next order'], ['garHistory', 'Recent GARs'], ['notes', 'Flying log notes']
            ];

            return (
                <div className="space-y-6">
                    <div className="no-print">
                        <h2 className="text-2xl font-bold text-slate-800">Report</h2>
                        <p className="text-sm text-slate-500 mt-1">Build a summary to share with all the crews. Print it or save it as a PDF, or copy it as text for chat or email.</p>
                    </div>

                    <div className="no-print bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1">Title</label>
                                <input type="text" value={title} onChange={e => setTitle(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1">As of</label>
                                <input type="date" max={today} value={asOf} onChange={e => e.target.value && setAsOf(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1">Window</label>
                                <PeriodToggle value={period} onChange={setPeriod} />
                            </div>
