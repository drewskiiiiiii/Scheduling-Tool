                                        <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider font-bold">
                                            <th className="p-4">#</th>
                                            <th className="p-4">Crew</th>
                                            <th className="p-4">Last GAR</th>
                                            <th className="p-4">Scheduled</th>
                                            <th className="p-4">Total GARs</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {rotation.map((r, idx) => (
                                            <tr key={r.crew.id} className={nextUp && r.crew.id === nextUp.crew.id ? 'bg-blue-50/50' : ''}>
                                                <td className="p-4 text-sm font-bold text-slate-400">{idx + 1}</td>
                                                <td className="p-4 font-black text-slate-800">
                                                    {r.crew.crewName}
                                                    {nextUp && r.crew.id === nextUp.crew.id && <span className="ml-2 bg-blue-600 text-white text-[10px] uppercase font-bold px-2 py-0.5 rounded">Next up</span>}
                                                    {r.unavailable && <UnavailTag className="ml-2" />}
                                                </td>
                                                <td className="p-4">
                                                    <div className={`text-sm font-bold ${r.daysSince === null ? 'text-red-700' : r.daysSince >= 14 ? 'text-amber-700' : 'text-slate-700'}`}>{r.last ? sinceLabel(r.daysSince) : 'Never'}</div>
                                                    {r.last && <div className="text-xs text-slate-500 font-mono">{r.last}</div>}
                                                </td>
                                                <td className="p-4">{r.next ? <span className="text-sm font-bold text-blue-700">{r.next}</span> : <span className="text-slate-400">—</span>}</td>
                                                <td className="p-4">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-24 bg-slate-100 rounded-full h-2.5 overflow-hidden"><div className="bg-indigo-500 h-full" style={{ width: `${(r.total / maxTotal) * 100}%` }}></div></div>
                                                        <span className="text-sm font-bold text-slate-800">{r.total}</span>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                        {rotation.length === 0 && <tr><td colSpan={5} className="p-8 text-center text-slate-400">No crews yet.</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="space-y-6">
                            {canEdit && <form onSubmit={submit} className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3">
                                <h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm">Log or schedule a GAR</h3>
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Date</label>
                                    <input type="date" required value={date} onChange={e => setDate(e.target.value)}
                                        className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Crew</label>
                                    <select required value={crewId} onChange={e => setCrewId(e.target.value)}
                                        className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                        <option value="">Select crew (next up first)…</option>
                                        {rotation.map(r => <option key={r.crew.id} value={r.crew.id}>{r.crew.crewName}{r.unavailable ? ' (unavailable)' : ''} — {r.last ? sinceLabel(r.daysSince) : 'never'}, {r.total} total</option>)}
                                    </select>
                                </div>
                                <input type="text" maxLength={200} value={note} onChange={e => setNote(e.target.value)} placeholder="Note (optional)"
                                    className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                                {existing && crewMap[existing.crewId] && <p className="text-xs text-amber-700 font-semibold"><i className="fa-solid fa-triangle-exclamation mr-1"></i>{crewMap[existing.crewId].crewName} is already logged for this date; logging again replaces it.</p>}
                                <button type="submit" disabled={!crewId || !date} className="w-full py-2 rounded-lg font-bold text-sm text-white bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300">{existing ? 'Replace GAR' : date > today ? 'Schedule GAR' : 'Log GAR'}</button>
                            </form>}

                            {upcoming.length > 0 && (
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="p-4 border-b border-slate-200 bg-slate-50"><h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm">Upcoming</h3></div>
                                    <div className="divide-y divide-slate-100 max-h-[240px] overflow-y-auto">
                                        {upcoming.map(e => (
                                            <div key={e.id} className="px-4 py-3 flex items-center justify-between gap-2">
                                                <div className="min-w-0">
                                                    <div className="text-sm font-bold text-slate-800 truncate">{crewMap[e.crewId].crewName}</div>
                                                    <div className="text-xs text-slate-500 font-mono">{prettyDate(e.date)} · in {daysBetween(today, e.date)} day{daysBetween(today, e.date) === 1 ? '' : 's'}</div>
                                                    {e.note && <div className="text-xs text-slate-600 italic">{e.note}</div>}
                                                    {e.source === 'log' && <div className="text-xs text-blue-700 font-semibold"><i className="fa-solid fa-calendar-days mr-1"></i>From Flying Log{e.bucketName ? ` (${e.bucketName})` : ''}</div>}
                                                </div>
                                                {e.source === 'manual' && canEdit && <button onClick={() => onRemove(e.date)} className="text-slate-400 hover:text-red-600 p-1" title="Remove"><i className="fa-solid fa-trash"></i></button>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-4 border-b border-slate-200 bg-slate-50"><h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm">History</h3></div>
                                <div className="divide-y divide-slate-100 max-h-[320px] overflow-y-auto">
                                    {history.length === 0 && <p className="p-6 text-center text-sm text-slate-400">No GARs logged yet. Log one here, or mark a crew GAR in the Flying Log.</p>}
                                    {history.map(e => (
                                        <div key={e.id} className="px-4 py-3 flex items-center justify-between gap-2">
                                            <div className="min-w-0">
                                                <div className="text-sm font-bold text-slate-800 truncate">{crewMap[e.crewId].crewName}</div>
                                                <div className="text-xs text-slate-500 font-mono">{prettyDate(e.date)}</div>
                                                {e.note && <div className="text-xs text-slate-600 italic">{e.note}</div>}
                                                {e.source === 'log' && <div className="text-xs text-blue-700 font-semibold"><i className="fa-solid fa-calendar-days mr-1"></i>From Flying Log{e.bucketName ? ` (${e.bucketName})` : ''}</div>}
                                            </div>
                                            {e.source === 'manual' && canEdit && <button onClick={() => onRemove(e.date)} className="text-slate-400 hover:text-red-600 p-1" title="Remove"><i className="fa-solid fa-trash"></i></button>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };


        // Horizontal bar chart built from plain divs so it prints and exports cleanly.
        const BarChart = ({ rows, color, valueText }) => {
            const max = Math.max(1, ...rows.map(r => r.value));
            return (
                <div className="rp-chart">
                    {rows.map(r => (
                        <div key={r.crew.id} className="rp-chart-row">
                            <div className="rp-chart-label">{r.crew.crewName}</div>
                            <div className="rp-chart-track"><div className="rp-bar" style={{ width: `${(r.value / max) * 100}%`, background: color }}></div></div>
                            <div className="rp-chart-value"><strong>{r.value}</strong>{valueText ? <span className="rp-muted"> {valueText(r)}</span> : null}</div>
                        </div>
                    ))}
                    {rows.length === 0 && <div className="rp-muted">No crews.</div>}
                </div>
            );
        };

        // --- REPORT (shareable summary for the crews) ---
        const ReportView = ({ crews, buckets, log, notes, gar, garFlags, period: appPeriod }) => {
            const today = todayStr();
            const [asOf, setAsOf] = useState(today);
            const [period, setPeriod] = useState(appPeriod);
            const [title, setTitle] = useState('Crew Flying Report');
            const [message, setMessage] = useState('');
            const [view, setView] = useState('glance'); // glance | detailed
            const [inc, setInc] = useState({ flying: true, time30: true, charts: true, buckets: true, gar: true, garHistory: true, notes: false });
            const [copied, setCopied] = useState('');
            const toggle = (k) => setInc(prev => ({ ...prev, [k]: !prev[k] }));
            const canShare = typeof navigator !== 'undefined' && !!navigator.share;
            const sorted = sortBuckets(buckets);
            const crewName = Object.fromEntries(crews.map(c => [c.id, c.crewName]));

            const data = useMemo(() => {
                const stats = rankByFairness(computeCrewStats(crews, buckets, log, asOf, true, period));
                const allGar = collectGarEntries(crews, gar, notes, buckets, '9999-12-31', garFlags);
                const entries = allGar.filter(e => e.date <= asOf);
                const rotation = computeGarRotation(crews, allGar, asOf);
                const from = period === 'all' ? '0000-00-00' : addDays(asOf, -period + 1);
                const flightNotes = [];
                Object.entries(notes).forEach(([key, text]) => {
                    const [d, bucketId, crewId] = key.split('|');
                    const bucket = buckets.find(b => b.id === bucketId);
                    if (d < from || d > asOf || !crewName[crewId] || !bucket) return;
                    flightNotes.push({ date: d, bucket: bucket.name, crew: crewName[crewId], text });
                });
                flightNotes.sort((a, b) => b.date.localeCompare(a.date));
                const windowStart = periodStart(asOf, period);
                const totals = Object.fromEntries(rotation.map(r => [r.crew.id, r.total]));
                const garInWindow = {};
                entries.forEach(e => { if (e.date > windowStart) garInWindow[e.crewId] = (garInWindow[e.crewId] || 0) + 1; });
                const byName = (a, b) => a.crew.crewName.localeCompare(b.crew.crewName);
                const sortieRows = stats.map(s => ({ crew: s.crew, value: s.sorties })).sort((a, b) => b.value - a.value || byName(a, b));
                const garRows = crews.map(c => ({ crew: c, value: garInWindow[c.id] || 0, total: totals[c.id] || 0 })).sort((a, b) => b.value - a.value || b.total - a.total || byName(a, b));
                const rotById = Object.fromEntries(rotation.map(r => [r.crew.id, r]));
                const glanceRows = stats.map(s => ({ crew: s.crew, last: s.last, daysSince: s.daysSince, sorties: s.sorties, garWin: garInWindow[s.crew.id] || 0, garLast: rotById[s.crew.id].last, garDays: rotById[s.crew.id].daysSince, time30: s.crew.time30, unavailable: s.unavailable }));
                return { stats, entries, rotation, from, flightNotes, sortieRows, garRows, glanceRows, flyNext: stats.find(r => !r.unavailable), garNext: rotation.find(r => !r.unavailable && !r.next) || rotation.find(r => !r.unavailable), perBucket: sorted.map(b => ({ bucket: b, ...bucketBreakdown(b, stats, crews) })) };
            }, [crews, buckets, log, notes, gar, garFlags, asOf, period]);

            const time30Text = (c) => c.time30 && c.time30.hours !== '' && c.time30.hours != null ? `${c.time30.hours} h${c.time30.asOf ? ` (as of ${c.time30.asOf})` : ''}` : '—';
            const lastText = (s) => s.last ? `${s.last} (${sinceLabel(s.daysSince).toLowerCase()})` : 'never';

            const text = useMemo(() => {
                const L = [];
                if (view === 'glance') {
                    L.push(`${title.toUpperCase()}`, `As of ${prettyDate(asOf)} · ${periodLong(period)}`);
                    if (message.trim()) L.push('', message.trim());
                    L.push('');
                    if (data.flyNext) L.push(`FLY NEXT: ${data.flyNext.crew.crewName} (${data.flyNext.last ? `last flew ${sinceLabel(data.flyNext.daysSince).toLowerCase()}` : 'has not flown'})`);
                    if (data.garNext) L.push(`GAR NEXT: ${data.garNext.crew.crewName} (${data.garNext.last ? `last GAR ${sinceLabel(data.garNext.daysSince).toLowerCase()}` : 'no GAR yet'})`);
                    if (data.perBucket.length) {
                        L.push('', 'NEXT UP BY BUCKET');
                        data.perBucket.forEach(({ bucket, rows }) => {
                            const n = rows.find(r => !r.unavailable);
                            L.push(`${bucket.name} (${formatMilTime(bucket.start)}-${formatMilTime(bucket.end)}Z): ${n ? `${n.crew.crewName} — ${n.daysSinceByBucket[bucket.id] === undefined ? 'never in this bucket' : `last in bucket ${sinceLabel(n.daysSinceByBucket[bucket.id]).toLowerCase()}`}` : '—'}`);
                        });
                    }
                    L.push('', 'CREW · LAST FLOWN · SORTIES · GARs');
                    data.glanceRows.forEach((r, i) => L.push(`${i + 1}. ${r.crew.crewName} · ${r.last ? sinceLabel(r.daysSince).toLowerCase() : 'never'} · ${r.sorties} · ${r.garWin}`));
                    return L.join('\n');
                }
                L.push(`${title.toUpperCase()}`);
                L.push(`As of ${prettyDate(asOf)} · ${periodLong(period)}`);
                if (message.trim()) L.push('', message.trim());
                if (inc.flying) {
                    L.push('', 'FLYING — longest gap first');
                    data.stats.forEach((s, i) => L.push(`${i + 1}. ${s.crew.crewName}: last flown ${lastText(s)} · ${s.sorties} sortie${s.sorties === 1 ? '' : 's'}${inc.time30 ? ` · 30-day time ${time30Text(s.crew)}` : ''}`));
                }
                if (inc.charts) {
                    const bar = (v, max) => '█'.repeat(max ? Math.round((v / max) * 20) : 0);
                    const sMax = Math.max(0, ...data.sortieRows.map(r => r.value));
                    L.push('', `SORTIES FLOWN — ${periodLong(period)}`);
                    data.sortieRows.forEach(r => L.push(`${r.crew.crewName}  ${bar(r.value, sMax)} ${r.value}`));
                    const gMax = Math.max(0, ...data.garRows.map(r => r.value));
                    L.push('', `GARs FILLED — ${periodLong(period)} (all-time in brackets)`);
                    data.garRows.forEach(r => L.push(`${r.crew.crewName}  ${bar(r.value, gMax)} ${r.value} (${r.total})`));
                }
                if (inc.buckets) {
                    L.push('', 'BY BUCKET — longest gap in that bucket first');
                    data.perBucket.forEach(({ bucket, rows, avg }) => {
                        L.push(`${bucket.name} (${formatMilTime(bucket.start)}-${formatMilTime(bucket.end)}Z), avg ${avg.toFixed(1)}:`);
                        rows.forEach((r, i) => L.push(`  ${i + 1}. ${r.crew.crewName}: ${r.lastByBucket[bucket.id] ? `last ${r.lastByBucket[bucket.id]} (${sinceLabel(r.daysSinceByBucket[bucket.id]).toLowerCase()})` : 'never in this bucket'} · ${r.perBucket[bucket.id] || 0}`));
                    });
                }
                if (inc.gar) {
                    L.push('', 'GAR — up-next order');
                    data.rotation.forEach((r, i) => L.push(`${i + 1}. ${r.crew.crewName}: ${r.last ? `last GAR ${r.last} (${sinceLabel(r.daysSince).toLowerCase()})` : 'no GAR yet'} · ${r.total} total${r.next ? ` · scheduled ${r.next}` : ''}`));
                }
                if (inc.garHistory && data.entries.length) {
                    L.push('', 'RECENT GARs');
                    data.entries.slice(0, 10).forEach(e => L.push(`${e.date}: ${crewName[e.crewId]}`));
                }
                if (inc.notes && data.flightNotes.length) {
                    L.push('', 'FLYING LOG NOTES');
                    data.flightNotes.forEach(n => L.push(`${n.date} ${n.bucket} — ${n.crew}: ${n.text}`));
                }
                return L.join('\n');
            }, [data, title, message, asOf, period, inc, view]);

            const copyText = async () => {
                try {
                    await navigator.clipboard.writeText(text);
                } catch (e) {
                    const ta = document.createElement('textarea');
                    ta.value = text; document.body.appendChild(ta); ta.select();
                    try { document.execCommand('copy'); } catch (err) {}
                    document.body.removeChild(ta);
                }
                setCopied('Copied!');
                setTimeout(() => setCopied(''), 2000);
            };
            const shareText = () => navigator.share({ title, text }).catch(() => {});

            const options = [
                ['flying', 'Flying summary'], ['time30', '30-day time'], ['buckets', 'Per-bucket breakdown'],
                ['gar', 'GAR up-next order'], ['garHistory', 'Recent GARs'], ['charts', 'Charts'], ['notes', 'Flying log notes']
            ];

            return (
                <div className="space-y-6">
                    <div className="no-print">
                        <h2 className="text-2xl font-bold text-slate-800">Report</h2>
                        <p className="text-sm text-slate-500 mt-1">Build a summary to share with all the crews. Print it or save it as a PDF, or copy it as text for chat or email.</p>
                    </div>

                    <div className="no-print bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1">Title</label>
                                <input type="text" value={title} onChange={e => setTitle(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1">As of</label>
                                <input type="date" max={today} value={asOf} onChange={e => e.target.value && setAsOf(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1">Window</label>
                                <PeriodToggle value={period} onChange={setPeriod} />
                            </div>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-600 mb-1">Message to crews (optional)</label>
                            <textarea rows={2} maxLength={500} value={message} onChange={e => setMessage(e.target.value)} placeholder="e.g. Please check your last-flown dates and flag any errors by Friday."
                                className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-600 mb-2">Layout</label>
                            <div className="inline-flex bg-white border border-slate-200 rounded-lg shadow-sm p-1 gap-1">
                                {[['glance', 'Quick glance'], ['detailed', 'Full detail']].map(([k, label]) => (
                                    <button key={k} type="button" onClick={() => setView(k)} aria-pressed={view === k}
                                        className={`px-3 py-1 rounded-md text-sm font-bold transition-colors ${view === k ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>{label}</button>
                                ))}
                            </div>
                        </div>
                        {view === 'detailed' && <div>
                            <label className="block text-xs font-bold text-slate-600 mb-2">Include</label>
                            <div className="flex flex-wrap gap-2">
                                {options.map(([k, label]) => (
                                    <button type="button" key={k} onClick={() => toggle(k)} aria-pressed={inc[k]}
                                        className={`px-3 py-1 text-sm rounded-full border ${inc[k] ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>
                                        {label}
                                    </button>
                                ))}
                            </div>
                            {inc.notes && <p className="text-xs text-amber-700 font-semibold mt-2"><i className="fa-solid fa-triangle-exclamation mr-1"></i>Flying log notes will be visible to everyone you share this with.</p>}
                        </div>}
                        <div className="flex flex-wrap gap-2 pt-1">
                            <button onClick={() => window.print()} className="px-4 py-2 rounded-lg font-bold text-sm text-white bg-blue-600 hover:bg-blue-700"><i className="fa-solid fa-print mr-2"></i>Print / Save PDF</button>
                            <button onClick={copyText} className="px-4 py-2 rounded-lg font-bold text-sm text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-200"><i className="fa-regular fa-copy mr-2"></i>{copied || 'Copy as text'}</button>
                            {canShare && <button onClick={shareText} className="px-4 py-2 rounded-lg font-bold text-sm text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-200"><i className="fa-solid fa-share-nodes mr-2"></i>Share…</button>}
                        </div>
                    </div>

                    <div id="report-sheet" className="rp-sheet">
                        <h1>{title || 'Crew Flying Report'}</h1>
                        <div className="rp-sub">As of {prettyDate(asOf)} · {period === 'all' ? 'flying over all time' : `flying over the last ${period} days (${data.from} to ${asOf})`}</div>
                        {message.trim() && <div className="rp-msg">{message.trim()}</div>}

                        {view === 'glance' && (
                            <>
                                <div className="rp-hero">
                                    <div>
                                        <div className="rp-kicker">Fly next</div>
                                        <div className="rp-big">{data.flyNext ? data.flyNext.crew.crewName : '—'}</div>
                                        <div className="rp-muted">{data.flyNext ? (data.flyNext.last ? `last flew ${sinceLabel(data.flyNext.daysSince).toLowerCase()}` : 'has not flown yet') : ''}</div>
                                    </div>
                                    <div>
                                        <div className="rp-kicker">GAR next</div>
                                        <div className="rp-big">{data.garNext ? data.garNext.crew.crewName : '—'}</div>
                                        <div className="rp-muted">{data.garNext ? (data.garNext.last ? `last GAR ${sinceLabel(data.garNext.daysSince).toLowerCase()}` : 'no GAR yet') : ''}</div>
                                    </div>
                                </div>
                                {data.perBucket.length > 0 && (
                                    <div style={{ marginTop: 14 }}>
                                        <div className="rp-kicker" style={{ fontSize: 11, fontWeight: 800, letterSpacing: '.08em', textTransform: 'uppercase', color: '#475569' }}>Next up by bucket</div>
                                        <div className="rp-buckets">
                                            {data.perBucket.map(({ bucket, rows }) => {
                                                const n = rows.find(r => !r.unavailable);
                                                const d = n ? n.daysSinceByBucket[bucket.id] : undefined;
                                                return (
                                                    <div key={bucket.id} className="rp-bkt">
                                                        <div><span className="rp-dot" style={{ background: bucket.color }}></span><strong>{bucket.name}</strong> <span className="rp-muted">{formatMilTime(bucket.start)}–{formatMilTime(bucket.end)}Z</span></div>
                                                        <div style={{ fontWeight: 700 }}>{n ? n.crew.crewName : '—'}</div>
                                                        {n && <div className="rp-muted" style={{ fontSize: 12 }}>{d === undefined ? 'never in this bucket' : `last in bucket ${sinceLabel(d).toLowerCase()}`}</div>}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                                <table className="rp-glance" style={{ marginTop: 18 }}>
                                    <thead><tr><th>Crew</th><th>Last flown</th><th>Sorties ({periodShort(period)})</th><th>GARs ({periodShort(period)})</th></tr></thead>
                                    <tbody>
                                        {data.glanceRows.map((r, i) => {
                                            const sMax = Math.max(1, ...data.glanceRows.map(x => x.sorties));
                                            const tone = r.daysSince === null || r.daysSince >= 14 ? 'rp-red' : r.daysSince >= 7 ? 'rp-amber' : 'rp-green';
                                            return (
                                                <tr key={r.crew.id}>
                                                    <td><strong>{r.crew.crewName}</strong>{data.flyNext && data.flyNext.crew.id === r.crew.id && <span className="rp-tag">FLY NEXT</span>}{r.unavailable && <span className="rp-tag rp-tag-off">UNAVAILABLE</span>}{data.garNext && data.garNext.crew.id === r.crew.id && <span className="rp-tag rp-tag-gar">GAR NEXT</span>}</td>
                                                    <td><span className={`rp-pill ${tone}`}>{r.last ? sinceLabel(r.daysSince) : 'Never'}</span></td>
                                                    <td><span className="rp-mini" style={{ width: `${(r.sorties / sMax) * 80}px`, minWidth: r.sorties ? 4 : 0, background: '#2563eb' }}></span><strong>{r.sorties}</strong></td>
                                                    <td><strong>{r.garWin}</strong>{r.garLast ? <span className="rp-muted"> · last {sinceLabel(r.garDays).toLowerCase()}</span> : <span className="rp-muted"> · none yet</span>}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                                <div className="rp-muted" style={{ marginTop: 8, fontSize: 12 }}>Fly next = longest since last flight. GAR next = longest since last ground alert. <span className="rp-pill rp-green">under 7 days</span> <span className="rp-pill rp-amber">7–13 days</span> <span className="rp-pill rp-red">14+ days or never</span></div>
                            </>
                        )}

                        {view === 'detailed' && (<>
                        {inc.flying && (
                            <>
                                <h2>Flying — longest gap first</h2>
                                <table>
                                    <thead><tr><th>#</th><th>Crew</th><th>Last flown</th><th className="rp-num">Sorties</th>{inc.time30 && <th>30-day time</th>}</tr></thead>
                                    <tbody>
                                        {data.stats.map((s, i) => (
                                            <tr key={s.crew.id}>
                                                <td className="rp-muted">{i + 1}</td>
                                                <td><strong>{s.crew.crewName}</strong></td>
                                                <td className={s.daysSince === null ? 'rp-flag' : ''}>{lastText(s)}</td>
                                                <td className="rp-num">{s.sorties}</td>
                                                {inc.time30 && <td>{time30Text(s.crew)}</td>}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </>
                        )}

                        {inc.charts && (
                            <>
                                <h2>Sorties flown — {periodLong(period)}</h2>
                                <BarChart rows={data.sortieRows} color="#2563eb" />
                                <h2>GARs filled — {periodLong(period)}</h2>
                                <BarChart rows={data.garRows} color="#d97706" valueText={r => `(${r.total} all-time)`} />
                            </>
                        )}

                        {inc.buckets && data.perBucket.length > 0 && (
                            <>
                                <h2>By bucket — longest gap in that bucket first</h2>
                                {data.perBucket.map(({ bucket, rows, avg, designated, outsiders }) => (
                                    <div key={bucket.id} style={{ breakInside: 'avoid' }}>
                                        <h3><span style={{ display: 'inline-block', width: 9, height: 9, borderRadius: 9, background: bucket.color, marginRight: 6 }}></span>{bucket.name} <span className="rp-muted" style={{ fontWeight: 400 }}>{formatMilTime(bucket.start)}–{formatMilTime(bucket.end)}Z · {designated.length ? `${designated.length} assigned crews` : 'all crews'} · avg {avg.toFixed(1)}</span></h3>
                                        <table style={{ tableLayout: 'fixed' }}>
                                            <colgroup><col style={{ width: 28 }} /><col style={{ width: '38%' }} /><col /><col style={{ width: 50 }} /></colgroup>
                                            <tbody>
                                                {rows.map((r, i) => (
                                                    <tr key={r.crew.id}>
                                                        <td className="rp-muted" style={{ width: 24 }}>{i + 1}</td>
                                                        <td><strong>{r.crew.crewName}</strong></td>
                                                        <td className={r.lastByBucket[bucket.id] ? '' : 'rp-flag'}>{r.lastByBucket[bucket.id] ? `${r.lastByBucket[bucket.id]} (${sinceLabel(r.daysSinceByBucket[bucket.id]).toLowerCase()})` : 'never in this bucket'}</td>
                                                        <td className="rp-num">{r.perBucket[bucket.id] || 0}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                        {outsiders.length > 0 && <div className="rp-muted" style={{ marginTop: 3 }}>Also flew here, not assigned: {outsiders.map(r => `${r.crew.crewName} (${r.perBucket[bucket.id]})`).join(', ')}</div>}
                                    </div>
                                ))}
                            </>
                        )}

                        {inc.gar && (
                            <>
                                <h2>GAR — up-next order</h2>
                                <table>
                                    <thead><tr><th>#</th><th>Crew</th><th>Last GAR</th><th className="rp-num">Total</th></tr></thead>
                                    <tbody>
                                        {data.rotation.map((r, i) => (
                                            <tr key={r.crew.id}>
                                                <td className="rp-muted">{i + 1}</td>
                                                <td><strong>{r.crew.crewName}</strong>{data.garNext && data.garNext.crew.id === r.crew.id && <span className="rp-next"> · next up</span>}{r.next && <span className="rp-muted"> · scheduled {r.next}</span>}{r.unavailable && <span className="rp-muted"> · unavailable</span>}</td>
                                                <td className={r.last ? '' : 'rp-flag'}>{r.last ? `${r.last} (${sinceLabel(r.daysSince).toLowerCase()})` : 'no GAR yet'}</td>
                                                <td className="rp-num">{r.total}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </>
                        )}

                        {inc.garHistory && data.entries.length > 0 && (
                            <>
                                <h2>Recent GARs</h2>
                                <table>
                                    <tbody>
                                        {data.entries.slice(0, 10).map(e => <tr key={e.id}><td style={{ width: 130 }}>{prettyDate(e.date)}</td><td><strong>{crewName[e.crewId]}</strong></td></tr>)}
                                    </tbody>
                                </table>
                            </>
                        )}

                        {inc.notes && data.flightNotes.length > 0 && (
                            <>
                                <h2>Flying log notes</h2>
                                <table>
                                    <tbody>
                                        {data.flightNotes.map((n, i) => <tr key={i}><td style={{ width: 90 }}>{n.date}</td><td style={{ width: 90 }}>{n.bucket}</td><td style={{ width: 170 }}><strong>{n.crew}</strong></td><td>{n.text}</td></tr>)}
                                    </tbody>
                                </table>
                            </>
                        )}

                        </>)}

                        <div className="rp-muted" style={{ marginTop: 22, fontSize: 11 }}>Generated {prettyDate(today)} from the Crew Flying Tracker. Times in Zulu.</div>
                    </div>
                </div>
            );
        };


        // --- TRENDS ---
        const TREND_COLORS = ['#2563eb', '#f59e0b', '#10b981', '#8b5cf6', '#ef4444', '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#64748b'];
        const MONTH_ABBR = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        // The last 12 weeks (Mon-Sun) or 12 months, oldest first, ending with the current one.
        const buildTrendPeriods = (gran, today) => {
            const [y, m, d] = today.split('-').map(Number);
            const periods = [];
            if (gran === 'weeks') {
                const dow = (new Date(y, m - 1, d).getDay() + 6) % 7; // Monday = 0
                const thisMonday = addDays(today, -dow);
                for (let i = 11; i >= 0; i--) {
                    const start = addDays(thisMonday, -7 * i);
                    const [, sm, sd] = start.split('-').map(Number);
                    periods.push({ start, end: addDays(start, 6), label: `${sm}/${sd}`, title: `Week of ${sd} ${MONTH_ABBR[sm - 1]}` });
                }
            } else {
                for (let i = 11; i >= 0; i--) {
                    const first = new Date(y, m - 1 - i, 1);
                    const last = new Date(y, m - i, 0);
                    periods.push({ start: toDateStr(first), end: toDateStr(last), label: MONTH_ABBR[first.getMonth()], title: `${MONTH_ABBR[first.getMonth()]} ${first.getFullYear()}` });
                }
            }
            return periods;
        };

        const chartText = { fontSize: 11, fontFamily: 'Inter, sans-serif' };

        const StackedBars = ({ periods, series, compact }) => {
            const W = compact ? 420 : 720, H = compact ? 220 : 250, L = 30, R = 6, T = 16, B = 26;
            const totals = periods.map((_, i) => series.reduce((sum, x) => sum + x.values[i], 0));
            const max = Math.max(1, ...totals);
            const niceMax = max <= 5 ? max : Math.ceil(max / 5) * 5;
            const ticks = niceMax <= 5 ? Array.from({ length: niceMax + 1 }, (_, i) => i) : [0, 1, 2, 3, 4, 5].map(i => (i * niceMax) / 5);
            const bw = (W - L - R) / periods.length;
            const y = (v) => T + (H - T - B) * (1 - v / niceMax);
            return (
                <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="Stacked bar chart">
                    {ticks.map(t => (
                        <g key={t}>
                            <line x1={L} x2={W - R} y1={y(t)} y2={y(t)} stroke="rgba(148,163,184,.3)" strokeWidth="1" />
                            <text x={L - 6} y={y(t) + 4} textAnchor="end" className="fill-current text-slate-500" style={chartText}>{t}</text>
                        </g>
                    ))}
                    {periods.map((per, i) => {
                        let acc = 0;
                        return (
                            <g key={per.start}>
                                {series.map(sr => {
                                    const v = sr.values[i];
                                    if (!v) return null;
                                    const rect = <rect key={sr.crew.id} x={L + i * bw + bw * 0.15} width={bw * 0.7} y={y(acc + v)} height={y(acc) - y(acc + v)} fill={sr.color} rx="1.5"><title>{`${sr.crew.crewName}: ${v} (${per.title})`}</title></rect>;
                                    acc += v;
                                    return rect;
                                })}
                                {totals[i] > 0 && <text x={L + i * bw + bw / 2} y={y(totals[i]) - 4} textAnchor="middle" className="fill-current text-slate-600" style={{ ...chartText, fontWeight: 700 }}>{totals[i]}</text>}
                                {(!compact || i % 2 === 0 || i === periods.length - 1) && <text x={L + i * bw + bw / 2} y={H - 8} textAnchor="middle" className="fill-current text-slate-500" style={chartText}>{per.label}</text>}
                            </g>
                        );
                    })}
                </svg>
            );
        };

        const SpreadLine = ({ periods, values, compact }) => {
            const W = compact ? 420 : 720, H = compact ? 170 : 190, L = 30, R = 10, T = 16, B = 26;
            const max = Math.max(1, ...values);
            const bw = (W - L - R) / periods.length;
            const x = (i) => L + i * bw + bw / 2;
            const y = (v) => T + (H - T - B) * (1 - v / max);
            const pts = values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
            return (
                <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto text-blue-600" role="img" aria-label="Line chart of crew spread">
                    {[0, max].map(t => (
                        <g key={t}>
                            <line x1={L} x2={W - R} y1={y(t)} y2={y(t)} stroke="rgba(148,163,184,.3)" strokeWidth="1" />
                            <text x={L - 6} y={y(t) + 4} textAnchor="end" className="fill-current text-slate-500" style={chartText}>{t}</text>
                        </g>
                    ))}
                    <polyline points={pts} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
                    {values.map((v, i) => (
                        <g key={i}>
                            <circle cx={x(i)} cy={y(v)} r="3.5" fill="currentColor"><title>{`${periods[i].title}: spread ${v}`}</title></circle>
                            {(!compact || i % 2 === 0 || i === periods.length - 1) && <text x={x(i)} y={H - 8} textAnchor="middle" className="fill-current text-slate-500" style={chartText}>{periods[i].label}</text>}
                        </g>
                    ))}
                </svg>
            );
        };

        const TrendsView = ({ crews, buckets, log, gar, notes, garFlags, compact }) => {
            const today = todayStr();
            const [gran, setGran] = useState('weeks');
            const periods = useMemo(() => buildTrendPeriods(gran, today), [gran, today]);
            const data = useMemo(() => {
                const idx = Object.fromEntries(crews.map((c, i) => [c.id, i]));
                const sorties = crews.map(() => periods.map(() => 0));
                const garCounts = crews.map(() => periods.map(() => 0));
                const place = (date) => periods.findIndex(per => date >= per.start && date <= per.end);
                Object.entries(log).forEach(([date, byBucket]) => {
                    if (date > today) return;
                    const pi = place(date);
                    if (pi < 0) return;
                    Object.values(byBucket).forEach(ids => ids.forEach(id => { if (idx[id] !== undefined) sorties[idx[id]][pi] += 1; }));
                });
                collectGarEntries(crews, gar, notes, buckets, today, garFlags).forEach(e => {
                    const pi = place(e.date);
                    if (pi >= 0 && idx[e.crewId] !== undefined) garCounts[idx[e.crewId]][pi] += 1;
                });
                const mk = (rows) => crews.map((c, i) => ({ crew: c, color: TREND_COLORS[i % TREND_COLORS.length], values: rows[i] }));
                const sortieSeries = mk(sorties), garSeries = mk(garCounts);
                const spread = periods.map((_, pi) => crews.length ? Math.max(...sorties.map(r => r[pi])) - Math.min(...sorties.map(r => r[pi])) : 0);
                const totals = sortieSeries.map(sr => ({ crew: sr.crew, total: sr.values.reduce((a, b) => a + b, 0) })).sort((a, b) => b.total - a.total);
                // balance trend: mean spread over the most recent third of the range vs the earliest third
                const active = periods.map((_, pi) => sorties.some(r => r[pi] > 0));
                const third = Math.floor(periods.length / 3);
                const mean = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
                const early = spread.slice(0, third).filter((_, i) => active[i]);
                const recent = spread.slice(-third).filter((_, i) => active[periods.length - third + i]);
                let balance = null;
                if (early.length && recent.length) {
                    const delta = mean(recent) - mean(early);
                    balance = delta <= -0.3 ? 'improving' : delta >= 0.3 ? 'widening' : 'steady';
                }
                return { sortieSeries, garSeries, spread, totals, balance, anyFlying: totals.some(t => t.total > 0) };
            }, [crews, buckets, log, gar, notes, garFlags, periods, today]);

            const Legend = () => (
                <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2">
                    {crews.map((c, i) => <span key={c.id} className="flex items-center gap-1.5 text-xs text-slate-600"><span className="inline-block w-2.5 h-2.5 rounded-sm" style={{ backgroundColor: TREND_COLORS[i % TREND_COLORS.length] }}></span>{c.crewName}</span>)}
                </div>
            );
            const top = data.totals[0], bottom = data.totals[data.totals.length - 1];
            const balanceInfo = { improving: ['Improving', 'text-emerald-600'], steady: ['Steady', 'text-slate-800'], widening: ['Widening', 'text-amber-600'] }[data.balance] || ['Not enough data', 'text-slate-400'];

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Trends</h2>
                            <p className="text-sm text-slate-500 mt-1">How flying and GARs have been spread over time. Planned days don't count until they arrive.</p>
                        </div>
                        <div className="inline-flex bg-white border border-slate-200 rounded-lg shadow-sm p-1 gap-1">
                            {[['weeks', 'Last 12 weeks'], ['months', 'Last 12 months']].map(([k, label]) => (
                                <button key={k} onClick={() => setGran(k)} aria-pressed={gran === k} className={`px-3 py-1 rounded-md text-sm font-bold transition-colors ${gran === k ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>{label}</button>
                            ))}
                        </div>
                    </div>

                    {!crews.length || !data.anyFlying ? (
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-10 text-center text-slate-400">
                            <i className="fa-solid fa-chart-line text-4xl mb-3"></i>
                            <p className="text-sm">No flying logged in this range yet. Log some flights and the trends will appear here.</p>
                        </div>
                    ) : (
                        <>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div className="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-100">
                                    <p className="text-sm font-medium text-slate-500">Most sorties</p>
                                    <h3 className="text-lg font-bold text-slate-800 mt-1 leading-tight">{top.crew.crewName}</h3>
                                    <p className="text-xs text-slate-500 mt-1">{top.total} in this range</p>
                                </div>
                                <div className="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-100">
                                    <p className="text-sm font-medium text-slate-500">Fewest sorties</p>
                                    <h3 className="text-lg font-bold text-slate-800 mt-1 leading-tight">{bottom.crew.crewName}</h3>
                                    <p className="text-xs text-slate-500 mt-1">{bottom.total} in this range</p>
                                </div>
                                <div className="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-100">
                                    <p className="text-sm font-medium text-slate-500">Balance</p>
                                    <h3 className={`text-lg font-bold mt-1 leading-tight ${balanceInfo[1]}`}>{balanceInfo[0]}</h3>
                                    <p className="text-xs text-slate-500 mt-1">Recent spread vs. the start of the range</p>
                                </div>
                            </div>

                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                                <h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm mb-2">Sorties per {gran === 'weeks' ? 'week' : 'month'}, by crew</h3>
                                <StackedBars periods={periods} series={data.sortieSeries} compact={compact} />
                                <Legend />
                            </div>

                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                                <h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm">Spread between crews</h3>
                                <p className="text-xs text-slate-500 mb-2">Most sorties minus fewest in each {gran === 'weeks' ? 'week' : 'month'}. Lower means flying was more even.</p>
                                <SpreadLine periods={periods} values={data.spread} compact={compact} />
                            </div>

                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                                <h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm mb-2">GARs filled per {gran === 'weeks' ? 'week' : 'month'}, by crew</h3>
                                <StackedBars periods={periods} series={data.garSeries} compact={compact} />
                                <Legend />
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const SimpleListView = ({ title, items, columns, renderRow, icon, onAdd, onEdit, onDelete, canEdit = true }) => (
            <div className="space-y-6">
                <div className="flex justify-between items-center">
                    <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-3">
                        <i className={`${icon} text-blue-500 bg-blue-100 p-2 rounded-lg`}></i> {title}
                    </h2>
                    {canEdit && <button onClick={onAdd} className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all shadow-md">
                        <i className="fa-solid fa-plus"></i> Add New
                    </button>}
                </div>
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider font-bold">
                                    {columns.map((col, i) => <th key={i} className="p-4">{col}</th>)}
                                    {canEdit && <th className="p-4 text-right">Actions</th>}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {items.map((item, idx) => (
                                    <tr key={item.id || idx} className="hover:bg-slate-50 transition-colors group">
                                        {renderRow(item)}
                                        {canEdit && <td className="p-4 text-right whitespace-nowrap">
                                            <div className="flex justify-end gap-1">
                                                <button onClick={() => onEdit(item)} className="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded transition-colors"><i className="fa-solid fa-pen"></i></button>
                                                <button onClick={() => onDelete(item)} className="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors"><i className="fa-solid fa-trash"></i></button>
                                            </div>
                                        </td>}
                                    </tr>
                                ))}
                                {items.length === 0 && <tr><td colSpan={columns.length + 1} className="p-8 text-center text-slate-400">No records found.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        );

        // --- MAIN APP ---
        function FlightSchedulerApp({ cloud = false, db = null, user = null, onSignOut = null, cloudUnavailable = false, mode = 'editor', onSetMode = null, layout = 'auto', setLayout = () => {}, isMobile = false }) {
            const [menuOpen, setMenuOpen] = useState(false);
            useEffect(() => { if (!isMobile) setMenuOpen(false); }, [isMobile]);
            const canEdit = mode === 'editor'; // viewers see everything but cannot change anything
            const [activeTab, setActiveTab] = useState('dashboard');
            // In cloud mode the shared data arrives from Firestore; otherwise it lives in this browser.
            const [crews, setCrews] = useState(() => cloud ? [] : loadStored('flyfair_crews', INITIAL_CREWS));
            const [buckets, setBuckets] = useState(() => cloud ? [] : loadStored('flyfair_buckets', INITIAL_BUCKETS));
            const [log, setLog] = useState(() => cloud ? {} : loadStored('flyfair_log', buildSeedLog()));
            const [notes, setNotes] = useState(() => cloud ? {} : loadStored('flyfair_notes', {}));
            const [garFlags, setGarFlags] = useState(() => cloud ? {} : loadStored('flyfair_garflags', {}));
            const [gar, setGar] = useState(() => cloud ? {} : loadStored('flyfair_gar', buildSeedGar()));
            const [period, setPeriod] = useState(() => { const v = loadStored('flyfair_period', 30); return PERIODS.includes(v) ? v : 30; });
            const [selectedDate, setSelectedDate] = useState(todayStr());

            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));
            const [saveStatus, setSaveStatus] = useState('');

            // --- cloud sync: Firestore documents <-> the state above ---
            const [syncState, setSyncState] = useState(cloud ? 'connecting' : 'local'); // connecting | needsImport | ready | error
            const [syncError, setSyncError] = useState('');
            const [retryTick, setRetryTick] = useState(0);
            const remoteRef = useRef({});       // docId -> canonical JSON the cloud is known to hold
            const latestRef = useRef({});
            const remoteDirty = useRef(false);  // set while a remote change is applied but not yet rendered
            const flushTimer = useRef(null);
            const pendingImport = useRef(null);
            latestRef.current = { crews, buckets, log, notes, gar, garFlags };

            const applyChanges = (upserts, removals) => {
                remoteDirty.current = true;
                if (!skipUntil.current || skipUntil.current < Date.now()) skipUntil.current = Date.now() + 800;
                const byOrder = (a, b) => (a.order ?? 1e9) - (b.order ?? 1e9) || (a.crewName || '').localeCompare(b.crewName || '');
                const crewUp = [], bucketUp = [], dayUp = [], garUp = [];
                const crewDel = new Set(), bucketDel = new Set(), dayDel = new Set(), garDel = new Set();
                upserts.forEach(({ id, data }) => {
                    const { type, ...rest } = clean(data);
                    if (id.startsWith('crew-')) crewUp.push(rest);
                    else if (id.startsWith('bucket-')) bucketUp.push(rest);
                    else if (id.startsWith('day-')) dayUp.push(rest);
                    else if (id.startsWith('gar-')) garUp.push(rest);
                });
                removals.forEach(id => {
                    if (id.startsWith('crew-')) crewDel.add(id.slice(5));
                    else if (id.startsWith('bucket-')) bucketDel.add(id.slice(7));
                    else if (id.startsWith('day-')) dayDel.add(id.slice(4));
                    else if (id.startsWith('gar-')) garDel.add(id.slice(4));
                });
                if (crewUp.length || crewDel.size) setCrews(prev => {
                    const map = new Map(prev.map(c => [c.id, c]));
                    crewDel.forEach(id => map.delete(id));
                    crewUp.forEach(c => map.set(c.id, c));
                    return [...map.values()].sort(byOrder);
                });
                if (bucketUp.length || bucketDel.size) setBuckets(prev => {
                    const map = new Map(prev.map(b => [b.id, b]));
                    bucketDel.forEach(id => map.delete(id));
                    bucketUp.forEach(b => map.set(b.id, b));
                    return [...map.values()];
                });
                if (dayUp.length || dayDel.size) {
                    const touched = new Set([...dayDel, ...dayUp.map(d => d.date)]);
                    setLog(prev => {
                        const next = { ...prev };
                        dayDel.forEach(d => delete next[d]);
                        dayUp.forEach(d => { if (Object.keys(d.byBucket || {}).length) next[d.date] = d.byBucket; else delete next[d.date]; });
                        return next;
                    });
                    setNotes(prev => {
                        const next = {};
                        Object.entries(prev).forEach(([k, v]) => { if (!touched.has(k.split('|')[0])) next[k] = v; });
                        dayUp.forEach(d => Object.entries(d.notes || {}).forEach(([k, v]) => { next[`${d.date}|${k}`] = v; }));
                        return next;
                    });
                    setGarFlags(prev => {
                        const next = {};
                        Object.entries(prev).forEach(([k, v]) => { if (!touched.has(k.split('|')[0])) next[k] = v; });
                        dayUp.forEach(d => Object.keys(d.gars || {}).forEach(k => { next[`${d.date}|${k}`] = true; }));
                        return next;
                    });
                }
                if (garUp.length || garDel.size) setGar(prev => {
                    const next = { ...prev };
                    garDel.forEach(d => delete next[d]);
                    garUp.forEach(g => { next[g.date] = { crewId: g.crewId, note: g.note || '' }; });
                    return next;
                });
            };

            useEffect(() => {
                if (!cloud) return;
                let first = true;
                const unsub = db.collection('tracker').onSnapshot(snap => {
                    if (first) {
                        if (snap.metadata.fromCache && snap.empty) return; // wait for the server before deciding the cloud is empty
                        first = false;
                        snap.docs.forEach(d => { remoteRef.current[d.id] = canon(clean(d.data())); });
                        if (snap.empty) {
                            const local = readLocalData();
                            if (local && canEdit) { pendingImport.current = local; setSyncState('needsImport'); } else setSyncState('ready');
                        } else {
                            applyChanges(snap.docs.map(d => ({ id: d.id, data: d.data() })), []);
                            setSyncState('ready');
                        }
                        return;
                    }
                    const upserts = [], removals = [];
                    snap.docChanges().forEach(ch => {
                        const id = ch.doc.id;
                        if (ch.type === 'removed') { delete remoteRef.current[id]; removals.push(id); return; }
                        remoteRef.current[id] = canon(clean(ch.doc.data()));
                        if (!ch.doc.metadata.hasPendingWrites) upserts.push({ id, data: ch.doc.data() }); // our own writes are already in state
                    });
                    if (upserts.length || removals.length) applyChanges(upserts, removals);
                }, err => {
                    setSyncError(err && err.code === 'permission-denied'
                        ? 'The database refused access. Check that the Firestore rules allow signed-in users to read and write the "tracker" collection.'
                        : `Cannot reach the database${err && err.code ? ` (${err.code})` : ''}. Check your connection and reload.`);
                    setSyncState('error');
                });
                const slow = setTimeout(() => setSyncError(prev => prev || 'Still connecting… if this stays here, check your connection and that Firestore is created in the Firebase console.'), 10000);
                return () => { unsub(); clearTimeout(slow); };
            }, [cloud]);

            // Write whatever differs from the cloud, shortly after the last local change.
            useEffect(() => {
                if (!cloud || syncState !== 'ready') return;
                remoteDirty.current = false;
                clearTimeout(flushTimer.current);
                flushTimer.current = setTimeout(() => {
                    if (remoteDirty.current || !canEdit) return; // a remote change is mid-render (the next render reschedules), or this is a read-only session
                    const { crews: c, buckets: b, log: l, notes: n, gar: g, garFlags: gf } = latestRef.current;
                    const desired = buildDocs(c, b, l, n, g, gf);
                    const ops = [];
                    Object.entries(desired).forEach(([id, data]) => { const cj = canon(data); if (remoteRef.current[id] !== cj) ops.push({ id, data, cj }); });
                    Object.keys(remoteRef.current).forEach(id => { if (!(id in desired)) ops.push({ id, del: true }); });
                    if (!ops.length) return;
                    setSaveStatus('Saving to cloud...');
                    const col = db.collection('tracker');
                    const batches = [];
                    for (let i = 0; i < ops.length; i += 400) {
                        const batch = db.batch();
                        ops.slice(i, i + 400).forEach(op => op.del ? batch.delete(col.doc(op.id)) : batch.set(col.doc(op.id), op.data));
                        batches.push(batch.commit());
                    }
                    ops.forEach(op => { if (op.del) delete remoteRef.current[op.id]; else remoteRef.current[op.id] = op.cj; });
                    Promise.all(batches).then(() => {
                        setSaveStatus('Saved to cloud');
                        setTimeout(() => setSaveStatus(''), 2000);
                    }).catch(err => {
                        ops.forEach(op => { if (op.del) remoteRef.current[op.id] = '?'; else delete remoteRef.current[op.id]; });
                        setSaveStatus(err && err.code === 'permission-denied' ? 'Save refused by database rules' : 'Save failed — retrying');
                        setTimeout(() => setRetryTick(t => t + 1), 5000);
                    });
                }, 300);
                return () => clearTimeout(flushTimer.current);
            }, [cloud, syncState, crews, buckets, log, notes, gar, garFlags, retryTick, canEdit]);


            // --- undo / redo of this session's own changes ---
            // Changes are tracked as before/after versions of the stored documents they touched, so undoing
            // restores only those documents and leaves other people's edits alone.
            const [history, setHistory] = useState({ undo: [], redo: [] });
            const [toast, setToast] = useState(null);
            const historyRef = useRef(history);
            historyRef.current = history;
            const prevDocsRef = useRef(null);
            const skipUntil = useRef(0);        // changes applied from the cloud or by undo/redo are not new history
            const lastEntryAt = useRef(0);
            const toastTimer = useRef(null);

            const describeChange = (before, after) => {
                const crewName = (id) => (latestRef.current.crews.find(c => c.id === id) || {}).crewName || 'a crew';
                const bucketName = (id) => (latestRef.current.buckets.find(b => b.id === id) || {}).name || 'a bucket';
                const ids = Object.keys(after);
                const kind = (pre) => ids.filter(id => id.startsWith(pre));
                const extra = (n) => ids.length > n ? ` (+${ids.length - n} related)` : '';
                for (const id of kind('crew-')) {
                    if (!before[id]) return `Added crew ${after[id].crewName}`;
                    if (!after[id]) return `Deleted crew ${before[id].crewName}${extra(1)}`;
                }
                for (const id of kind('crew-')) return `Edited crew ${after[id].crewName}`;
                for (const id of kind('bucket-')) {
                    if (!before[id]) return `Added bucket ${after[id].name}`;
                    if (!after[id]) return `Deleted bucket ${before[id].name}${extra(1)}`;
                    return `Edited bucket ${after[id].name}`;
                }
                for (const id of kind('gar-')) {
                    const a = after[id], b = before[id];
                    return a ? `Logged GAR: ${crewName(a.crewId)} (${a.date})` : `Removed GAR (${b.date})`;
                }
                for (const id of kind('day-')) {
                    const a = after[id] || { byBucket: {}, notes: {}, date: before[id].date }, b = before[id] || { byBucket: {}, notes: {} };
                    const flat = (doc) => Object.entries(doc.byBucket || {}).flatMap(([bk, crewIds]) => crewIds.map(c => `${bk}|${c}`));
                    const bs = new Set(flat(b)), as = new Set(flat(a));
                    const added = [...as].filter(k => !bs.has(k)), removed = [...bs].filter(k => !as.has(k));
                    const date = a.date || b.date;
                    const nice = (k) => { const [bk, c] = k.split('|'); return `${crewName(c)} in ${bucketName(bk)}`; };
                    if (added.length) return `Logged ${nice(added[0])}${added.length > 1 ? ` +${added.length - 1} more` : ''} (${date})`;
                    if (removed.length) return `Removed ${nice(removed[0])}${removed.length > 1 ? ` +${removed.length - 1} more` : ''} (${date})`;
                    return `Updated notes / GAR marks (${date})`;
                }
                return 'Change';
            };

            useEffect(() => {
                const cur = buildDocs(crews, buckets, log, notes, gar, garFlags);
                const prev = prevDocsRef.current;
                prevDocsRef.current = cur;
                if (prev === null) return;
                if (Date.now() < skipUntil.current) { skipUntil.current = 0; return; }
                if (!canEdit || (cloud && syncState !== 'ready')) return;
                const before = {}, after = {};
                new Set([...Object.keys(prev), ...Object.keys(cur)]).forEach(id => {
                    if ((prev[id] ? canon(prev[id]) : '') !== (cur[id] ? canon(cur[id]) : '')) { before[id] = prev[id] || null; after[id] = cur[id] || null; }
                });
                if (!Object.keys(after).length) return;
                const now = Date.now();
                const label = describeChange(before, after);
                setHistory(h => {
                    const last = h.undo[h.undo.length - 1];
                    const sameDocs = last && Object.keys(last.after).length === Object.keys(after).length && Object.keys(after).every(id => id in last.after);
                    if (sameDocs && now - lastEntryAt.current < 1500) { // typing in one field: one undo step, not one per keystroke
                        return { undo: [...h.undo.slice(0, -1), { ...last, after: { ...last.after, ...after }, label }], redo: [] };
                    }
                    return { undo: [...h.undo, { before, after, label }].slice(-50), redo: [] };
                });
                lastEntryAt.current = now;
                clearTimeout(toastTimer.current);
                setToast({ text: label });
                toastTimer.current = setTimeout(() => setToast(null), 7000);
            }, [crews, buckets, log, notes, gar, garFlags]);

            const restoreDocs = (docMap) => {
                const ups = [], rem = [];
                Object.entries(docMap).forEach(([id, d]) => { if (d) ups.push({ id, data: d }); else rem.push(id); });
                skipUntil.current = Date.now() + 800;
                applyChanges(ups, rem);
            };
            const showToast = (text) => { clearTimeout(toastTimer.current); setToast({ text }); toastTimer.current = setTimeout(() => setToast(null), 5000); };
            const undo = () => {
                const h = historyRef.current;
                if (!canEdit || !h.undo.length) return;
                const e = h.undo[h.undo.length - 1];
                restoreDocs(e.before);
                setHistory({ undo: h.undo.slice(0, -1), redo: [...h.redo, e] });
                showToast(`Undid: ${e.label}`);
            };
            const redo = () => {
                const h = historyRef.current;
                if (!canEdit || !h.redo.length) return;
                const e = h.redo[h.redo.length - 1];
                restoreDocs(e.after);
                setHistory({ undo: [...h.undo, e], redo: h.redo.slice(0, -1) });
                showToast(`Redid: ${e.label}`);
            };
            const undoRef = useRef(); undoRef.current = { undo, redo };
            useEffect(() => {
                const onKey = (e) => {
                    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
                    const el = e.target;
                    if (el && (['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName) || el.isContentEditable)) return; // let fields keep their own undo
                    const k = e.key.toLowerCase();
                    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undoRef.current.undo(); }
                    else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); undoRef.current.redo(); }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, []);

            const importLocalData = () => {
                const l = pendingImport.current;
                if (l) { setCrews(l.crews); setBuckets(l.buckets); setLog(l.log); setNotes(l.notes); setGar(l.gar); setGarFlags(l.garFlags || {}); }
                setSyncState('ready');
            };
            const [modalConfig, setModalConfig] = useState({ isOpen: false, type: null, data: null });
            const [confirmConfig, setConfirmConfig] = useState({ isOpen: false, title: '', message: '', onConfirm: () => {}, isDanger: false });

            useEffect(() => {
                if (cloud) {
                    try { localStorage.setItem('flyfair_period', JSON.stringify(period)); } catch (e) {}
                    return;
                }
                setSaveStatus('Saving...');
                let clearTimer;
                const timer = setTimeout(() => {
                    try {
                        localStorage.setItem('flyfair_crews', JSON.stringify(crews));
                        localStorage.setItem('flyfair_buckets', JSON.stringify(buckets));
                        localStorage.setItem('flyfair_log', JSON.stringify(log));
                        localStorage.setItem('flyfair_notes', JSON.stringify(notes));
                        localStorage.setItem('flyfair_garflags', JSON.stringify(garFlags));
                        localStorage.setItem('flyfair_gar', JSON.stringify(gar));
                        localStorage.setItem('flyfair_period', JSON.stringify(period));
                        setSaveStatus('Saved Offline');
                    } catch (e) {
                        setSaveStatus('Save failed');
                    }
                    clearTimer = setTimeout(() => setSaveStatus(''), 2000);
                }, 500);
                return () => { clearTimeout(timer); clearTimeout(clearTimer); };
            }, [cloud, crews, buckets, log, notes, gar, garFlags, period]);

            // log[date][bucketId] = [crewId, ...]; empty buckets and days are pruned.
            const handleSetNote = (date, bucketId, crewId, text) => {
                const key = noteKey(date, bucketId, crewId);
                const trimmed = text.trim();
                setNotes(prev => {
                    const next = { ...prev };
                    if (trimmed) next[key] = trimmed; else delete next[key];
                    return next;
                });
            };
            const handleSetGarFlag = (date, bucketId, crewId, on) => {
                const key = noteKey(date, bucketId, crewId);
                setGarFlags(prev => {
                    const next = { ...prev };
                    if (on) next[key] = true; else delete next[key];
                    return next;
                });
                const text = notes[key];
                if (!on && text && isGarNote(text)) { // older entries marked GAR by typing it in the note: clear that too
                    handleSetNote(date, bucketId, crewId, text.replace(/\bGAR\b/gi, '').replace(/\s{2,}/g, ' ').replace(/^[\s,;:\-–]+|[\s,;:\-–]+$/g, ''));
                }
            };
            const handleAddToBucket = (date, bucketId, crewId, note, isGar) => {
                if (note) handleSetNote(date, bucketId, crewId, note);
                if (isGar) setGarFlags(prev => ({ ...prev, [noteKey(date, bucketId, crewId)]: true }));
                setLog(prev => {
                    const day = prev[date] || {};
                    const ids = day[bucketId] || [];
                    if (ids.includes(crewId)) return prev;
                    return { ...prev, [date]: { ...day, [bucketId]: [...ids, crewId] } };
                });
            };
            const handleRemoveFromBucket = (date, bucketId, crewId) => {
                handleSetNote(date, bucketId, crewId, '');
                setGarFlags(prev => { const next = { ...prev }; delete next[noteKey(date, bucketId, crewId)]; return next; });
                setLog(prev => {
                    const day = { ...(prev[date] || {}) };
                    const ids = (day[bucketId] || []).filter(id => id !== crewId);
                    if (ids.length) day[bucketId] = ids; else delete day[bucketId];
                    const next = { ...prev };
                    if (Object.keys(day).length) next[date] = day; else delete next[date];
                    return next;
                });
            };

            const pruneLog = (shouldKeep) => {
                setGarFlags(prev => Object.fromEntries(Object.entries(prev).filter(([key]) => {
                    const [, bucketId, crewId] = key.split('|');
                    return shouldKeep(bucketId, crewId);
                })));
                setNotes(prev => Object.fromEntries(Object.entries(prev).filter(([key]) => {
                    const [, bucketId, crewId] = key.split('|');
                    return shouldKeep(bucketId, crewId);
                })));
                setLog(prev => {
                    const next = {};
                    Object.entries(prev).forEach(([date, byBucket]) => {
                        const day = {};
                        Object.entries(byBucket).forEach(([bucketId, ids]) => {
                            const kept = ids.filter(id => shouldKeep(bucketId, id));
                            if (kept.length) day[bucketId] = kept;
                        });
                        if (Object.keys(day).length) next[date] = day;
                    });
                    return next;
                });
            };

            const requestReset = () => {
                setConfirmConfig({
                    isOpen: true,
                    title: "Reset All Data?",
                    message: "This will clear local storage and restore the default demo data. This cannot be undone.",
                    isDanger: true,
                    onConfirm: () => {

                        setBuckets(INITIAL_BUCKETS);

            const handleDeleteCrew = (crew) => {

                        setBuckets(prev => prev.map(b => b.crewIds ? { ...b, crewIds: b.crewIds.filter(id => id !== crew.id) } : b));
                        pruneLog((bucketId, id) => id !== crew.id);

            const handleDeleteBucket = (bucket) => {
                setConfirmConfig({
                    isOpen: true,
                    title: "Delete Bucket?",

                    isDanger: true,
                    onConfirm: () => {
