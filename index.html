                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-600 mb-1">Message to crews (optional)</label>
                            <textarea rows={2} maxLength={500} value={message} onChange={e => setMessage(e.target.value)} placeholder="e.g. Please check your last-flown dates and flag any errors by Friday."
                                className="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-600 mb-2">Include</label>
                            <div className="flex flex-wrap gap-2">
                                {options.map(([k, label]) => (
                                    <button type="button" key={k} onClick={() => toggle(k)} aria-pressed={inc[k]}
                                        className={`px-3 py-1 text-sm rounded-full border ${inc[k] ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>
                                        {label}
                                    </button>
                                ))}
                            </div>
                            {inc.notes && <p className="text-xs text-amber-700 font-semibold mt-2"><i className="fa-solid fa-triangle-exclamation mr-1"></i>Flying log notes will be visible to everyone you share this with.</p>}
                        </div>
                        <div className="flex flex-wrap gap-2 pt-1">
                            <button onClick={() => window.print()} className="px-4 py-2 rounded-lg font-bold text-sm text-white bg-blue-600 hover:bg-blue-700"><i className="fa-solid fa-print mr-2"></i>Print / Save PDF</button>
                            <button onClick={copyText} className="px-4 py-2 rounded-lg font-bold text-sm text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-200"><i className="fa-regular fa-copy mr-2"></i>{copied || 'Copy as text'}</button>
                            {canShare && <button onClick={shareText} className="px-4 py-2 rounded-lg font-bold text-sm text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-200"><i className="fa-solid fa-share-nodes mr-2"></i>Share…</button>}
                        </div>
                    </div>

                    <div id="report-sheet" className="rp-sheet">
                        <h1>{title || 'Crew Flying Report'}</h1>
                        <div className="rp-sub">As of {prettyDate(asOf)} · flying over the last {period} days ({data.from} to {asOf})</div>
                        {message.trim() && <div className="rp-msg">{message.trim()}</div>}

                        {inc.flying && (
                            <>
                                <h2>Flying — longest gap first</h2>
                                <table>
                                    <thead><tr><th>#</th><th>Crew</th><th>Last flown</th><th className="rp-num">Sorties</th>{inc.time30 && <th>30-day time</th>}</tr></thead>
                                    <tbody>
                                        {data.stats.map((s, i) => (
                                            <tr key={s.crew.id}>
                                                <td className="rp-muted">{i + 1}</td>
                                                <td><strong>{s.crew.crewName}</strong></td>
                                                <td className={s.daysSince === null ? 'rp-flag' : ''}>{lastText(s)}</td>
                                                <td className="rp-num">{s.sorties}</td>
                                                {inc.time30 && <td>{time30Text(s.crew)}</td>}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </>
                        )}

                        {inc.buckets && data.perBucket.length > 0 && (
                            <>
                                <h2>By bucket — longest gap in that bucket first</h2>
                                {data.perBucket.map(({ bucket, rows, avg, designated, outsiders }) => (
                                    <div key={bucket.id} style={{ breakInside: 'avoid' }}>
                                        <h3><span style={{ display: 'inline-block', width: 9, height: 9, borderRadius: 9, background: bucket.color, marginRight: 6 }}></span>{bucket.name} <span className="rp-muted" style={{ fontWeight: 400 }}>{formatMilTime(bucket.start)}–{formatMilTime(bucket.end)}Z · {designated.length ? `${designated.length} assigned crews` : 'all crews'} · avg {avg.toFixed(1)}</span></h3>
                                        <table style={{ tableLayout: 'fixed' }}>
                                            <colgroup><col style={{ width: 28 }} /><col style={{ width: '38%' }} /><col /><col style={{ width: 50 }} /></colgroup>
                                            <tbody>
                                                {rows.map((r, i) => (
                                                    <tr key={r.crew.id}>
                                                        <td className="rp-muted" style={{ width: 24 }}>{i + 1}</td>
                                                        <td><strong>{r.crew.crewName}</strong></td>
                                                        <td className={r.lastByBucket[bucket.id] ? '' : 'rp-flag'}>{r.lastByBucket[bucket.id] ? `${r.lastByBucket[bucket.id]} (${sinceLabel(r.daysSinceByBucket[bucket.id]).toLowerCase()})` : 'never in this bucket'}</td>
                                                        <td className="rp-num">{r.perBucket[bucket.id] || 0}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                        {outsiders.length > 0 && <div className="rp-muted" style={{ marginTop: 3 }}>Also flew here, not assigned: {outsiders.map(r => `${r.crew.crewName} (${r.perBucket[bucket.id]})`).join(', ')}</div>}
                                    </div>
                                ))}
                            </>
                        )}

                        {inc.gar && (
                            <>
                                <h2>GAR — up-next order</h2>
                                <table>
                                    <thead><tr><th>#</th><th>Crew</th><th>Last GAR</th><th className="rp-num">Total</th></tr></thead>
                                    <tbody>
                                        {data.rotation.map((r, i) => (
                                            <tr key={r.crew.id}>
                                                <td className="rp-muted">{i + 1}</td>
                                                <td><strong>{r.crew.crewName}</strong>{i === 0 && <span className="rp-next"> · next up</span>}</td>
                                                <td className={r.last ? '' : 'rp-flag'}>{r.last ? `${r.last} (${sinceLabel(r.daysSince).toLowerCase()})` : 'no GAR yet'}</td>
                                                <td className="rp-num">{r.total}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </>
                        )}

                        {inc.garHistory && data.entries.length > 0 && (
                            <>
                                <h2>Recent GARs</h2>
                                <table>
                                    <tbody>
                                        {data.entries.slice(0, 10).map(e => <tr key={e.id}><td style={{ width: 130 }}>{prettyDate(e.date)}</td><td><strong>{crewName[e.crewId]}</strong></td></tr>)}
                                    </tbody>
                                </table>
                            </>
                        )}

                        {inc.notes && data.flightNotes.length > 0 && (
                            <>
                                <h2>Flying log notes</h2>
                                <table>
                                    <tbody>
                                        {data.flightNotes.map((n, i) => <tr key={i}><td style={{ width: 90 }}>{n.date}</td><td style={{ width: 90 }}>{n.bucket}</td><td style={{ width: 170 }}><strong>{n.crew}</strong></td><td>{n.text}</td></tr>)}
                                    </tbody>
                                </table>
                            </>
                        )}

                        <div className="rp-muted" style={{ marginTop: 22, fontSize: 11 }}>Generated {prettyDate(today)} from the Crew Flying Tracker. Times in Zulu.</div>
                    </div>
                </div>
            );
        };

        const SimpleListView = ({ title, items, columns, renderRow, icon, onAdd, onEdit, onDelete }) => (
            <div className="space-y-6">
                <div className="flex justify-between items-center">
                    <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-3">
                        <i className={`${icon} text-blue-500 bg-blue-100 p-2 rounded-lg`}></i> {title}
                    </h2>
                    <button onClick={onAdd} className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all shadow-md">
                        <i className="fa-solid fa-plus"></i> Add New
                    </button>
                </div>
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider font-bold">
                                    {columns.map((col, i) => <th key={i} className="p-4">{col}</th>)}
                                    <th className="p-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {items.map((item, idx) => (
                                    <tr key={item.id || idx} className="hover:bg-slate-50 transition-colors group">
                                        {renderRow(item)}
                                        <td className="p-4 text-right whitespace-nowrap">
                                            <div className="flex justify-end gap-2 opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity">
                                                <button onClick={() => onEdit(item)} className="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded transition-colors"><i className="fa-solid fa-pen"></i></button>
                                                <button onClick={() => onDelete(item)} className="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors"><i className="fa-solid fa-trash"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                                {items.length === 0 && <tr><td colSpan={columns.length + 1} className="p-8 text-center text-slate-400">No records found.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        );

        // --- MAIN APP ---
        function FlightSchedulerApp({ cloud = false, db = null, user = null, onSignOut = null, cloudUnavailable = false }) {
            const [activeTab, setActiveTab] = useState('dashboard');
            // In cloud mode the shared data arrives from Firestore; otherwise it lives in this browser.
            const [crews, setCrews] = useState(() => cloud ? [] : loadStored('flyfair_crews', INITIAL_CREWS));
            const [buckets, setBuckets] = useState(() => cloud ? [] : loadStored('flyfair_buckets', INITIAL_BUCKETS));
            const [log, setLog] = useState(() => cloud ? {} : loadStored('flyfair_log', buildSeedLog()));
            const [notes, setNotes] = useState(() => cloud ? {} : loadStored('flyfair_notes', {}));
            const [gar, setGar] = useState(() => cloud ? {} : loadStored('flyfair_gar', buildSeedGar()));
            const [period, setPeriod] = useState(() => loadStored('flyfair_period', 30));
            const [selectedDate, setSelectedDate] = useState(todayStr());

            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));
            const [saveStatus, setSaveStatus] = useState('');

            // --- cloud sync: Firestore documents <-> the state above ---
            const [syncState, setSyncState] = useState(cloud ? 'connecting' : 'local'); // connecting | needsImport | ready | error
            const [syncError, setSyncError] = useState('');
            const [retryTick, setRetryTick] = useState(0);
            const remoteRef = useRef({});       // docId -> canonical JSON the cloud is known to hold
            const latestRef = useRef({});
            const remoteDirty = useRef(false);  // set while a remote change is applied but not yet rendered
            const flushTimer = useRef(null);
            const pendingImport = useRef(null);
            latestRef.current = { crews, buckets, log, notes, gar };

            const applyChanges = (upserts, removals) => {
                remoteDirty.current = true;
                const byOrder = (a, b) => (a.order ?? 1e9) - (b.order ?? 1e9) || (a.crewName || '').localeCompare(b.crewName || '');
                const crewUp = [], bucketUp = [], dayUp = [], garUp = [];
                const crewDel = new Set(), bucketDel = new Set(), dayDel = new Set(), garDel = new Set();
                upserts.forEach(({ id, data }) => {
                    const { type, ...rest } = clean(data);
                    if (id.startsWith('crew-')) crewUp.push(rest);
                    else if (id.startsWith('bucket-')) bucketUp.push(rest);
                    else if (id.startsWith('day-')) dayUp.push(rest);
                    else if (id.startsWith('gar-')) garUp.push(rest);
                });
                removals.forEach(id => {
                    if (id.startsWith('crew-')) crewDel.add(id.slice(5));
                    else if (id.startsWith('bucket-')) bucketDel.add(id.slice(7));
                    else if (id.startsWith('day-')) dayDel.add(id.slice(4));
                    else if (id.startsWith('gar-')) garDel.add(id.slice(4));
                });
                if (crewUp.length || crewDel.size) setCrews(prev => {
                    const map = new Map(prev.map(c => [c.id, c]));
                    crewDel.forEach(id => map.delete(id));
                    crewUp.forEach(c => map.set(c.id, c));
                    return [...map.values()].sort(byOrder);
                });
                if (bucketUp.length || bucketDel.size) setBuckets(prev => {
                    const map = new Map(prev.map(b => [b.id, b]));
                    bucketDel.forEach(id => map.delete(id));
                    bucketUp.forEach(b => map.set(b.id, b));
                    return [...map.values()];
                });
                if (dayUp.length || dayDel.size) {
                    const touched = new Set([...dayDel, ...dayUp.map(d => d.date)]);
                    setLog(prev => {
                        const next = { ...prev };
                        dayDel.forEach(d => delete next[d]);
                        dayUp.forEach(d => { if (Object.keys(d.byBucket || {}).length) next[d.date] = d.byBucket; else delete next[d.date]; });
                        return next;
                    });
                    setNotes(prev => {
                        const next = {};
                        Object.entries(prev).forEach(([k, v]) => { if (!touched.has(k.split('|')[0])) next[k] = v; });
                        dayUp.forEach(d => Object.entries(d.notes || {}).forEach(([k, v]) => { next[`${d.date}|${k}`] = v; }));
                        return next;
                    });
                }
                if (garUp.length || garDel.size) setGar(prev => {
                    const next = { ...prev };
                    garDel.forEach(d => delete next[d]);
                    garUp.forEach(g => { next[g.date] = { crewId: g.crewId, note: g.note || '' }; });
                    return next;
                });
            };

            useEffect(() => {
                if (!cloud) return;
                let first = true;
                const unsub = db.collection('tracker').onSnapshot(snap => {
                    if (first) {
                        if (snap.metadata.fromCache && snap.empty) return; // wait for the server before deciding the cloud is empty
                        first = false;
                        snap.docs.forEach(d => { remoteRef.current[d.id] = canon(clean(d.data())); });
                        if (snap.empty) {
                            const local = readLocalData();
                            if (local) { pendingImport.current = local; setSyncState('needsImport'); } else setSyncState('ready');
                        } else {
                            applyChanges(snap.docs.map(d => ({ id: d.id, data: d.data() })), []);
                            setSyncState('ready');
                        }
                        return;
                    }
                    const upserts = [], removals = [];
                    snap.docChanges().forEach(ch => {
                        const id = ch.doc.id;
                        if (ch.type === 'removed') { delete remoteRef.current[id]; removals.push(id); return; }
                        remoteRef.current[id] = canon(clean(ch.doc.data()));
                        if (!ch.doc.metadata.hasPendingWrites) upserts.push({ id, data: ch.doc.data() }); // our own writes are already in state
                    });
                    if (upserts.length || removals.length) applyChanges(upserts, removals);
                }, err => {
                    setSyncError(err && err.code === 'permission-denied'
                        ? 'The database refused access. Check that the Firestore rules allow signed-in users to read and write the "tracker" collection.'
                        : `Cannot reach the database${err && err.code ? ` (${err.code})` : ''}. Check your connection and reload.`);
                    setSyncState('error');
                });
                const slow = setTimeout(() => setSyncError(prev => prev || 'Still connecting… if this stays here, check your connection and that Firestore is created in the Firebase console.'), 10000);
                return () => { unsub(); clearTimeout(slow); };
            }, [cloud]);

            // Write whatever differs from the cloud, shortly after the last local change.
            useEffect(() => {
                if (!cloud || syncState !== 'ready') return;
                remoteDirty.current = false;
                clearTimeout(flushTimer.current);
                flushTimer.current = setTimeout(() => {
                    if (remoteDirty.current) return; // a remote change is mid-render; the next render reschedules
                    const { crews: c, buckets: b, log: l, notes: n, gar: g } = latestRef.current;
                    const desired = buildDocs(c, b, l, n, g);
                    const ops = [];
                    Object.entries(desired).forEach(([id, data]) => { const cj = canon(data); if (remoteRef.current[id] !== cj) ops.push({ id, data, cj }); });
                    Object.keys(remoteRef.current).forEach(id => { if (!(id in desired)) ops.push({ id, del: true }); });
                    if (!ops.length) return;
                    setSaveStatus('Saving to cloud...');
                    const col = db.collection('tracker');
                    const batches = [];
                    for (let i = 0; i < ops.length; i += 400) {
                        const batch = db.batch();
                        ops.slice(i, i + 400).forEach(op => op.del ? batch.delete(col.doc(op.id)) : batch.set(col.doc(op.id), op.data));
                        batches.push(batch.commit());
                    }
                    ops.forEach(op => { if (op.del) delete remoteRef.current[op.id]; else remoteRef.current[op.id] = op.cj; });
                    Promise.all(batches).then(() => {
                        setSaveStatus('Saved to cloud');
                        setTimeout(() => setSaveStatus(''), 2000);
                    }).catch(err => {
                        ops.forEach(op => { if (op.del) remoteRef.current[op.id] = '?'; else delete remoteRef.current[op.id]; });
                        setSaveStatus(err && err.code === 'permission-denied' ? 'Save refused by database rules' : 'Save failed — retrying');
                        setTimeout(() => setRetryTick(t => t + 1), 5000);
                    });
                }, 300);
                return () => clearTimeout(flushTimer.current);
            }, [cloud, syncState, crews, buckets, log, notes, gar, retryTick]);

            const importLocalData = () => {
                const l = pendingImport.current;
                if (l) { setCrews(l.crews); setBuckets(l.buckets); setLog(l.log); setNotes(l.notes); setGar(l.gar); }
                setSyncState('ready');
            };
            const [modalConfig, setModalConfig] = useState({ isOpen: false, type: null, data: null });
            const [confirmConfig, setConfirmConfig] = useState({ isOpen: false, title: '', message: '', onConfirm: () => {}, isDanger: false });

            useEffect(() => {
                if (cloud) {
                    try { localStorage.setItem('flyfair_period', JSON.stringify(period)); } catch (e) {}
                    return;
                }
                setSaveStatus('Saving...');
                let clearTimer;
                const timer = setTimeout(() => {
                    try {
                        localStorage.setItem('flyfair_crews', JSON.stringify(crews));
                        localStorage.setItem('flyfair_buckets', JSON.stringify(buckets));
                        localStorage.setItem('flyfair_log', JSON.stringify(log));
                        localStorage.setItem('flyfair_notes', JSON.stringify(notes));
                        localStorage.setItem('flyfair_gar', JSON.stringify(gar));
                        localStorage.setItem('flyfair_period', JSON.stringify(period));
                        setSaveStatus('Saved Offline');
                    } catch (e) {
                        setSaveStatus('Save failed');
                    }
                    clearTimer = setTimeout(() => setSaveStatus(''), 2000);
                }, 500);
                return () => { clearTimeout(timer); clearTimeout(clearTimer); };
            }, [cloud, crews, buckets, log, notes, gar, period]);

            // log[date][bucketId] = [crewId, ...]; empty buckets and days are pruned.
            const handleSetNote = (date, bucketId, crewId, text) => {
                const key = noteKey(date, bucketId, crewId);
                const trimmed = text.trim();
                setNotes(prev => {
                    const next = { ...prev };
                    if (trimmed) next[key] = trimmed; else delete next[key];
                    return next;
                });
            };
            const handleAddToBucket = (date, bucketId, crewId, note) => {
                if (note) handleSetNote(date, bucketId, crewId, note);
                setLog(prev => {
                    const day = prev[date] || {};
                    const ids = day[bucketId] || [];
                    if (ids.includes(crewId)) return prev;
                    return { ...prev, [date]: { ...day, [bucketId]: [...ids, crewId] } };
                });
            };
            const handleRemoveFromBucket = (date, bucketId, crewId) => {
                handleSetNote(date, bucketId, crewId, '');
                setLog(prev => {
                    const day = { ...(prev[date] || {}) };
                    const ids = (day[bucketId] || []).filter(id => id !== crewId);
                    if (ids.length) day[bucketId] = ids; else delete day[bucketId];
                    const next = { ...prev };
                    if (Object.keys(day).length) next[date] = day; else delete next[date];
                    return next;
                });
            };

            const pruneLog = (shouldKeep) => {
                setNotes(prev => Object.fromEntries(Object.entries(prev).filter(([key]) => {
                    const [, bucketId, crewId] = key.split('|');
                    return shouldKeep(bucketId, crewId);
                })));
                setLog(prev => {
                    const next = {};
                    Object.entries(prev).forEach(([date, byBucket]) => {
                        const day = {};
                        Object.entries(byBucket).forEach(([bucketId, ids]) => {
                            const kept = ids.filter(id => shouldKeep(bucketId, id));
                            if (kept.length) day[bucketId] = kept;
                        });
                        if (Object.keys(day).length) next[date] = day;
                    });
                    return next;
                });
            };

            const requestReset = () => {
                setConfirmConfig({
                    isOpen: true,
                    title: "Reset All Data?",
                    message: "This will clear local storage and restore the default demo data. This cannot be undone.",
                    isDanger: true,
                    onConfirm: () => {
                        setCrews(INITIAL_CREWS);
                        setBuckets(INITIAL_BUCKETS);
                        setLog(buildSeedLog());
                        setNotes({});
                        setGar(buildSeedGar());
                        setPeriod(30);
                    }
                });
            };

            const handleDeleteCrew = (crew) => {
                setConfirmConfig({
                    isOpen: true,
                    title: "Delete Crew?",
                    message: `Remove ${crew.crewName} and all of their logged flying?`,
                    isDanger: true,
                    onConfirm: () => {
                        setCrews(prev => prev.filter(c => c.id !== crew.id));
                        setGar(prev => Object.fromEntries(Object.entries(prev).filter(([, e]) => e.crewId !== crew.id)));
                        setBuckets(prev => prev.map(b => b.crewIds ? { ...b, crewIds: b.crewIds.filter(id => id !== crew.id) } : b));
                        pruneLog((bucketId, id) => id !== crew.id);
                    }
                });
            };

            const handleDeleteBucket = (bucket) => {
                setConfirmConfig({
                    isOpen: true,
                    title: "Delete Bucket?",
                    message: `Remove the ${bucket.name} bucket and all flying logged in it? That flying will no longer count toward history.`,
                    isDanger: true,
                    onConfirm: () => {
                        setBuckets(prev => prev.filter(b => b.id !== bucket.id));
                        pruneLog((bucketId) => bucketId !== bucket.id);
                    }
                });
            };

            const toggleTheme = () => {
                const next = !isDark;
                document.documentElement.classList.toggle('dark', next);
                setIsDark(next);
                try { localStorage.setItem('flyfair_theme', next ? 'dark' : 'light'); } catch (e) {}
            };
            const handleUpdateCrew = (id, patch) => setCrews(prev => prev.map(c => c.id === id ? { ...c, ...patch } : c));
            const handleLogGar = (date, crewId, note) => {
                if (date > todayStr()) return;
                setGar(prev => ({ ...prev, [date]: { crewId, note } }));
            };
            const handleRemoveGar = (date) => setGar(prev => { const next = { ...prev }; delete next[date]; return next; });
            const closeModal = () => setModalConfig({ isOpen: false, type: null, data: null });

            const tabs = [
                { id: 'dashboard', label: 'Fairness', icon: 'fa-scale-balanced' },
                { id: 'calendar', label: 'Flying Log', icon: 'fa-calendar-days' },
                { id: 'gar', label: 'Ground Alert (GAR)', icon: 'fa-bell' },
                { id: 'buckets', label: 'Flying Buckets', icon: 'fa-clock' },
                { id: 'crews', label: 'Crews', icon: 'fa-users' },
                { id: 'report', label: 'Report', icon: 'fa-file-lines' }
            ];

            return (
                <div className="h-screen w-full flex flex-col md:flex-row overflow-hidden">

                    {/* Sidebar */}
                    <nav className="no-print w-full md:w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col shadow-2xl z-20">
                        <div className="p-6 flex items-center gap-3 text-white border-b border-slate-800 bg-slate-950/50">
                            <i className="fa-solid fa-shield-halved text-blue-500 text-2xl"></i>
                            <div>
                                <h1 className="font-black text-xl tracking-tight">STRATO<span className="text-blue-500">SCHED</span></h1>
                                <p className="text-[10px] text-slate-400 uppercase tracking-widest mt-0.5 font-bold">Flying Tracker</p>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto py-4">
                            <ul className="space-y-1 px-3">
                                {tabs.map(tab => {
                                    const isActive = activeTab === tab.id;
                                    return (
                                        <li key={tab.id}>
                                            <button onClick={() => setActiveTab(tab.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg font-semibold transition-all duration-200 ${isActive ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white text-slate-400'}`}>
                                                <i className={`fa-solid ${tab.icon} w-5 text-center ${isActive ? 'text-blue-200' : ''}`}></i>
                                                {tab.label}
                                            </button>
                                        </li>
                                    );
                                })}
                            </ul>
                        </div>
                        <div className="p-4 border-t border-slate-800 bg-slate-950/30">
                            {saveStatus && <div className="text-xs text-emerald-400 font-bold mb-3 flex items-center gap-2 justify-center"><i className="fa-solid fa-floppy-disk"></i> {saveStatus}</div>}
                            <button onClick={toggleTheme} className="w-full text-xs font-semibold text-slate-400 hover:text-white transition-colors py-2" aria-pressed={isDark}>
                                <i className={`fa-solid ${isDark ? 'fa-sun' : 'fa-moon'} mr-1`}></i> {isDark ? 'Light Theme' : 'Dark Theme'}
                            </button>
                            {cloud ? (
                                <>
                                    <div className="text-xs text-slate-400 text-center py-1 truncate">Signed in as <strong className="text-slate-200">{emailToUsername(user && user.email)}</strong></div>
                                    <button onClick={onSignOut} className="w-full text-xs font-semibold text-slate-400 hover:text-white transition-colors py-2"><i className="fa-solid fa-right-from-bracket mr-1"></i> Sign out</button>
                                </>
                            ) : (
                                <button onClick={requestReset} className="w-full text-xs font-semibold text-slate-500 hover:text-slate-300 transition-colors py-2"><i className="fa-solid fa-rotate-right mr-1"></i> Reset Demo Data</button>
                            )}
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto p-4 md:p-8 relative">
                        <div className="max-w-7xl mx-auto h-full">
                            {cloudUnavailable && <div className="mb-4 text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-3"><i className="fa-solid fa-triangle-exclamation mr-2"></i>Cloud sync could not load, so this page is working offline with data saved on this device only. Reload to try again.</div>}
                            {activeTab === 'dashboard' && <DashboardView crews={crews} buckets={buckets} log={log} period={period} setPeriod={setPeriod} onUpdateCrew={handleUpdateCrew} />}
                            {activeTab === 'calendar' && <CalendarView crews={crews} buckets={buckets} log={log} period={period} setPeriod={setPeriod} selectedDate={selectedDate} setSelectedDate={setSelectedDate} onAdd={handleAddToBucket} onRemove={handleRemoveFromBucket} notes={notes} onSetNote={handleSetNote} />}

                            {activeTab === 'report' && <ReportView crews={crews} buckets={buckets} log={log} notes={notes} gar={gar} period={period} />}
                            {activeTab === 'gar' && <GarView crews={crews} gar={gar} notes={notes} buckets={buckets} onLog={handleLogGar} onRemove={handleRemoveGar} />}

                            {activeTab === 'buckets' && (
                                <SimpleListView
                                    title="Flying Buckets" icon="fa-solid fa-clock" items={sortBuckets(buckets)}
                                    onAdd={() => setModalConfig({ isOpen: true, type: 'BUCKET', data: null })}
                                    onEdit={(b) => setModalConfig({ isOpen: true, type: 'BUCKET', data: b })}
                                    onDelete={handleDeleteBucket}
                                    columns={['Bucket', 'Hours (Z)', 'Crews']}
                                    renderRow={(b) => (
                                        <>
                                            <td className="p-4 font-black text-slate-800 text-base"><BucketDot color={b.color} className="mr-2" />{b.name}</td>
                                            <td className="p-4 text-sm font-mono font-semibold text-slate-600">{formatMilTime(b.start)} - {formatMilTime(b.end)}</td>
                                            <td className="p-4">
                                                <div className="flex gap-1 flex-wrap">
                                                    {designatedIds(b, crews).length === 0 ? <span className="text-slate-400 text-xs italic">All crews</span> :
                                                     designatedIds(b, crews).map(id => <span key={id} className="bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-200 uppercase">{crews.find(c => c.id === id).crewName}</span>)}
                                                </div>
                                            </td>
                                        </>
                                    )}
                                />
                            )}

                            {activeTab === 'crews' && (
                                <SimpleListView
                                    title="Crews" icon="fa-solid fa-users" items={crews}
                                    onAdd={() => setModalConfig({ isOpen: true, type: 'CREW', data: null })}
                                    onEdit={(c) => setModalConfig({ isOpen: true, type: 'CREW', data: c })}
                                    onDelete={handleDeleteCrew}
                                    columns={['Crew', 'Members']}
                                    renderRow={(crew) => (
                                        <>
                                            <td className="p-4 font-black text-slate-800 text-base">{crew.crewName}</td>
                                            <td className="p-4">
                                                <div className="space-y-1">
                                                    {crew.members.map(m => (
                                                        <div key={m.id} className="text-xs">
                                                            <span className="font-bold text-slate-700">{m.name}</span>
                                                            <span className="text-slate-500 ml-1">({m.role})</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </td>
                                        </>
                                    )}
                                />
                            )}
                        </div>
                    </main>

                    {cloud && syncState !== 'ready' && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 text-center">
                                {syncState === 'needsImport' ? (
                                    <>
                                        <h3 className="font-bold text-xl text-slate-800 mb-2">Import data from this browser?</h3>
                                        <p className="text-sm text-slate-600 mb-1">The shared database is empty, but this browser has saved data:</p>
                                        <p className="text-sm font-bold text-slate-800 mb-4">{pendingImport.current.crews.length} crews · {pendingImport.current.buckets.length} buckets · {Object.keys(pendingImport.current.log).length} logged days · {Object.keys(pendingImport.current.gar).length} GARs</p>
                                        <p className="text-xs text-slate-500 mb-5">If this is just the demo data, choose Start empty.</p>
                                        <div className="flex gap-3 justify-center">
                                            <button onClick={() => setSyncState('ready')} className="px-4 py-2 rounded-lg font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">Start empty</button>
                                            <button onClick={importLocalData} className="px-4 py-2 rounded-lg font-semibold text-white bg-blue-600 hover:bg-blue-700">Import</button>
                                        </div>
                                    </>
                                ) : syncState === 'error' ? (
                                    <>
                                        <div className="w-14 h-14 mx-auto rounded-full flex items-center justify-center mb-3 bg-red-100 text-red-600"><i className="fa-solid fa-triangle-exclamation text-2xl"></i></div>
                                        <h3 className="font-bold text-xl text-slate-800 mb-2">Can't load shared data</h3>
                                        <p className="text-sm text-slate-600 mb-4">{syncError}</p>
                                        <button onClick={onSignOut} className="px-4 py-2 rounded-lg font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">Sign out</button>
                                    </>
                                ) : (
                                    <>
                                        <i className="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500 mb-3"></i>
                                        <h3 className="font-bold text-lg text-slate-800">Loading shared data…</h3>
                                        {syncError && <p className="text-xs text-slate-500 mt-2">{syncError}</p>}
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Modals */}
                    <Modal
                        isOpen={modalConfig.isOpen}
                        title={modalConfig.type === 'CREW' ? (modalConfig.data ? "Edit Crew" : "Create New Crew") : (modalConfig.data ? "Edit Bucket" : "Create Flying Bucket")}
                        onClose={closeModal}
                    >
                        {modalConfig.type === 'CREW' && (
                            <CrewForm
                                initialData={modalConfig.data}
                                onCancel={closeModal}
                                onSave={(newCrew) => {
                                    setCrews(prev => modalConfig.data ? prev.map(c => c.id === newCrew.id ? newCrew : c) : [...prev, newCrew]);
                                    closeModal();
                                }}
                            />
                        )}
                        {modalConfig.type === 'BUCKET' && (
                            <BucketForm
                                initialData={modalConfig.data}
                                crews={crews}
                                onCancel={closeModal}
                                onSave={(newBucket) => {
                                    setBuckets(prev => modalConfig.data ? prev.map(b => b.id === newBucket.id ? newBucket : b) : [...prev, newBucket]);
                                    closeModal();
                                }}
                            />
                        )}
                    </Modal>

                    <ConfirmModal
                        isOpen={confirmConfig.isOpen}
                        title={confirmConfig.title}
                        message={confirmConfig.message}
                        isDanger={confirmConfig.isDanger}
                        onConfirm={confirmConfig.onConfirm}
                        onClose={() => setConfirmConfig({ ...confirmConfig, isOpen: false })}
                    />

                </div>
            );
        }

        // --- LOGIN + ROOT ---
        const LoginScreen = ({ auth }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            const submit = (e) => {
                e.preventDefault();
                if (!username.trim() || !password) return;
                setBusy(true); setError('');
                auth.signInWithEmailAndPassword(usernameToEmail(username), password)
                    .catch(err => { setError(authMessage(err)); setBusy(false); });
            };
            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
                    <form onSubmit={submit} className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 space-y-4">
                        <div className="text-center">
                            <i className="fa-solid fa-shield-halved text-blue-500 text-3xl"></i>
                            <h1 className="font-black text-2xl tracking-tight text-slate-800 mt-2">STRATO<span className="text-blue-500">SCHED</span></h1>
                            <p className="text-xs text-slate-500 uppercase tracking-widest font-bold">Flying Tracker</p>
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">Username</label>
                            <input autoFocus autoCapitalize="none" autoCorrect="off" autoComplete="username" type="text" value={username} onChange={e => setUsername(e.target.value)}
                                className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">Password</label>
                            <input autoComplete="current-password" type="password" value={password} onChange={e => setPassword(e.target.value)}
                                className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                        </div>
                        {error && <p role="alert" className="text-sm text-red-700 font-semibold"><i className="fa-solid fa-triangle-exclamation mr-1"></i>{error}</p>}
                        <button type="submit" disabled={busy || !username.trim() || !password} className="w-full py-2 rounded-lg font-bold text-white bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300">{busy ? 'Signing in…' : 'Sign in'}</button>
                        <p className="text-xs text-slate-500 text-center">Forgot your password? Ask your administrator to reset it.</p>
                    </form>
                </div>
            );
        };

        function Root() {
            const fb = window.firebase;
            const available = CLOUD_ENABLED && !!(fb && fb.auth && fb.firestore);
            const ctx = useMemo(() => {
                if (!available) return null;
                const app = fb.apps.length ? fb.app() : fb.initializeApp(FIREBASE_CONFIG);
                const db = app.firestore();
                try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}
                return { auth: app.auth(), db };
            }, []);
            const [user, setUser] = useState(available ? undefined : null);
            useEffect(() => ctx ? ctx.auth.onAuthStateChanged(u => setUser(u)) : undefined, [ctx]);

            if (!available) return <FlightSchedulerApp cloudUnavailable={CLOUD_ENABLED} />;
            if (user === undefined) return <div className="min-h-screen flex items-center justify-center bg-slate-900 text-slate-300"><i className="fa-solid fa-circle-notch fa-spin text-3xl"></i></div>;
            if (!user) return <LoginScreen auth={ctx.auth} />;
            return <FlightSchedulerApp key={user.uid} cloud db={ctx.db} user={user} onSignOut={() => ctx.auth.signOut()} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>
</html>
