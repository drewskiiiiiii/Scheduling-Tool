        const GarView = ({ crews, gar, notes, garFlags, buckets, onLog, onRemove, canEdit = true }) => {
            const today = todayStr();
            const [date, setDate] = useState(today);
            const [crewId, setCrewId] = useState('');
            const [note, setNote] = useState('');

            // every GAR, including ones scheduled for later days
            const allEntries = useMemo(() => collectGarEntries(crews, gar, notes, buckets, '9999-12-31', garFlags), [crews, gar, notes, buckets, garFlags]);
            const entries = useMemo(() => allEntries.filter(e => e.date <= today), [allEntries, today]);
            const upcoming = useMemo(() => allEntries.filter(e => e.date > today).sort((a, b) => a.date.localeCompare(b.date)), [allEntries, today]);

            const rotation = useMemo(() => computeGarRotation(crews, allEntries, today), [crews, allEntries, today]);

            const history = entries;
            const crewMap = Object.fromEntries(crews.map(c => [c.id, c]));
            const onAlert = entries.filter(x => x.date === today).map(x => crewMap[x.crewId].crewName);
            const nextUp = rotation.find(r => !r.unavailable);
            const nextScheduled = upcoming[0];
            const existing = gar[date];
            const maxTotal = Math.max(1, ...rotation.map(r => r.total));

            const submit = (e) => {
                e.preventDefault();
                if (!crewId || !date) return;
                onLog(date, crewId, note.trim());
                setNote('');

            return (
                <div className="space-y-6">
                    <div>

                    </div>

                    <div className="grid grid-cols-2 xl:grid-cols-4 gap-3">
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                            <p className="text-sm font-medium text-slate-500">On GAR Today</p>
                            <h3 className="text-xl font-bold text-slate-800 mt-1">{onAlert.length ? onAlert.join(', ') : 'None logged'}</h3>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                            <p className="text-sm font-medium text-slate-500">Next Scheduled</p>
                            <h3 className="text-lg font-bold text-slate-800 mt-1 leading-tight">{nextScheduled ? crewMap[nextScheduled.crewId].crewName : 'None scheduled'}</h3>
                            {nextScheduled && <p className="text-xs text-slate-500 mt-1">{prettyDate(nextScheduled.date)}</p>}
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                            <p className="text-sm font-medium text-slate-500">Next Up</p>
                            <h3 className="text-lg font-bold text-blue-700 mt-1 leading-tight">{nextUp ? nextUp.crew.crewName : '—'}</h3>
                            <p className="text-xs text-slate-500 mt-1">{nextUp ? (nextUp.next ? `Already scheduled ${nextUp.next}` : nextUp.last ? `Last GAR ${sinceLabel(nextUp.daysSince)}` : 'Has not done a GAR') : (rotation.length ? 'No one is available' : 'Add a crew to begin')}</p>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                            <p className="text-sm font-medium text-slate-500">GARs Logged</p>
                            <h3 className="text-3xl font-bold text-slate-800 mt-1">{history.length}</h3>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-6 items-start">
                        <div className="xl:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-4 border-b border-slate-200 bg-slate-50">
                                <h3 className="font-bold text-slate-700 uppercase tracking-wider text-sm">Up-next order</h3>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse whitespace-nowrap">
