            const toggleTheme = () => {
                const next = !isDark;
                document.documentElement.classList.toggle('dark', next);
                const tc = document.querySelector('meta[name="theme-color"]');
                if (tc) tc.setAttribute('content', next ? '#0a0a0a' : '#0f172a');
                setIsDark(next);
                try { localStorage.setItem('flyfair_theme', next ? 'dark' : 'light'); } catch (e) {}
            };
            const handleUpdateCrew = (id, patch) => setCrews(prev => prev.map(c => c.id === id ? { ...c, ...patch } : c));
            const handleLogGar = (date, crewId, note) => {
                setGar(prev => ({ ...prev, [date]: { crewId, note } }));
            };
            const handleRemoveGar = (date) => setGar(prev => { const next = { ...prev }; delete next[date]; return next; });
            const closeModal = () => setModalConfig({ isOpen: false, type: null, data: null });

            const tabs = [
                { id: 'dashboard', label: 'Fairness', icon: 'fa-scale-balanced' },
                { id: 'calendar', label: 'Flying Log', icon: 'fa-calendar-days' },
                { id: 'gar', label: 'Ground Alert (GAR)', icon: 'fa-bell' },
                { id: 'trends', label: 'Trends', icon: 'fa-chart-line' },
                { id: 'buckets', label: 'Flying Buckets', icon: 'fa-clock' },
                { id: 'crews', label: 'Crews', icon: 'fa-users' },
                { id: 'report', label: 'Report', icon: 'fa-file-lines' }
            ];

            return (
                <div className={`h-screen w-full flex overflow-hidden ${isMobile ? 'flex-col' : 'flex-row'}`} style={{ height: '100dvh' }}>

                    {isMobile ? (
                        <>
                            <header className="no-print flex items-center justify-between gap-2 bg-slate-900 text-white px-4 pb-2 shadow-lg z-20 flex-shrink-0" style={{ paddingTop: 'calc(env(safe-area-inset-top) + 8px)' }}>
                                <div className="flex items-center gap-2 min-w-0">
                                    <i className="fa-solid fa-shield-halved text-blue-500 text-xl"></i>
                                    <span className="font-black tracking-tight">STRATO<span className="text-blue-500">SCHED</span></span>
                                    <span className="text-xs text-slate-400 truncate">· {(tabs.find(t => t.id === activeTab) || {}).label}</span>
                                </div>
                                <button onClick={() => setMenuOpen(true)} aria-label="Open menu" className="w-11 h-11 flex items-center justify-center rounded-lg hover:bg-slate-800"><i className="fa-solid fa-bars text-lg"></i></button>
                            </header>
                            {menuOpen && (

                            {canEdit && (
                                <div className="flex gap-2 pb-2">

                                </div>
                            )}
                            <div className="flex justify-center pb-2"><LayoutToggle layout={layout} setLayout={setLayout} dark /></div>
                            <button onClick={toggleTheme} className="w-full text-xs font-semibold text-slate-400 hover:text-white transition-colors py-2" aria-pressed={isDark}>
                                <i className={`fa-solid ${isDark ? 'fa-sun' : 'fa-moon'} mr-1`}></i> {isDark ? 'Light Theme' : 'Dark Theme'}
                            </button>
                            {cloud ? (
                                <>
                                    <div className="text-xs text-slate-400 text-center py-1 truncate">Signed in as <strong className="text-slate-200">{emailToUsername(user && user.email)}</strong></div>
                                    {onSetMode && (
                                        <div className="text-center pb-1">
                                            <span className={`inline-block text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded ${canEdit ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-700 text-slate-300'}`}>{canEdit ? 'Editing' : 'View only'}</span>
                                            <button onClick={() => onSetMode(canEdit ? 'viewer' : 'editor')} className="block w-full text-xs font-semibold text-slate-400 hover:text-white transition-colors py-1">Switch to {canEdit ? 'viewer' : 'editor'}</button>
                                        </div>
                                    )}
                                    <button onClick={onSignOut} className="w-full text-xs font-semibold text-slate-400 hover:text-white transition-colors py-2"><i className="fa-solid fa-right-from-bracket mr-1"></i> Sign out</button>
                                </>
                            ) : (
                                <button onClick={requestReset} className="w-full text-xs font-semibold text-slate-500 hover:text-slate-300 transition-colors py-2"><i className="fa-solid fa-rotate-right mr-1"></i> Reset Demo Data</button>
                            )}
                        </div>
                                    </nav>
                                </div>
                            )}
                        </>
                    ) : (
                        <nav className="no-print w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col shadow-2xl z-20">
                        <div className="p-6 flex items-center gap-3 text-white border-b border-slate-800 bg-slate-950/50">
                            <i className="fa-solid fa-shield-halved text-blue-500 text-2xl"></i>
                            <div>
                                <h1 className="font-black text-xl tracking-tight">STRATO<span className="text-blue-500">SCHED</span></h1>
                                <p className="text-[10px] text-slate-400 uppercase tracking-widest mt-0.5 font-bold">Flying Tracker</p>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto py-4">
                            <ul className="space-y-1 px-3">
                                {tabs.map(tab => {
                                    const isActive = activeTab === tab.id;
                                    return (
                                        <li key={tab.id}>
                                            <button onClick={() => { setActiveTab(tab.id); setMenuOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg font-semibold transition-all duration-200 ${isActive ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white text-slate-400'}`}>
                                                <i className={`fa-solid ${tab.icon} w-5 text-center ${isActive ? 'text-blue-200' : ''}`}></i>
                                                {tab.label}
                                            </button>
                                        </li>
                                    );
                                })}
                            </ul>
                        </div>
                        <div className="p-4 border-t border-slate-800 bg-slate-950/30">
                            {saveStatus && <div className="text-xs text-emerald-400 font-bold mb-3 flex items-center gap-2 justify-center"><i className="fa-solid fa-floppy-disk"></i> {saveStatus}</div>}
                            {canEdit && (
                                <div className="flex gap-2 pb-2">
                                    <button onClick={undo} disabled={!history.undo.length} title={history.undo.length ? `Undo: ${history.undo[history.undo.length - 1].label}` : 'Nothing to undo'}
                                        className="flex-1 text-xs font-bold py-1.5 rounded-lg border border-slate-700 text-slate-300 hover:bg-slate-800 disabled:opacity-40 disabled:hover:bg-transparent"><i className="fa-solid fa-rotate-left mr-1"></i>Undo</button>
                                    <button onClick={redo} disabled={!history.redo.length} title={history.redo.length ? `Redo: ${history.redo[history.redo.length - 1].label}` : 'Nothing to redo'}
                                        className="flex-1 text-xs font-bold py-1.5 rounded-lg border border-slate-700 text-slate-300 hover:bg-slate-800 disabled:opacity-40 disabled:hover:bg-transparent"><i className="fa-solid fa-rotate-right mr-1"></i>Redo</button>
                                </div>

                            <div className="flex justify-center pb-2"><LayoutToggle layout={layout} setLayout={setLayout} dark /></div>
                            <button onClick={toggleTheme} className="w-full text-xs font-semibold text-slate-400 hover:text-white transition-colors py-2" aria-pressed={isDark}>
                                <i className={`fa-solid ${isDark ? 'fa-sun' : 'fa-moon'} mr-1`}></i> {isDark ? 'Light Theme' : 'Dark Theme'}
                            </button>
                            {cloud ? (
                                <>
                                    <div className="text-xs text-slate-400 text-center py-1 truncate">Signed in as <strong className="text-slate-200">{emailToUsername(user && user.email)}</strong></div>
                                    {onSetMode && (
                                        <div className="text-center pb-1">
                                            <span className={`inline-block text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded ${canEdit ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-700 text-slate-300'}`}>{canEdit ? 'Editing' : 'View only'}</span>
                                            <button onClick={() => onSetMode(canEdit ? 'viewer' : 'editor')} className="block w-full text-xs font-semibold text-slate-400 hover:text-white transition-colors py-1">Switch to {canEdit ? 'viewer' : 'editor'}</button>
                                        </div>
                                    )}
                                    <button onClick={onSignOut} className="w-full text-xs font-semibold text-slate-400 hover:text-white transition-colors py-2"><i className="fa-solid fa-right-from-bracket mr-1"></i> Sign out</button>
                                </>
                            ) : (
                                <button onClick={requestReset} className="w-full text-xs font-semibold text-slate-500 hover:text-slate-300 transition-colors py-2"><i className="fa-solid fa-rotate-right mr-1"></i> Reset Demo Data</button>
                            )}
                        </div>
                        </nav>
                    )}

                    {/* Main Content */}
                    <main className={`flex-1 overflow-y-auto relative ${isMobile ? 'p-3' : 'p-8'}`} style={isMobile ? { paddingBottom: 'calc(env(safe-area-inset-bottom) + 16px)' } : undefined}>
                        <div className="max-w-7xl mx-auto h-full">
                            {cloudUnavailable && <div className="no-print mb-4 text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-3"><i className="fa-solid fa-triangle-exclamation mr-2"></i>Cloud sync could not load, so this page is working offline with data saved on this device only. Reload to try again.</div>}
                            {activeTab === 'dashboard' && <DashboardView crews={crews} buckets={buckets} log={log} period={period} setPeriod={setPeriod} onUpdateCrew={handleUpdateCrew} canEdit={canEdit} compact={isMobile} />}
                            {activeTab === 'calendar' && <CalendarView crews={crews} buckets={buckets} log={log} period={period} setPeriod={setPeriod} selectedDate={selectedDate} setSelectedDate={setSelectedDate} onAdd={handleAddToBucket} onRemove={handleRemoveFromBucket} notes={notes} onSetNote={handleSetNote} garFlags={garFlags} onSetGar={handleSetGarFlag} canEdit={canEdit} compact={isMobile} />}

                            {activeTab === 'trends' && <TrendsView crews={crews} buckets={buckets} log={log} gar={gar} notes={notes} garFlags={garFlags} compact={isMobile} />}
                            {activeTab === 'report' && <ReportView crews={crews} buckets={buckets} log={log} notes={notes} gar={gar} garFlags={garFlags} period={period} />}
                            {activeTab === 'gar' && <GarView crews={crews} gar={gar} notes={notes} garFlags={garFlags} buckets={buckets} onLog={handleLogGar} onRemove={handleRemoveGar} canEdit={canEdit} />}

                            {activeTab === 'buckets' && (
                                <SimpleListView canEdit={canEdit}

                                    onAdd={() => setModalConfig({ isOpen: true, type: 'BUCKET', data: null })}
                                    onEdit={(b) => setModalConfig({ isOpen: true, type: 'BUCKET', data: b })}
                                    onDelete={handleDeleteBucket}
                                    columns={['Bucket', 'Hours (Z)', 'Crews']}
                                    renderRow={(b) => (
                                        <>
                                            <td className="p-4 font-black text-slate-800 text-base"><BucketDot color={b.color} className="mr-2" />{b.name}</td>
                                            <td className="p-4 text-sm font-mono font-semibold text-slate-600">{formatMilTime(b.start)} - {formatMilTime(b.end)}</td>
                                            <td className="p-4">
                                                <div className="flex gap-1 flex-wrap">
                                                    {designatedIds(b, crews).length === 0 ? <span className="text-slate-400 text-xs italic">All crews</span> :
                                                     designatedIds(b, crews).map(id => <span key={id} className="bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-200 uppercase">{crews.find(c => c.id === id).crewName}</span>)}
                                                </div>
                                            </td>
                                        </>
                                    )}
                                />
                            )}

                            {activeTab === 'crews' && (
                                <SimpleListView canEdit={canEdit}
                                    title="Crews" icon="fa-solid fa-users" items={crews}
                                    onAdd={() => setModalConfig({ isOpen: true, type: 'CREW', data: null })}

                                    renderRow={(crew) => (
                                        <>

                                                            <span className="text-slate-500 ml-1">({m.role})</span>

                    </main>

                    {cloud && syncState !== 'ready' && (

                                        <h3 className="font-bold text-xl text-slate-800 mb-2">Import data from this browser?</h3>
                                        <p className="text-sm text-slate-600 mb-1">The shared database is empty, but this browser has saved data:</p>
                                        <p className="text-sm font-bold text-slate-800 mb-4">{pendingImport.current.crews.length} crews · {pendingImport.current.buckets.length} buckets · {Object.keys(pendingImport.current.log).length} logged days · {Object.keys(pendingImport.current.gar).length} GARs</p>
                                        <p className="text-xs text-slate-500 mb-5">If this is just the demo data, choose Start empty.</p>
                                        <div className="flex gap-3 justify-center">
                                            <button onClick={() => setSyncState('ready')} className="px-4 py-2 rounded-lg font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">Start empty</button>
                                            <button onClick={importLocalData} className="px-4 py-2 rounded-lg font-semibold text-white bg-blue-600 hover:bg-blue-700">Import</button>
                                        </div>
                                    </>
                                ) : syncState === 'error' ? (
                                    <>
                                        <div className="w-14 h-14 mx-auto rounded-full flex items-center justify-center mb-3 bg-red-100 text-red-600"><i className="fa-solid fa-triangle-exclamation text-2xl"></i></div>
                                        <h3 className="font-bold text-xl text-slate-800 mb-2">Can't load shared data</h3>
                                        <p className="text-sm text-slate-600 mb-4">{syncError}</p>
                                        <button onClick={onSignOut} className="px-4 py-2 rounded-lg font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">Sign out</button>
                                    </>
                                ) : (
                                    <>
                                        <i className="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500 mb-3"></i>
                                        <h3 className="font-bold text-lg text-slate-800">Loading shared data…</h3>
                                        {syncError && <p className="text-xs text-slate-500 mt-2">{syncError}</p>}
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    {toast && canEdit && (
                        <div className="no-print fixed left-1/2 -translate-x-1/2 z-[65] bg-slate-900 text-white text-sm rounded-xl shadow-2xl px-4 py-2.5 flex items-center gap-3 max-w-[92vw]" style={{ bottom: 'calc(env(safe-area-inset-bottom) + 16px)' }} role="status">
                            <span className="truncate">{toast.text}</span>
                            {history.undo.length > 0 && !toast.text.startsWith('Undid') && !toast.text.startsWith('Redid') && <button onClick={undo} className="font-bold text-yellow-300 hover:text-yellow-200 flex-shrink-0">Undo</button>}
                            <button onClick={() => setToast(null)} aria-label="Dismiss" className="text-slate-400 hover:text-white flex-shrink-0"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                    )}

                    {/* Modals */}
                    <Modal
                        isOpen={modalConfig.isOpen}
                        title={modalConfig.type === 'CREW' ? (modalConfig.data ? "Edit Crew" : "Create New Crew") : (modalConfig.data ? "Edit Bucket" : "Create Flying Bucket")}
                        onClose={closeModal}
                    >
                        {modalConfig.type === 'CREW' && (
                            <CrewForm
                                initialData={modalConfig.data}
                                onCancel={closeModal}
                                onSave={(newCrew) => {
                                    setCrews(prev => modalConfig.data ? prev.map(c => c.id === newCrew.id ? newCrew : c) : [...prev, newCrew]);
                                    closeModal();
                                }}
                            />
                        )}
                        {modalConfig.type === 'BUCKET' && (
                            <BucketForm
                                initialData={modalConfig.data}
                                crews={crews}
                                onCancel={closeModal}
                                onSave={(newBucket) => {
                                    setBuckets(prev => modalConfig.data ? prev.map(b => b.id === newBucket.id ? newBucket : b) : [...prev, newBucket]);
                                    closeModal();
                                }}
                            />
                        )}
                    </Modal>

                    <ConfirmModal
                        isOpen={confirmConfig.isOpen}
                        title={confirmConfig.title}
                        message={confirmConfig.message}
                        isDanger={confirmConfig.isDanger}
                        onConfirm={confirmConfig.onConfirm}
                        onClose={() => setConfirmConfig({ ...confirmConfig, isOpen: false })}
                    />

                </div>
            );
        }

        // Auto follows the screen size; Mobile / Desktop force a layout (Desktop on a phone shows the full-width page).
        const LayoutToggle = ({ layout, setLayout, dark = false }) => (
            <div className="inline-flex rounded-lg p-0.5 gap-0.5" style={{ background: dark ? 'rgba(148,163,184,.15)' : '#e2e8f0' }} role="group" aria-label="View layout">
                {[['auto', 'Auto', 'fa-wand-magic-sparkles'], ['mobile', 'Mobile', 'fa-mobile-screen'], ['desktop', 'Desktop', 'fa-desktop']].map(([k, label, icon]) => (
                    <button key={k} type="button" onClick={() => setLayout(k)} aria-pressed={layout === k}
                        className={`px-2.5 py-1 rounded-md text-xs font-bold transition-colors ${layout === k ? 'bg-blue-600 text-white' : dark ? 'text-slate-400 hover:text-white' : 'text-slate-600 hover:text-slate-900'}`}>
                        <i className={`fa-solid ${icon} mr-1`}></i>{label}
                    </button>
                ))}
            </div>
        );

        // --- LOGIN + ROOT ---
        const LoginScreen = ({ auth, layout, setLayout }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            const submit = (e) => {
                e.preventDefault();
                if (!username.trim() || !password) return;
                setBusy(true); setError('');
                auth.signInWithEmailAndPassword(usernameToEmail(username), password)
                    .catch(err => { setError(authMessage(err)); setBusy(false); });
            };
            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
                    <form onSubmit={submit} className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 space-y-4">
                        <div className="text-center">
                            <i className="fa-solid fa-shield-halved text-blue-500 text-3xl"></i>
                            <h1 className="font-black text-2xl tracking-tight text-slate-800 mt-2">STRATO<span className="text-blue-500">SCHED</span></h1>
                            <p className="text-xs text-slate-500 uppercase tracking-widest font-bold">Flying Tracker</p>
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">Username</label>
                            <input autoFocus autoCapitalize="none" autoCorrect="off" autoComplete="username" type="text" value={username} onChange={e => setUsername(e.target.value)}
                                className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">Password</label>
                            <input autoComplete="current-password" type="password" value={password} onChange={e => setPassword(e.target.value)}
                                className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                        </div>
                        {error && <p role="alert" className="text-sm text-red-700 font-semibold"><i className="fa-solid fa-triangle-exclamation mr-1"></i>{error}</p>}
                        <button type="submit" disabled={busy || !username.trim() || !password} className="w-full py-2 rounded-lg font-bold text-white bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300">{busy ? 'Signing in…' : 'Sign in'}</button>
                        <p className="text-xs text-slate-500 text-center">Forgot your password? Ask your administrator to reset it.</p>
                        <div className="text-center"><LayoutToggle layout={layout} setLayout={setLayout} /></div>
                    </form>
                </div>
            );
        };


        const AccessChooser = ({ user, unlocked, onViewer, onUnlock, onSignOut, layout, setLayout }) => {
            const [asking, setAsking] = useState(false);
            const [code, setCode] = useState('');
            const [error, setError] = useState('');
            const [busy, setBusy] = useState(false);
            const [fails, setFails] = useState(0);
            const [lockedUntil, setLockedUntil] = useState(0);
            const submit = async (e) => {
                e.preventDefault();
                if (Date.now() < lockedUntil) { setError('Too many attempts. Wait a few seconds and try again.'); return; }
                setBusy(true); setError('');
                try {
                    const ok = await onUnlock(code);
                    if (!ok) {
                        const n = fails + 1;
                        setFails(n);
                        if (n >= 5) { setLockedUntil(Date.now() + 30000); setFails(0); setError('Incorrect passcode. Locked for 30 seconds.'); } else setError('Incorrect passcode.');
                        setCode('');
                    }
                } catch (err) {
                    setError(err && err.message === 'crypto-unavailable' ? 'The passcode check needs a secure (https) connection.' : 'Could not check the passcode.');
                }
                setBusy(false);
            };
            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 space-y-4">
                        <div className="text-center">
                            <i className="fa-solid fa-shield-halved text-blue-500 text-3xl"></i>
                            <h1 className="font-black text-2xl tracking-tight text-slate-800 mt-2">How would you like to continue?</h1>
                            <p className="text-xs text-slate-500 mt-1">Signed in as <strong>{emailToUsername(user.email)}</strong></p>
                        </div>
                        <button onClick={onViewer} className="w-full text-center border-2 border-slate-200 hover:border-blue-500 rounded-xl p-4 transition-colors">
                            <div className="font-bold text-slate-800"><i className="fa-regular fa-eye mr-2 text-blue-500"></i>Viewer</div>
                        </button>
                        <div className={`border-2 rounded-xl p-4 transition-colors ${asking ? 'border-blue-500' : 'border-slate-200 hover:border-blue-500'}`}>
                            <button type="button" onClick={() => unlocked ? onUnlock(null) : setAsking(true)} className="w-full text-center">
                                <div className="font-bold text-slate-800"><i className={`fa-solid ${unlocked ? 'fa-pen-to-square' : 'fa-lock'} mr-2 text-blue-500`}></i>Editor</div>
                                <div className="text-xs font-bold mt-1 text-slate-500">Caddy Staff Only</div>
                            </button>
                            {asking && !unlocked && (
                                <form onSubmit={submit} className="mt-3 space-y-2">
                                    <input autoFocus type="password" autoComplete="off" value={code} onChange={e => setCode(e.target.value)} placeholder="Staff passcode"
                                        className="w-full border border-slate-300 rounded-lg p-2 font-mono focus:ring-2 focus:ring-blue-500 outline-none" />
                                    {error && <p role="alert" className="text-sm text-red-700 font-semibold">{error}</p>}
                                    <button type="submit" disabled={busy || !code.trim()} className="w-full py-2 rounded-lg font-bold text-white bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300">{busy ? 'Checking…' : 'Unlock editor'}</button>
                                </form>
                            )}
                        </div>
                        <div className="text-center"><LayoutToggle layout={layout} setLayout={setLayout} /></div>
                        <button onClick={onSignOut} className="w-full text-sm font-semibold text-slate-500 hover:text-slate-700 py-1">Sign out</button>
                    </div>
                </div>
            );
        };

        function Root() {
            const [layout, setLayoutState] = useState(() => { try { return localStorage.getItem('flyfair_layout') || 'auto'; } catch (e) { return 'auto'; } });
            const [viewportWidth, setViewportWidth] = useState(window.innerWidth);
            const setLayout = (l) => { setLayoutState(l); try { localStorage.setItem('flyfair_layout', l); } catch (e) {} };
            useEffect(() => {
                const onResize = () => setViewportWidth(window.innerWidth);
                window.addEventListener('resize', onResize);
                window.addEventListener('orientationchange', onResize);
                return () => { window.removeEventListener('resize', onResize); window.removeEventListener('orientationchange', onResize); };
            }, []);
            useEffect(() => {
                const meta = document.querySelector('meta[name="viewport"]');
                if (meta) meta.setAttribute('content', layout === 'desktop' ? 'width=1200' : 'width=device-width, initial-scale=1, viewport-fit=cover');
                document.documentElement.classList.toggle('force-mobile', layout === 'mobile');
            }, [layout]);
            const isMobile = layout === 'mobile' || (layout === 'auto' && viewportWidth < 768);
            const view = { layout, setLayout, isMobile };
            const fb = window.firebase;
            const available = CLOUD_ENABLED && !!(fb && fb.auth && fb.firestore);
            const ctx = useMemo(() => {
                if (!available) return null;
                const app = fb.apps.length ? fb.app() : fb.initializeApp(FIREBASE_CONFIG);
                const db = app.firestore();
                try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}
                return { auth: app.auth(), db };
            }, []);
            const [user, setUser] = useState(available ? undefined : null);
            useEffect(() => ctx ? ctx.auth.onAuthStateChanged(u => setUser(u)) : undefined, [ctx]);

            // Viewer/Editor: Editor needs the staff passcode; the unlock and the choice last for this browser session.
            const [mode, setModeState] = useState(null);
            const [unlocked, setUnlocked] = useState(false);
            const uid = user ? user.uid : null;
            useEffect(() => {
                if (!ROLES_ENABLED || !uid) { setModeState(null); setUnlocked(false); return; }
                let ok = false, saved = null;
                try { ok = sessionStorage.getItem(`flyfair_unlock_${uid}`) === '1'; saved = sessionStorage.getItem(`flyfair_mode_${uid}`); } catch (e) {}
                setUnlocked(ok);
                setModeState(saved === 'viewer' || (saved === 'editor' && ok) ? saved : null);
            }, [uid]);
            const chooseMode = (m) => {
                try { sessionStorage.setItem(`flyfair_mode_${uid}`, m); } catch (e) {}
                setModeState(m);
            };
            // Switching to Editor without an unlock goes back to the chooser, which asks for the passcode.
            const setMode = (m) => { if (m === 'editor' && !unlocked) { setModeState(null); return; } chooseMode(m); };
            const unlockEditor = async (code) => {
                if (code !== null) {
                    if (!(await verifyPasscode(code))) return false;
                    try { sessionStorage.setItem(`flyfair_unlock_${uid}`, '1'); } catch (e) {}
                    setUnlocked(true);
                }
                chooseMode('editor');
                return true;
            };
            const signOut = () => { try { if (uid) { sessionStorage.removeItem(`flyfair_mode_${uid}`); sessionStorage.removeItem(`flyfair_unlock_${uid}`); } } catch (e) {} ctx.auth.signOut(); };

            if (!available) return <FlightSchedulerApp cloudUnavailable={CLOUD_ENABLED} {...view} />;
            if (user === undefined) return <div className="min-h-screen flex items-center justify-center bg-slate-900 text-slate-300"><i className="fa-solid fa-circle-notch fa-spin text-3xl"></i></div>;
            if (!user) return <LoginScreen auth={ctx.auth} layout={layout} setLayout={setLayout} />;
            if (!ROLES_ENABLED) return <FlightSchedulerApp key={user.uid} cloud db={ctx.db} user={user} onSignOut={signOut} {...view} />;
            if (!mode) return <AccessChooser user={user} unlocked={unlocked} onViewer={() => chooseMode('viewer')} onUnlock={unlockEditor} onSignOut={signOut} layout={layout} setLayout={setLayout} />;
            return <FlightSchedulerApp key={`${user.uid}-${mode}`} cloud db={ctx.db} user={user} onSignOut={signOut} mode={mode} onSetMode={setMode} {...view} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>
</html>
