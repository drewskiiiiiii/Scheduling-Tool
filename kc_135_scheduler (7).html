<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KC-135 Operations Scheduler</title>
    
    <!-- iOS / PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StratoSched">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Fonts, Icons, and Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #f1f5f9;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Stripes for proposed hours visualization */
        .progress-stripes {
            background-image: linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONSTANTS & MOCK DATA ---
        const INITIAL_SETTINGS = {
            thresholds: { days7: 56, days30: 125, days90: 330 }
        };

        const CREW_ROLES = ['Aircraft Commander (AC)', 'Pilot (P)', 'Boom Operator (BO)', 'Instructor (IP)', 'Instructor Boom (IB)'];
        const QUALIFICATIONS = ['Instructor', 'Evaluator', 'Airdrop', 'Receiver', 'Aeromedical (AE)', 'Special Ops'];
        const MISSION_TYPES = ['Aerial Refueling', 'Cargo Transport', 'Aeromedical Evacuation', 'Local Training', 'Coronet'];

        const INITIAL_CREWS = [
            {
                id: 'c-001',
                crewName: 'Crew Alpha (E-11)',
                members: [
                    { id: 'm1', name: 'Capt Smith, J.', role: 'Aircraft Commander (AC)', posNum: '1' },
                    { id: 'm2', name: '1st Lt Johnson, M.', role: 'Pilot (P)', posNum: '2' },
                    { id: 'm3', name: 'TSgt Davis, R.', role: 'Boom Operator (BO)', posNum: '3' }
                ],
                qualifications: ['Instructor', 'Receiver'],
                availability: [ { start: '08:00', end: '20:00' } ],
                history: { lastFlight: '2023-10-24 14:00', hrs7: 12.5, hrs30: 45.0, hrs90: 140.2 }
            },
            {
                id: 'c-002',
                crewName: 'Crew Bravo (E-12)',
                members: [
                    { id: 'm4', name: 'Maj Wilson, K.', role: 'Aircraft Commander (AC)', posNum: '1' },
                    { id: 'm5', name: 'Capt Lee, A.', role: 'Pilot (P)', posNum: '2' },
                    { id: 'm6', name: 'SSgt Miller, T.', role: 'Boom Operator (BO)', posNum: '3' }
                ],
                qualifications: ['Evaluator', 'Airdrop'],
                availability: [ { start: '00:00', end: '23:59' } ],
                history: { lastFlight: '2023-10-20 16:00', hrs7: 45.0, hrs30: 110.0, hrs90: 290.0 } // Approaching limits
            },
            {
                id: 'c-003',
                crewName: 'Crew Charlie (E-14)',
                members: [
                    { id: 'm7', name: 'Capt Taylor, R.', role: 'Aircraft Commander (AC)', posNum: '1' },
                    { id: 'm8', name: '2nd Lt Brown, S.', role: 'Pilot (P)', posNum: '2' },
                    { id: 'm9', name: 'A1C Clark, E.', role: 'Boom Operator (BO)', posNum: '3' }
                ],
                qualifications: [],
                availability: [ { start: '10:00', end: '22:00' } ],
                history: { lastFlight: '2023-10-15 11:00', hrs7: 4.0, hrs30: 28.0, hrs90: 130.5 }
            }
        ];

        const INITIAL_FLIGHTS = [
            {
                id: 'f-101',
                missionNum: 'AR-8801',
                callsign: 'REACH 11',
                date: '2023-10-26',
                alertTime: '06:00',
                startTime: '09:00',
                endTime: '14:00',
                duration: 5.0,
                missionType: 'Aerial Refueling',
                reqQualifications: ['Receiver']
            },
            {
                id: 'f-102',
                missionNum: 'TR-8802',
                callsign: 'SPAR 22',
                date: '2023-10-26',
                alertTime: '11:00',
                startTime: '13:00',
                endTime: '15:30',
                duration: 2.5,
                missionType: 'Local Training',
                reqQualifications: ['Instructor']
            }
        ];

        // --- UTILITIES & SCHEDULING ENGINE ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        
        const formatMilTime = (timeStr) => {
            if (!timeStr) return '0000';
            return timeStr.toString().replace(':', '').padStart(4, '0');
        };

        const timeToMins = (timeStr) => {
            if (!timeStr) return 0;
            const str = formatMilTime(timeStr);
            const h = parseInt(str.substring(0, 2), 10) || 0;
            const m = parseInt(str.substring(2, 4), 10) || 0;
            return h * 60 + m;
        };

        const checkOverlap = (start1, end1, start2, end2) => {
            return Math.max(start1, start2) < Math.min(end1, end2);
        };

        const evaluateCrewForFlight = (crew, flight, assignments, flights, settings) => {
            const reasons = [];
            const hardConstraintsFailed = [];
            let score = 100;
            
            const fStart = timeToMins(flight.startTime);
            const fEnd = timeToMins(flight.endTime);

            // Hard Constraint 1: Qualifications
            const missingQuals = flight.reqQualifications.filter(q => !crew.qualifications.includes(q));
            if (missingQuals.length > 0) {
                hardConstraintsFailed.push(`Missing Qualification: ${missingQuals.join(', ')}`);
            }

            // Hard Constraint 2: Availability Window (Duty Day)
            let isAvailableInWindow = false;
            for (const window of crew.availability) {
                const wStart = timeToMins(window.start);
                const wEnd = timeToMins(window.end);
                if (wStart <= fStart && wEnd >= fEnd) {
                    isAvailableInWindow = true;
                    break;
                }
            }
            if (!isAvailableInWindow) {
                hardConstraintsFailed.push("Outside available duty hours (FDP)");
            }

            // Hard Constraint 3: Overlapping Assignments
            const overlappingAssignedFlights = Object.entries(assignments)
                .filter(([fId, assignedCrewId]) => assignedCrewId === crew.id && fId !== flight.id)
                .map(([fId]) => flights.find(f => f.id === fId))
                .filter(f => f && f.date === flight.date && checkOverlap(fStart, fEnd, timeToMins(f.startTime), timeToMins(f.endTime)));

            if (overlappingAssignedFlights.length > 0) {
                hardConstraintsFailed.push(`Conflicting mission: ${overlappingAssignedFlights.map(f=>f.missionNum).join(', ')}`);
            }

            // Hard Constraint 4: Limits (AFMAN 11-202)
            if (crew.history.hrs7 + flight.duration > settings.thresholds.days7) {
                hardConstraintsFailed.push(`Exceeds 7-day limit (${settings.thresholds.days7}h)`);
            }
            if (crew.history.hrs30 + flight.duration > settings.thresholds.days30) {
                hardConstraintsFailed.push(`Exceeds 30-day limit (${settings.thresholds.days30}h)`);
            }

            if (hardConstraintsFailed.length > 0) {
                return { crew, isFeasible: false, score: 0, reasons: hardConstraintsFailed };
            }

            // Soft Constraints
            const threshold30 = settings.thresholds.days30;
            const current30 = crew.history.hrs30;
            
            if (current30 < (threshold30 * 0.3)) {
                score += 20;
                reasons.push("Prioritized: Crew needs hours for currency.");
            }
            if (current30 > (threshold30 * 0.8)) {
                score -= 30;
                reasons.push("Warning: High utilization (approaching 30-day limits).");
            } else if (current30 > (threshold30 * 0.6)) {
                score -= 10;
                reasons.push("Notice: Moderate utilization.");
            }

            if (crew.qualifications.length > flight.reqQualifications.length) {
                score -= 5;
                reasons.push("Notice: Crew is overqualified.");
            }

            if (reasons.length === 0) reasons.push("Optimal standard assignment.");

            return { crew, isFeasible: true, score, reasons };
        };


        // --- SHARED UI COMPONENTS ---
        
        const StatusBadge = ({ value, thresholds, invert = false }) => {
            let color = "bg-green-100 text-green-800 border-green-200";
            let status = "GREEN";
            const ratio = value / thresholds;
            
            if (ratio >= 0.85) {
                color = invert ? "bg-green-100 text-green-800 border-green-200" : "bg-red-100 text-red-800 border-red-200";
                status = invert ? "GOOD" : "WARNING";
            } else if (ratio >= 0.60) {
                color = "bg-yellow-100 text-yellow-800 border-yellow-200";
                status = "MONITOR";
            } else {
                color = invert ? "bg-red-100 text-red-800 border-red-200" : "bg-green-100 text-green-800 border-green-200";
                status = invert ? "WARNING" : "GOOD";
            }

            return (
                <span className={`px-2 py-1 rounded-md text-xs font-semibold border ${color} flex items-center gap-1 w-fit`}>
                    {status === "WARNING" && <i className="fa-solid fa-triangle-exclamation"></i>}
                    {value.toFixed(1)} / {thresholds}
                </span>
            );
        };

        // Standard Modal Wrapper
        const Modal = ({ isOpen, title, onClose, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-fade-in-up">
                        <div className="flex justify-between items-center p-4 border-b border-slate-200 bg-slate-50">
                            <h3 className="font-bold text-lg text-slate-800">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-red-500 transition-colors">
                                <i className="fa-solid fa-xmark text-xl"></i>
                            </button>
                        </div>
                        <div className="overflow-y-auto p-4 flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onClose, isDanger=false }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 text-center animate-fade-in-up">
                        <div className={`w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 ${isDanger ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}>
                            <i className={`fa-solid ${isDanger ? 'fa-triangle-exclamation' : 'fa-circle-question'} text-3xl`}></i>
                        </div>
                        <h3 className="font-bold text-xl text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-600 mb-6 text-sm">{message}</p>
                        <div className="flex gap-3 justify-center">
                            <button onClick={onClose} className="px-4 py-2 rounded-lg font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">Cancel</button>
                            <button onClick={() => { onConfirm(); onClose(); }} className={`px-4 py-2 rounded-lg font-semibold text-white transition-colors ${isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                Confirm
                            </button>
                        </div>
                    </div>
                </div>
            );
        };


        // --- DATA FORMS ---
        
        const CrewForm = ({ initialData, onSave, onCancel }) => {
            const [crewName, setCrewName] = useState(initialData?.crewName || '');
            const [members, setMembers] = useState(initialData?.members || [{ id: generateId(), name: '', role: 'Aircraft Commander (AC)', posNum: '1' }]);
            const [qualifications, setQualifications] = useState(initialData?.qualifications || []);
            const [availability, setAvailability] = useState(initialData?.availability || [{ start: '08:00', end: '20:00' }]);

            const toggleQual = (q) => {
                setQualifications(prev => prev.includes(q) ? prev.filter(x => x !== q) : [...prev, q]);
            };

            const updateMember = (index, field, value) => {
                const newMembers = [...members];
                newMembers[index][field] = value;
                setMembers(newMembers);
            };

            const addMember = () => setMembers([...members, { id: generateId(), name: '', role: 'Pilot (P)', posNum: '' }]);
            const removeMember = (index) => setMembers(members.filter((_, i) => i !== index));

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({ 
                    id: initialData?.id || generateId(), 
                    crewName, members, qualifications, availability, 
                    history: initialData?.history || { lastFlight: 'N/A', hrs7: 0, hrs30: 0, hrs90: 0 } 
                });
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-6">
                    <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">Formation Name / Identifier</label>
                        <input required type="text" value={crewName} onChange={e => setCrewName(e.target.value)} placeholder="e.g. Crew Alpha (E-11)" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>

                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div className="flex justify-between items-center mb-3">
                            <h4 className="font-bold text-slate-800">Crew Members</h4>
                            <button type="button" onClick={addMember} className="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded-md font-semibold hover:bg-blue-200"><i className="fa-solid fa-plus mr-1"></i> Add Member</button>
                        </div>
                        <div className="space-y-3">
                            {members.map((m, idx) => (
                                <div key={m.id} className="flex gap-2 items-start bg-white p-2 rounded-lg border border-slate-200 shadow-sm relative group">
                                    <div className="flex-1">
                                        <input required type="text" placeholder="Name (e.g. Capt Smith, J.)" value={m.name} onChange={e => updateMember(idx, 'name', e.target.value)} className="w-full text-sm border-b border-slate-200 p-1 mb-1 outline-none focus:border-blue-500" />
                                        <div className="flex gap-2">
                                            <select value={m.role} onChange={e => updateMember(idx, 'role', e.target.value)} className="text-sm bg-slate-50 border border-slate-200 rounded p-1 flex-1">
                                                {CREW_ROLES.map(r => <option key={r} value={r}>{r}</option>)}
                                            </select>
                                            <input required type="text" placeholder="Pos #" value={m.posNum} onChange={e => updateMember(idx, 'posNum', e.target.value)} className="w-20 text-sm border border-slate-200 rounded p-1" title="Position Number" />
                                        </div>
                                    </div>
                                    <button type="button" onClick={() => removeMember(idx)} className="text-red-400 hover:text-red-600 p-1 absolute top-1 right-1 opacity-0 group-hover:opacity-100 transition-opacity"><i className="fa-solid fa-trash"></i></button>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div>
                        <label className="block text-sm font-bold text-slate-700 mb-2">Duty Windows (Z)</label>
                        <div className="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                            {availability.map((w, idx) => (
                                <div key={idx} className="flex gap-2 items-center">
                                    <input type="text" value={formatMilTime(w.start)} onChange={e => {
                                        const newAvail = [...availability];
                                        newAvail[idx].start = e.target.value.replace(/\D/g, '').slice(0, 4);
                                        setAvailability(newAvail);
                                    }} placeholder="0800" className="w-24 border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none font-mono text-center" />
                                    <span className="text-slate-500 font-bold text-sm">to</span>
                                    <input type="text" value={formatMilTime(w.end)} onChange={e => {
                                        const newAvail = [...availability];
                                        newAvail[idx].end = e.target.value.replace(/\D/g, '').slice(0, 4);
                                        setAvailability(newAvail);
                                    }} placeholder="2000" className="w-24 border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none font-mono text-center" />
                                    {availability.length > 1 && (
                                        <button type="button" onClick={() => setAvailability(availability.filter((_, i) => i !== idx))} className="text-red-400 hover:text-red-600 ml-2 p-1"><i className="fa-solid fa-trash"></i></button>
                                    )}
                                </div>
                            ))}
                            <button type="button" onClick={() => setAvailability([...availability, { start: '0800', end: '2000' }])} className="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-md font-semibold hover:bg-blue-200"><i className="fa-solid fa-plus mr-1"></i> Add Window</button>
                        </div>
                    </div>

                    <div>
                        <label className="block text-sm font-bold text-slate-700 mb-2">Formation Qualifications</label>
                        <div className="flex flex-wrap gap-2">
                            {QUALIFICATIONS.map(q => (
                                <button type="button" key={q} onClick={() => toggleQual(q)} className={`px-3 py-1 text-sm rounded-full border ${qualifications.includes(q) ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>
                                    {q}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex justify-end gap-3 pt-4 border-t border-slate-200">
                        <button type="button" onClick={onCancel} className="px-4 py-2 font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
                        <button type="submit" className="px-4 py-2 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm">Save Crew</button>
                    </div>
                </form>
            );
        };

        const FlightForm = ({ initialData, onSave, onCancel }) => {
            const [missionNum, setMissionNum] = useState(initialData?.missionNum || '');
            const [callsign, setCallsign] = useState(initialData?.callsign || '');
            const [date, setDate] = useState(initialData?.date || new Date().toISOString().split('T')[0]);
            const [alertTime, setAlertTime] = useState(initialData?.alertTime ? formatMilTime(initialData.alertTime) : '0600');
            const [startTime, setStartTime] = useState(initialData?.startTime ? formatMilTime(initialData.startTime) : '0800');
            const [endTime, setEndTime] = useState(initialData?.endTime ? formatMilTime(initialData.endTime) : '1200');
            const [missionType, setMissionType] = useState(initialData?.missionType || MISSION_TYPES[0]);
            const [reqQualifications, setReqQualifications] = useState(initialData?.reqQualifications || []);

            const toggleQual = (q) => {
                setReqQualifications(prev => prev.includes(q) ? prev.filter(x => x !== q) : [...prev, q]);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const sMins = timeToMins(startTime);
                let eMins = timeToMins(endTime);
                if (eMins < sMins) eMins += 24 * 60; // Next day
                const duration = (eMins - sMins) / 60;

                onSave({ 
                    id: initialData?.id || generateId(), 
                    missionNum, callsign, date, alertTime, startTime, endTime, duration,
                    missionType, reqQualifications
                });
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">Mission Number</label>
                            <input type="text" value={missionNum} onChange={e => setMissionNum(e.target.value)} placeholder="e.g. AR-8805" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none uppercase" />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">Callsign (Optional)</label>
                            <input type="text" value={callsign} onChange={e => setCallsign(e.target.value)} placeholder="e.g. REACH 11" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none uppercase" />
                        </div>
                        <div className="md:col-span-2">
                            <label className="block text-sm font-bold text-slate-700 mb-1">Date</label>
                            <input required type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" />
                        </div>
                        <div className="md:col-span-2">
                            <label className="block text-sm font-bold text-slate-700 mb-1">Alert Time (Z)</label>
                            <input type="text" value={alertTime} onChange={e => setAlertTime(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="0600" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none font-mono" />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">Takeoff Time (Z)</label>
                            <input type="text" value={startTime} onChange={e => setStartTime(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="0900" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none font-mono" />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">End Time (Z)</label>
                            <input type="text" value={endTime} onChange={e => setEndTime(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="1400" className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none font-mono" />
                        </div>
                        <div className="md:col-span-2">
                            <label className="block text-sm font-bold text-slate-700 mb-1">Mission Type</label>
                            <select value={missionType} onChange={e => setMissionType(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                {MISSION_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                        </div>
                    </div>

                    <div>
                        <label className="block text-sm font-bold text-slate-700 mb-2">Required Qualifications</label>
                        <div className="flex flex-wrap gap-2">
                            {QUALIFICATIONS.map(q => (
                                <button type="button" key={q} onClick={() => toggleQual(q)} className={`px-3 py-1 text-sm rounded-full border ${reqQualifications.includes(q) ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>
                                    {q}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex justify-end gap-3 pt-4 border-t border-slate-200">
                        <button type="button" onClick={onCancel} className="px-4 py-2 font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
                        <button type="submit" className="px-4 py-2 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm">Save Sortie</button>
                    </div>
                </form>
            );
        };


        // --- VIEWS ---

        const DashboardView = ({ crews, flights, assignments, settings }) => {
            const filledFlights = Object.keys(assignments).length;

                            <div className="w-full bg-slate-100 rounded-full h-4 mb-2 overflow-hidden">

                            <ul className="space-y-3">

        const SchedulerView = ({ crews, flights, assignments, onAssign, onUnassign, settings }) => {
            const [selectedFlight, setSelectedFlight] = useState(null);

            const recommendations = useMemo(() => {
                if (!selectedFlight) return [];
                const evals = crews.map(crew => evaluateCrewForFlight(crew, selectedFlight, assignments, flights, settings));
                return evals.sort((a, b) => {
                    if (a.isFeasible && !b.isFeasible) return -1;
                    if (!a.isFeasible && b.isFeasible) return 1;
                    return b.score - a.score;
                });
            }, [selectedFlight, crews, flights, assignments, settings]);

            return (
                <div className="space-y-6 h-full flex flex-col min-h-[70vh]">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-slate-800">Assign Crews (KC-135)</h2>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 min-h-0">
                        {/* Tasked Missions */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col lg:col-span-1 overflow-hidden h-[600px]">
                            <div className="p-4 border-b border-slate-200 bg-slate-50">

                            </div>
                            <div className="overflow-y-auto flex-1 p-3 space-y-3">
                                {flights.map(flight => {

                                    const isSelected = selectedFlight?.id === flight.id;
                                    
                                    return (

                                            key={flight.id} onClick={() => setSelectedFlight(flight)}

                                                <div>
                                                    <span className="font-black text-slate-800 text-lg tracking-tight">{flight.missionNum}</span>
                                                    {flight.callsign && <span className="ml-2 text-sm font-bold text-slate-500">{flight.callsign}</span>}
                                                </div>
                                                {assignedCrewId ? (
                                                    <span className="bg-emerald-100 text-emerald-800 text-xs px-2 py-1 rounded border border-emerald-200 font-bold"><i className="fa-solid fa-check mr-1"></i> Assigned</span>
                                                ) : (
                                                    <span className="bg-amber-100 text-amber-800 text-xs px-2 py-1 rounded border border-amber-200 font-bold">Unfilled</span>
                                                )}
                                            </div>
                                            <div className="text-sm text-slate-600 space-y-1.5">
                                                <div className="font-medium text-slate-800">{flight.missionType}</div>
                                                <div className="grid grid-cols-2 gap-y-1 mt-2 text-xs">
                                                    <div><i className="fa-regular fa-bell text-slate-400 mr-1"></i> {formatMilTime(flight.alertTime)}</div>
                                                    <div><i className="fa-regular fa-clock text-slate-400 mr-1"></i> {formatMilTime(flight.startTime)}-{formatMilTime(flight.endTime)}</div>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Engine */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col lg:col-span-2 overflow-hidden h-[600px]">
                            {selectedFlight ? (
                                <>
                                    <div className="p-4 border-b border-slate-200 bg-slate-50 flex flex-wrap gap-4 justify-between items-center">
                                        <div>
                                            <h3 className="font-black text-slate-800 text-xl mb-1">
                                                {selectedFlight.missionNum} 
                                                {selectedFlight.callsign && <span className="ml-2 text-slate-500 text-lg font-bold">({selectedFlight.callsign})</span>}
                                            </h3>
                                            <div className="flex gap-2 text-xs font-semibold">
                                                {selectedFlight.reqQualifications.length > 0 ? (
                                                    <span className="text-blue-700 bg-blue-100 px-2 py-0.5 rounded border border-blue-200">Requires: {selectedFlight.reqQualifications.join(', ')}</span>
                                                ) : <span className="text-slate-500 bg-slate-200 px-2 py-0.5 rounded">Standard Crew</span>}
                                            </div>
                                        </div>
                                        {assignments[selectedFlight.id] && (
                                            <button onClick={() => onUnassign(selectedFlight.id)} className="px-4 py-2 bg-white border border-red-200 text-red-600 hover:bg-red-50 rounded-lg text-sm font-bold shadow-sm transition-colors">
                                                <i className="fa-solid fa-xmark mr-1"></i> Clear Assignment
                                            </button>
                                        )}
                                    </div>
                                    
                                    <div className="overflow-y-auto flex-1 p-4 space-y-4 bg-slate-50/50 relative">
                                        {assignments[selectedFlight.id] && (
                                            <div className="bg-emerald-50 border-2 border-emerald-300 rounded-xl p-4 mb-4 shadow-sm flex items-center justify-between">
                                                <div>
                                                    <h4 className="text-emerald-800 font-bold mb-1 text-xs uppercase tracking-wide">Assigned Formation</h4>
                                                    <p className="text-emerald-950 text-lg font-black">{crews.find(c => c.id === assignments[selectedFlight.id])?.crewName || 'Unknown'}</p>
                                                </div>
                                                <i className="fa-solid fa-circle-check text-4xl text-emerald-200"></i>
                                            </div>
                                        )}

                                        <h4 className="font-bold text-slate-500 text-xs uppercase tracking-wider mb-2">Engine Recommendations</h4>
                                        
                                        {recommendations.map((rec, idx) => (
                                            <div key={rec.crew.id} className={`border-2 rounded-xl p-4 flex flex-col md:flex-row gap-4 justify-between transition-all ${
                                                !rec.isFeasible ? 'bg-white border-slate-100 opacity-60' : 
                                                idx === 0 ? 'bg-blue-50 border-blue-300 shadow-md relative overflow-hidden' : 'bg-white border-slate-200 shadow-sm'
                                            }`}>
                                                {rec.isFeasible && idx === 0 && <div className="absolute top-0 left-0 w-1.5 h-full bg-blue-500"></div>}
                                                <div className="flex-1 pl-2">
                                                    <div className="flex items-center gap-3 mb-2">
                                                        <span className={`text-lg font-black ${!rec.isFeasible ? 'text-slate-500' : 'text-slate-900'}`}>{rec.crew.crewName}</span>
                                                        {rec.isFeasible && idx === 0 && <span className="bg-blue-600 text-white text-[10px] uppercase font-bold px-2 py-0.5 rounded shadow-sm">Top Match</span>}
                                                        {!rec.isFeasible && <span className="bg-slate-200 text-slate-600 text-[10px] uppercase font-bold px-2 py-0.5 rounded">Unfeasible</span>}
                                                    </div>
                                                    
                                                    <div className="text-xs text-slate-600 mb-3 flex flex-wrap gap-2">
                                                        {rec.crew.qualifications.length > 0 && <span className="bg-white border border-slate-200 px-2 py-1 rounded"><strong>Quals:</strong> {rec.crew.qualifications.join(', ')}</span>}
                                                        <span className="bg-white border border-slate-200 px-2 py-1 rounded"><strong>30D Hrs:</strong> {rec.crew.history.hrs30}</span>
                                                    </div>

                                                    <ul className="space-y-1 text-sm">
                                                        {rec.reasons.map((reason, i) => (
                                                            <li key={i} className={`flex items-start gap-2 ${!rec.isFeasible ? 'text-red-700 font-semibold' : 'text-slate-600'}`}>
                                                                {!rec.isFeasible ? <i className="fa-solid fa-xmark mt-1 text-red-500"></i> : <i className="fa-solid fa-check mt-1 text-emerald-500"></i>}
                                                                {reason}
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>

                                                <div className="flex flex-col justify-center items-end gap-3 min-w-[120px]">
                                                    {rec.isFeasible && (
                                                        <div className="text-center bg-white border border-slate-200 rounded-lg px-4 py-2 shadow-sm w-full">
                                                            <div className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Score</div>
                                                            <div className="text-2xl font-black text-slate-800">{rec.score}</div>
                                                        </div>
                                                    )}
                                                    <button
                                                        disabled={!rec.isFeasible || assignments[selectedFlight.id] === rec.crew.id}

                                                            !rec.isFeasible ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 
                                                            assignments[selectedFlight.id] === rec.crew.id ? 'bg-emerald-500 text-white cursor-default shadow' : 
                                                            'bg-slate-900 text-white hover:bg-slate-800 shadow hover:shadow-lg'
                                                        }`}

                                    </div>

                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center text-slate-400 p-8 text-center bg-slate-50/50">
                                    <div className="bg-white p-6 rounded-full shadow-sm border border-slate-100 mb-6">
                                        <i className="fa-solid fa-plane text-4xl text-slate-300"></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-slate-700 mb-2">No Mission Selected</h3>
                                    <p className="text-slate-500 max-w-sm text-sm">Select a tasked KC-135 mission from the left panel to view engine recommendations.</p>

                    </div>
                </div>
            );
        };

        const RainbowView = ({ crews, flights, assignments, onApply, settings }) => {
            const [proposed, setProposed] = useState(null);
            const [unfilled, setUnfilled] = useState([]);

            const handleGenerate = () => {
                let tempAssignments = { ...assignments };
                let projectedHrs = {};
                
                // Track initial 30-day hours
                crews.forEach(c => projectedHrs[c.id] = c.history.hrs30);

                // Add currently assigned flights to projected hours
                flights.forEach(f => {
                    if (tempAssignments[f.id]) {
                        projectedHrs[tempAssignments[f.id]] += f.duration;
                    }
                });

                // Get unassigned flights and sort by longest duration first to fill big blocks initially
                const unassignedFlights = flights.filter(f => !tempAssignments[f.id]).sort((a, b) => b.duration - a.duration);
                const cantFill = [];

                unassignedFlights.forEach(flight => {
                    // Evaluate all crews against the *current* state of tempAssignments (to catch overlaps created during this loop)
                    const evals = crews.map(crew => evaluateCrewForFlight(crew, flight, tempAssignments, flights, settings)).filter(e => e.isFeasible);
                    
                    if (evals.length > 0) {
                        // Rainbow Load Balancing: Sort feasible crews by who has the LEAST projected hours
                        evals.sort((a, b) => projectedHrs[a.crew.id] - projectedHrs[b.crew.id]);
                        const bestCrew = evals[0].crew;
                        
                        // Assign and update projections
                        tempAssignments[flight.id] = bestCrew.id;
                        projectedHrs[bestCrew.id] += flight.duration;
                    } else {
                        cantFill.push(flight);
                    }
                });
                
                setProposed(tempAssignments);
                setUnfilled(cantFill);
            };

            const newAssignmentsCount = proposed ? Object.keys(proposed).length - Object.keys(assignments).length : 0;

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Rainbow & Load Balancing</h2>
                            <p className="text-sm text-slate-500 mt-1">Automatically distribute unassigned missions to balance 30-day flight hours evenly across available crews.</p>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={handleGenerate} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-bold shadow-sm transition-colors flex items-center gap-2">
                                <i className="fa-solid fa-wand-magic-sparkles"></i> Generate Proposal
                            </button>
                            {proposed && newAssignmentsCount > 0 && (
                                <button onClick={() => { onApply(proposed); setProposed(null); }} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold shadow-sm transition-colors flex items-center gap-2">
                                    <i className="fa-solid fa-check-double"></i> Apply Schedule
                                </button>
                            )}
                        </div>
                    </div>

                    {!proposed ? (
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center flex flex-col items-center justify-center text-slate-500 min-h-[400px]">
                            <i className="fa-solid fa-scale-balanced text-5xl mb-4 text-slate-300"></i>
                            <h3 className="text-lg font-bold text-slate-700 mb-2">No Proposal Generated</h3>
                            <p className="max-w-md">Click "Generate Proposal" to analyze the current schedule and automatically distribute remaining missions to the most well-rested crews based on their utilization.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 animate-fade-in-up">
                            <div className="space-y-6">
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                                    <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-chart-bar text-indigo-500"></i> Projected 30-Day Utilization</h3>
                                    <div className="space-y-4">
                                        {crews.map(crew => {
                                            const currentHrs = crew.history.hrs30;
                                            
                                            // Calculate proposed added hours specifically from this rainbow generation
                                            let addedHrs = 0;
                                            flights.forEach(f => {
                                                if (proposed[f.id] === crew.id && !assignments[f.id]) {
                                                    addedHrs += f.duration;
                                                }
                                            });
                                            
                                            const totalProjected = currentHrs + addedHrs;
                                            const limit = settings.thresholds.days30;
                                            const currentPct = Math.min((currentHrs / limit) * 100, 100);
                                            const addedPct = Math.min((addedHrs / limit) * 100, 100 - currentPct);

                                            return (
                                                <div key={crew.id}>
                                                    <div className="flex justify-between text-xs font-bold mb-1">
                                                        <span className="text-slate-700">{crew.crewName}</span>
                                                        <span className="text-slate-500">{totalProjected.toFixed(1)} / {limit}h {addedHrs > 0 && <span className="text-indigo-600">(+{addedHrs.toFixed(1)}h)</span>}</span>
                                                    </div>
                                                    <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden flex">
                                                        <div className="bg-slate-400 h-full transition-all duration-500" style={{width: `${currentPct}%`}}></div>
                                                        <div className="bg-indigo-500 h-full progress-stripes transition-all duration-500" style={{width: `${addedPct}%`}}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                            
                            <div className="space-y-6">
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="p-4 border-b border-slate-200 bg-slate-50">
                                        <h3 className="font-bold text-slate-800"><i className="fa-solid fa-list-check text-emerald-500 mr-2"></i> Proposed Assignments ({newAssignmentsCount})</h3>
                                    </div>
                                    <div className="divide-y divide-slate-100 max-h-[400px] overflow-y-auto">
                                        {flights.filter(f => proposed[f.id] && !assignments[f.id]).length === 0 ? (
                                            <div className="p-6 text-center text-slate-500 text-sm">No new assignments could be generated.</div>
                                        ) : (
                                            flights.filter(f => proposed[f.id] && !assignments[f.id]).map(f => {
                                                const c = crews.find(cr => cr.id === proposed[f.id]);
                                                return (
                                                    <div key={f.id} className="p-4 hover:bg-slate-50 flex justify-between items-center transition-colors">
                                                        <div>
                                                            <div className="font-bold text-slate-800">{f.missionNum} <span className="text-xs text-slate-500 font-normal ml-2">{f.missionType}</span></div>
                                                            <div className="text-xs text-slate-500 mt-0.5">{f.date} | {formatMilTime(f.startTime)} - {formatMilTime(f.endTime)}z</div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-lg text-sm border border-indigo-100">{c?.crewName}</div>
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                </div>

                                {unfilled.length > 0 && (
                                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="p-4 border-b border-slate-200 bg-red-50">
                                            <h3 className="font-bold text-red-800"><i className="fa-solid fa-triangle-exclamation mr-2"></i> Unfillable Sorties ({unfilled.length})</h3>
                                        </div>
                                        <div className="divide-y divide-slate-100 max-h-[200px] overflow-y-auto">
                                            {unfilled.map(f => (
                                                <div key={f.id} className="p-4 hover:bg-red-50/50 flex justify-between items-center transition-colors">
                                                    <div>
                                                        <div className="font-bold text-slate-800">{f.missionNum}</div>
                                                        <div className="text-xs text-slate-500 mt-0.5">Missing qualifications or overlapping constraints.</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };


        const CurrencyView = ({ crews, settings }) => (
            <div className="space-y-6">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <h2 className="text-2xl font-bold text-slate-800">Flight Hours (AFMAN 11-202)</h2>
                    <div className="text-sm text-slate-600 bg-white px-4 py-2 border border-slate-200 rounded-lg shadow-sm font-semibold">
                        <i className="fa-solid fa-scale-balanced text-slate-400 mr-2"></i> Limits: {settings.thresholds.days7}h (7d) | {settings.thresholds.days30}h (30d) | {settings.thresholds.days90}h (90d)
                    </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse whitespace-nowrap">
                            <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider font-bold">
                                    <th className="p-4">Formation</th>
                                    <th className="p-4">Members</th>
                                    <th className="p-4">Last Sortie</th>
                                    <th className="p-4">7-Day</th>
                                    <th className="p-4">30-Day</th>
                                    <th className="p-4">90-Day</th>
                                    <th className="p-4 text-right">Status</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {crews.map(crew => {
                                    const ratio = crew.history.hrs30 / settings.thresholds.days30;
                                    let rowColor = "";
                                    if (ratio >= 0.85) rowColor = "bg-red-50/40";
                                    else if (ratio >= 0.6) rowColor = "bg-amber-50/40";

                                    return (
                                        <tr key={crew.id} className={`hover:bg-slate-50/80 transition-colors ${rowColor}`}>
                                            <td className="p-4 font-black text-slate-800">{crew.crewName}</td>
                                            <td className="p-4 text-xs text-slate-600">{crew.members.map(m=>m.name).join(', ')}</td>
                                            <td className="p-4 text-sm font-mono text-slate-600">{crew.history.lastFlight}</td>
                                            <td className="p-4"><StatusBadge value={crew.history.hrs7} thresholds={settings.thresholds.days7} /></td>
                                            <td className="p-4"><StatusBadge value={crew.history.hrs30} thresholds={settings.thresholds.days30} /></td>
                                            <td className="p-4"><StatusBadge value={crew.history.hrs90} thresholds={settings.thresholds.days90} /></td>
                                            <td className="p-4 text-right">
                                                {ratio >= 0.85 ? <span className="text-red-700 bg-red-100 px-2 py-1 rounded text-xs font-bold border border-red-200"><i className="fa-solid fa-triangle-exclamation"></i> Critical</span> :
                                                 ratio >= 0.6 ? <span className="text-amber-700 bg-amber-100 px-2 py-1 rounded text-xs font-bold border border-amber-200"><i className="fa-solid fa-chart-line"></i> Elevated</span> :
                                                 <span className="text-emerald-700 bg-emerald-100 px-2 py-1 rounded text-xs font-bold border border-emerald-200"><i className="fa-solid fa-check"></i> Nominal</span>}
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        );

        const SimpleListView = ({ title, items, columns, renderRow, icon, onAdd, onEdit, onDelete }) => (
            <div className="space-y-6">
                <div className="flex justify-between items-center">
                    <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-3">
                        <i className={`${icon} text-blue-500 bg-blue-100 p-2 rounded-lg`}></i> {title}
                    </h2>
                    <button onClick={onAdd} className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all shadow-md">
                        <i className="fa-solid fa-plus"></i> Add New
                    </button>
                </div>
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider font-bold">
                                    {columns.map((col, i) => <th key={i} className="p-4">{col}</th>)}
                                    <th className="p-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {items.map((item, idx) => (
                                    <tr key={item.id || idx} className="hover:bg-slate-50 transition-colors group">
                                        {renderRow(item)}
                                        <td className="p-4 text-right whitespace-nowrap">
                                            <div className="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onClick={() => onEdit(item)} className="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded transition-colors"><i className="fa-solid fa-pen"></i></button>
                                                <button onClick={() => onDelete(item)} className="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors"><i className="fa-solid fa-trash"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                                {items.length === 0 && <tr><td colSpan={columns.length + 1} className="p-8 text-center text-slate-400">No records found.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        );


        // --- MAIN APP ---

        function FlightSchedulerApp() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [crews, setCrews] = useState(() => JSON.parse(localStorage.getItem('kc135_crews')) || INITIAL_CREWS);
            const [flights, setFlights] = useState(() => JSON.parse(localStorage.getItem('kc135_flights')) || INITIAL_FLIGHTS);
            const [assignments, setAssignments] = useState(() => JSON.parse(localStorage.getItem('kc135_assignments')) || {});
            const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('kc135_settings')) || INITIAL_SETTINGS);
            
            const [saveStatus, setSaveStatus] = useState('');
            
            // Modal States
            const [modalConfig, setModalConfig] = useState({ isOpen: false, type: null, data: null });
            const [confirmConfig, setConfirmConfig] = useState({ isOpen: false, title: '', message: '', onConfirm: () => {}, isDanger: false });

            useEffect(() => {
                setSaveStatus('Saving...');
                const timer = setTimeout(() => {
                    localStorage.setItem('kc135_crews', JSON.stringify(crews));
                    localStorage.setItem('kc135_flights', JSON.stringify(flights));
                    localStorage.setItem('kc135_assignments', JSON.stringify(assignments));
                    localStorage.setItem('kc135_settings', JSON.stringify(settings));
                    setSaveStatus('Saved Offline');
                    setTimeout(() => setSaveStatus(''), 2000);
                }, 500);
                return () => clearTimeout(timer);
            }, [crews, flights, assignments, settings]);

            const handleAssign = (flightId, crewId) => setAssignments(p => ({...p, [flightId]: crewId}));
            const handleUnassign = (flightId) => { const n = {...assignments}; delete n[flightId]; setAssignments(n); };

            const requestReset = () => {
                setConfirmConfig({
                    isOpen: true,
                    title: "Reset All Data?",
                    message: "This will clear local storage and restore the default demo data. This cannot be undone.",
                    isDanger: true,
                    onConfirm: () => {
                        setCrews(INITIAL_CREWS);
                        setFlights(INITIAL_FLIGHTS);
                        setAssignments({});
                        setSettings(INITIAL_SETTINGS);
                    }
                });
            };

            const handleDeleteCrew = (crew) => {
                setConfirmConfig({
                    isOpen: true,
                    title: "Delete Formation?",
                    message: `Are you sure you want to remove ${crew.crewName}?`,
                    isDanger: true,
                    onConfirm: () => {
                        setCrews(crews.filter(c => c.id !== crew.id));
                        // Remove from assignments
                        const newAss = {...assignments};
                        Object.keys(newAss).forEach(fId => { if (newAss[fId] === crew.id) delete newAss[fId]; });
                        setAssignments(newAss);
                    }
                });
            };

            const handleDeleteFlight = (flight) => {
                setConfirmConfig({
                    isOpen: true,
                    title: "Delete Sortie?",
                    message: `Are you sure you want to remove ${flight.missionNum}?`,
                    isDanger: true,
                    onConfirm: () => {
                        setFlights(flights.filter(f => f.id !== flight.id));
                        // Remove from assignments
                        const newAss = {...assignments};
                        delete newAss[flight.id];
                        setAssignments(newAss);
                    }
                });
            };

            const tabs = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-house' },
                { id: 'schedule', label: 'Scheduling Engine', icon: 'fa-calendar-check' },
                { id: 'rainbow', label: 'Rainbow / Balance', icon: 'fa-wand-magic-sparkles' },
                { id: 'currency', label: 'Flight Hours', icon: 'fa-scale-balanced' },
                { id: 'crews', label: 'Crew Formations', icon: 'fa-users' },
                { id: 'flights', label: 'Tasked Sorties', icon: 'fa-plane' }
            ];

            return (
                <div className="h-screen w-full flex flex-col md:flex-row overflow-hidden">
                    
                    {/* Sidebar */}
                    <nav className="w-full md:w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col shadow-2xl z-20">
                        <div className="p-6 flex items-center gap-3 text-white border-b border-slate-800 bg-slate-950/50">
                            <i className="fa-solid fa-shield-halved text-blue-500 text-2xl"></i>
                            <div>
                                <h1 className="font-black text-xl tracking-tight">STRATO<span className="text-blue-500">SCHED</span></h1>
                                <p className="text-[10px] text-slate-400 uppercase tracking-widest mt-0.5 font-bold">KC-135 Ops</p>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto py-4">
                            <ul className="space-y-1 px-3">
                                {tabs.map(tab => {
                                    const isActive = activeTab === tab.id;
                                    return (
                                        <li key={tab.id}>
                                            <button onClick={() => setActiveTab(tab.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg font-semibold transition-all duration-200 ${isActive ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white text-slate-400'}`}>
                                                <i className={`fa-solid ${tab.icon} w-5 text-center ${isActive ? 'text-blue-200' : ''}`}></i>
                                                {tab.label}
                                            </button>
                                        </li>
                                    );
                                })}
                            </ul>
                        </div>
                        <div className="p-4 border-t border-slate-800 bg-slate-950/30">
                            {saveStatus && <div className="text-xs text-emerald-400 font-bold mb-3 flex items-center gap-2 justify-center"><i className="fa-solid fa-floppy-disk"></i> {saveStatus}</div>}
                            <button onClick={requestReset} className="w-full text-xs font-semibold text-slate-500 hover:text-slate-300 transition-colors py-2"><i className="fa-solid fa-rotate-right mr-1"></i> Reset Demo Data</button>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto p-4 md:p-8 relative">
                        <div className="max-w-7xl mx-auto h-full">
                            {activeTab === 'dashboard' && <DashboardView crews={crews} flights={flights} assignments={assignments} settings={settings} />}
                            {activeTab === 'schedule' && <SchedulerView crews={crews} flights={flights} assignments={assignments} onAssign={handleAssign} onUnassign={handleUnassign} settings={settings} />}
                            {activeTab === 'rainbow' && <RainbowView crews={crews} flights={flights} assignments={assignments} onApply={setAssignments} settings={settings} />}
                            {activeTab === 'currency' && <CurrencyView crews={crews} settings={settings} />}
                            
                            {activeTab === 'crews' && (
                                <SimpleListView 
                                    title="Crew Formations" icon="fa-solid fa-users" items={crews}
                                    onAdd={() => setModalConfig({ isOpen: true, type: 'CREW', data: null })}
                                    onEdit={(c) => setModalConfig({ isOpen: true, type: 'CREW', data: c })}
                                    onDelete={handleDeleteCrew}
                                    columns={['Formation', 'Members', 'Qualifications', 'Duty Window (Z)']}
                                    renderRow={(crew) => (
                                        <>
                                            <td className="p-4 font-black text-slate-800 text-base">{crew.crewName}</td>
                                            <td className="p-4">
                                                <div className="space-y-1">
                                                    {crew.members.map(m => (
                                                        <div key={m.id} className="text-xs">
                                                            <span className="font-bold text-slate-700">{m.name}</span> 
                                                            <span className="text-slate-500 ml-1">({m.role} - Pos {m.posNum})</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </td>
                                            <td className="p-4">
                                                <div className="flex gap-1 flex-wrap">
                                                    {crew.qualifications.length === 0 ? <span className="text-slate-400 text-xs italic">None</span> : 
                                                     crew.qualifications.map(q => <span key={q} className="bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-200 uppercase">{q}</span>)}
                                                </div>
                                            </td>
                                            <td className="p-4 text-xs font-mono text-slate-600 font-semibold">{crew.availability.map((w,i) => <div key={i}>{formatMilTime(w.start)} - {formatMilTime(w.end)}</div>)}</td>
                                        </>
                                    )}
                                />
                            )}

                            {activeTab === 'flights' && (
                                <SimpleListView 
                                    title="Tasked Sorties" icon="fa-solid fa-plane" items={flights}
                                    onAdd={() => setModalConfig({ isOpen: true, type: 'FLIGHT', data: null })}
                                    onEdit={(f) => setModalConfig({ isOpen: true, type: 'FLIGHT', data: f })}
                                    onDelete={handleDeleteFlight}
                                    columns={['Mission', 'Type', 'Date/Time (Z)', 'Req. Quals', 'Status']}
                                    renderRow={(flight) => (
                                        <>
                                            <td className="p-4">
                                                <div className="font-black text-slate-800 text-base">{flight.missionNum}</div>
                                                {flight.callsign && <div className="text-xs font-bold text-slate-500">{flight.callsign}</div>}
                                            </td>
                                            <td className="p-4">
                                                <div className="text-sm font-bold text-slate-700">{flight.missionType}</div>
                                            </td>
                                            <td className="p-4 text-sm font-semibold text-slate-600">
                                                <div>{flight.date}</div>
                                                <div className="font-mono mt-0.5 text-xs text-slate-500">
                                                    Alert: {formatMilTime(flight.alertTime)}<br/>
                                                    {formatMilTime(flight.startTime)} - {formatMilTime(flight.endTime)}
                                                </div>
                                            </td>
                                            <td className="p-4">
                                                <div className="flex gap-1 flex-wrap">
                                                    {flight.reqQualifications.length === 0 ? <span className="text-slate-400 text-xs italic">None</span> :
                                                     flight.reqQualifications.map(q => <span key={q} className="bg-blue-50 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded border border-blue-200 uppercase">{q}</span>)}
                                                </div>
                                            </td>
                                            <td className="p-4">
                                                {assignments[flight.id] ? <span className="text-emerald-700 bg-emerald-50 px-2 py-1 rounded text-xs font-bold border border-emerald-200"><i className="fa-solid fa-check mr-1"></i> Assigned</span> :
                                                 <span className="text-amber-700 bg-amber-50 px-2 py-1 rounded text-xs font-bold border border-amber-200">Unfilled</span>}
                                            </td>
                                        </>
                                    )}
                                />
                            )}
                        </div>
                    </main>

                    {/* Modals */}
                    <Modal 
                        isOpen={modalConfig.isOpen && (modalConfig.type === 'CREW' || modalConfig.type === 'FLIGHT')} 
                        title={modalConfig.type === 'CREW' ? (modalConfig.data ? "Edit Formation" : "Create New Formation") : (modalConfig.data ? "Edit Sortie" : "Task New Sortie")} 
                        onClose={() => setModalConfig({isOpen: false, type: null, data: null})}
                    >
                        {modalConfig.type === 'CREW' && (
                            <CrewForm 
                                initialData={modalConfig.data} 
                                onCancel={() => setModalConfig({isOpen: false, type: null, data: null})}
                                onSave={(newCrew) => {
                                    if (modalConfig.data) {
                                        setCrews(crews.map(c => c.id === newCrew.id ? newCrew : c));
                                    } else {
                                        setCrews([...crews, newCrew]);
                                    }
                                    setModalConfig({isOpen: false, type: null, data: null});
                                }}
                            />
                        )}
                        {modalConfig.type === 'FLIGHT' && (
                            <FlightForm 
                                initialData={modalConfig.data} 
                                onCancel={() => setModalConfig({isOpen: false, type: null, data: null})}
                                onSave={(newFlight) => {
                                    if (modalConfig.data) {
                                        setFlights(flights.map(f => f.id === newFlight.id ? newFlight : f));
                                    } else {
                                        setFlights([...flights, newFlight]);
                                    }
                                    setModalConfig({isOpen: false, type: null, data: null});
                                }}
                            />
                        )}
                    </Modal>

                    <ConfirmModal 
                        isOpen={confirmConfig.isOpen}
                        title={confirmConfig.title}
                        message={confirmConfig.message}
                        isDanger={confirmConfig.isDanger}
                        onConfirm={confirmConfig.onConfirm}
                        onClose={() => setConfirmConfig({...confirmConfig, isOpen: false})}
                    />

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FlightSchedulerApp />);
    </script>
</body>
</html>
